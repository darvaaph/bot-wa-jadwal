<!--
  PORTAL MAHASISWA (REVISI Figma): hanya-baca, tanpa akun. Entry utama di "/".
  Area KM pindah ke /km.html, PJ di /pj.html, System Admin di /system-admin.html (lama: /superadmin.html, tetap dialihkan).
  Gerbang PIN + isi: web/partials/portal/*.html via initPortal() di js/app-portal.js.
-->
<body class="bg-white text-ink min-h-screen" x-data="portalApp()" x-init="initPortal()" @keydown.escape.window="shellCloseDrawer()">
  <div id="portal-gate" x-show="!unlocked"></div>
  <div x-show="unlocked" x-cloak><div id="app-shell"></div></div>
</body>
