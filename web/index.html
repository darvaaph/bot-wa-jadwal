<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#3965FB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Asterisk" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <title>Asterisk — Jadwal & Tugas Kelas</title>
  <script src="/js/theme-init.js?v=20261026-2"></script>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261014" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261013" />
  <link rel="stylesheet" href="/css/style.css?v=20261003" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261003-2" />
  <link rel="stylesheet" href="/css/components.css?v=20261026" />
  <script defer src="/js/vendor/alpine.cdn.min.js?v=3.14.3"></script>
  <script src="/js/api.js?v=20261026-3"></script>
  <script src="/js/shell.js?v=20261026-3"></script>
  <script src="/js/app-portal.js?v=20261026-4"></script>
</head>
<!--
  PORTAL MAHASISWA (REVISI Figma): hanya-baca, tanpa akun. Entry utama di "/".
  Area KM pindah ke /km.html, PJ di /pj.html, System Admin di /system-admin.html (lama: /superadmin.html, tetap dialihkan).
  Gerbang PIN + isi: web/partials/portal/*.html via initPortal() di js/app-portal.js.
-->
<body class="bg-white text-ink min-h-screen" x-data="portalApp()" x-init="initPortal()" @keydown.escape.window="shellCloseDrawer(); classModalOpen = false; tutupDetailSesi(); tutupRiwayatPerubahan(); tutupArsipSemester(); detailMateriModalOpen = false">
  <div id="portal-gate" x-show="!unlocked"></div>
  <div x-show="unlocked" x-cloak><div id="app-shell"></div></div>

  <!-- Modal Global Pilih Kelas Lain -->
  <div x-show="classModalOpen"
       x-cloak
       class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-3 sm:p-4 min-h-[100dvh]"
       x-transition:enter="transition-opacity ease-out duration-200"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       x-transition:leave="transition-opacity ease-in duration-150"
       x-transition:leave-start="opacity-100"
       x-transition:leave-end="opacity-0"
       @keydown.escape.window="classModalOpen = false">

    <!-- Backdrop Gelap (Klik di sini untuk menutup modal) -->
    <div class="fixed inset-0 bg-[#00000080] backdrop-blur-[2px] transition-opacity"
         @click="classModalOpen = false"
         aria-hidden="true"></div>

    <!-- Konten Modal Dialog -->
    <div x-show="classModalOpen"
         x-transition:enter="transition ease-out duration-200 transform"
         x-transition:enter-start="scale-95 opacity-0 translate-y-2"
         x-transition:enter-end="scale-100 opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150 transform"
         x-transition:leave-start="scale-100 opacity-100 translate-y-0"
         x-transition:leave-end="scale-95 opacity-0 translate-y-2"
         class="relative z-10 bg-white rounded-2xl border border-slate-200 max-w-lg w-full flex flex-col shadow-2xl overflow-hidden my-auto"
         style="max-height: min(calc(100dvh - 32px), 640px);"
         @click.stop>

      <!-- Header Modal -->
      <div class="p-4 sm:p-5 border-b border-slate-100 flex items-start justify-between gap-3 shrink-0">
        <div>
          <h3 class="text-[17px] font-bold text-[#0F172A] font-display">Pilih Kelas Perkuliahan</h3>
          <p class="text-[12px] text-[#64748B] mt-0.5">Tentukan kelas Anda untuk melihat jadwal kuliah dan tugas</p>
        </div>
        <button type="button" @click="classModalOpen = false" class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100 transition cursor-pointer" aria-label="Tutup dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Bilah Pencarian & Filter Prodi -->
      <div class="p-4 sm:p-5 pb-3 border-b border-slate-100 flex flex-col gap-3 shrink-0 bg-slate-50">
        <!-- Input Pencarian (Font 16px di mobile mencegah auto-zoom iOS Safari) -->
        <div class="relative w-full">
          <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text"
                 x-model="classModalSearch"
                 placeholder="Cari kelas (contoh: 1A, D3, 2026)..."
                 class="w-full h-10 pl-9 pr-8 bg-white border border-slate-200 rounded-xl text-[16px] sm:text-[13px] text-[#0F172A] placeholder:text-slate-400 focus:outline-none focus:border-[#2563EB] focus:ring-2 focus:ring-blue-100 transition" />
          <button type="button"
                  x-show="classModalSearch"
                  @click="classModalSearch = ''"
                  class="absolute right-2.5 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <!-- Filter Tab Prodi -->
        <div class="flex items-center gap-1.5 p-1 bg-slate-200/60 rounded-xl text-[12px]">
          <button type="button"
                  @click="classModalProdi = 'ALL'"
                  :class="classModalProdi === 'ALL' ? 'bg-white text-[#2563EB] font-bold shadow-xs' : 'text-slate-600 hover:text-slate-900 font-medium'"
                  class="flex-1 h-8 rounded-lg transition-all text-center cursor-pointer">
            Semua (<span x-text="modalProdiCounts ? modalProdiCounts.all : 0"></span>)
          </button>
          <button type="button"
                  @click="classModalProdi = 'D4'"
                  :class="classModalProdi === 'D4' ? 'bg-white text-[#2563EB] font-bold shadow-xs' : 'text-slate-600 hover:text-slate-900 font-medium'"
                  class="flex-1 h-8 rounded-lg transition-all text-center cursor-pointer">
            D4 TI (<span x-text="modalProdiCounts ? modalProdiCounts.d4 : 0"></span>)
          </button>
          <button type="button"
                  @click="classModalProdi = 'D3'"
                  :class="classModalProdi === 'D3' ? 'bg-white text-[#2563EB] font-bold shadow-xs' : 'text-slate-600 hover:text-slate-900 font-medium'"
                  class="flex-1 h-8 rounded-lg transition-all text-center cursor-pointer">
            D3 TI (<span x-text="modalProdiCounts ? modalProdiCounts.d3 : 0"></span>)
          </button>
        </div>
      </div>

      <!-- Daftar Kelas Terformat -->
      <div class="p-3 sm:p-4 overflow-y-auto space-y-2 flex-1" style="max-height: 48vh;">
        <!-- State Loading jika classList belum termuat -->
        <template x-if="!classList || classList.length === 0">
          <div class="py-10 px-4 text-center flex flex-col items-center justify-center gap-2">
            <div class="w-6 h-6 border-2 border-[#2563EB] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-[12px] text-slate-500 font-medium">Memuat daftar kelas...</p>
          </div>
        </template>

        <!-- State Kosong jika pencarian tidak cocok -->
        <template x-if="classList && classList.length > 0 && modalFilteredClasses.length === 0">
          <div class="py-10 px-4 text-center flex flex-col items-center justify-center gap-2">
            <svg class="w-10 h-10 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <p class="text-[13px] font-semibold text-slate-700">Kelas tidak ditemukan</p>
            <p class="text-[11px] text-slate-400">Tidak ada kelas yang cocok dengan kata kunci pencarian Anda.</p>
          </div>
        </template>

        <!-- Daftar Kelas -->
        <template x-for="item in modalFilteredClasses" :key="item.raw">
          <button type="button"
                  @click="pilihKelasModal(item.raw)"
                  :class="selectedClass === item.raw
                    ? 'bg-blue-50/80 border-[#2563EB] ring-2 ring-[#2563EB]/20 shadow-xs'
                    : 'bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50/80'"
                  class="w-full p-3 rounded-xl border text-left flex items-center justify-between gap-3 transition cursor-pointer min-h-[56px] group">
            
            <div class="flex items-center gap-3 min-w-0">
              <!-- Badge Kelas (1A, 2B, dst) -->
              <div :class="selectedClass === item.raw ? 'bg-[#2563EB] text-white' : 'bg-slate-100 text-[#0F172A] group-hover:bg-blue-100 group-hover:text-[#2563EB]'"
                   class="w-11 h-11 rounded-xl flex items-center justify-center font-bold text-[14px] shrink-0 transition-colors">
                <span x-text="item.badge"></span>
              </div>
              
              <!-- Info Program Studi & Semester -->
              <div class="flex flex-col min-w-0">
                <span class="text-[14px] font-bold text-[#0F172A] leading-snug truncate" x-text="item.title"></span>
                <span class="text-[12px] text-[#64748B] leading-tight truncate mt-0.5" x-text="item.subtitle"></span>
              </div>
            </div>

            <!-- Ikon Status Terpilih -->
            <div class="shrink-0 flex items-center">
              <svg x-show="selectedClass === item.raw" class="w-5 h-5 text-[#2563EB]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
          </button>
        </template>
      </div>

      <!-- Footer Info -->
      <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500 shrink-0">
        <span>Menampilkan <strong class="text-slate-800" x-text="(modalFilteredClasses && modalFilteredClasses.length) || 0"></strong> kelas</span>
        <span>Akses tersimpan di perangkat</span>
      </div>

    </div>
  </div>

</body>
</html>
