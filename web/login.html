<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk — Masuk Pengurus</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261003" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261003" />
  <script src="/js/vendor/tailwindcss.play.js?v=20261003"></script>
  <link rel="stylesheet" href="/css/style.css?v=20261003" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261003-2" />
  <link rel="stylesheet" href="/css/components.css?v=20261003-2" />
  <script defer src="/js/vendor/alpine.cdn.min.js?v=20261003"></script>
  <script src="/js/api.js?v=20261003"></script>
  <script src="/js/app-login.js?v=20261003"></script>
</head>
<!--
  MASUK PENGURUS (REVISI Figma): Nomor WhatsApp + Kata sandi (tanpa email).
  Login dan pemulihan kata sandi diverifikasi oleh backend.
-->
<body class="bg-white text-ink min-h-screen" x-data="loginApp()" x-init="initLogin()">
  <div class="min-h-screen grid grid-cols-1 md:grid-cols-2">
    <div class="hidden md:flex flex-col justify-between bg-primary-soft px-12 py-10">
      <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-9 w-auto self-start" />
      <div>
        <h1 class="font-display text-[40px] leading-tight font-bold text-ink">Satu tempat untuk kelas yang lebih teratur.</h1>
        <p class="text-[15px] text-slate-500 mt-3 max-w-md">Tugas, jadwal, materi, dan pengumuman WhatsApp tersusun dalam alur yang mudah diikuti.</p>
        <div class="mt-8 space-y-5 text-[14px]">
          <div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-primary-soft text-primary text-[12px] font-bold flex items-center justify-center shrink-0">01</span><span>Pantau tenggat tugas tanpa terlewat</span></div>
          <div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-primary-soft text-primary text-[12px] font-bold flex items-center justify-center shrink-0">02</span><span>Publikasikan informasi ke WhatsApp</span></div>
          <div class="flex items-center gap-3"><span class="w-8 h-8 rounded-full bg-primary-soft text-primary text-[12px] font-bold flex items-center justify-center shrink-0">03</span><span>Kelola materi dan event kelas</span></div>
        </div>
      </div>
      <p class="text-[12px] text-slate-400">Asterisk · asisten kelas terhubung WhatsApp</p>
    </div>

    <div class="flex flex-col px-6 sm:px-12 py-8 md:justify-center">
      <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-9 w-auto self-start md:hidden" />

      <template x-if="mode === 'masuk'">
        <div class="w-full max-w-md mx-auto md:mx-0 mt-8 md:mt-0">
          <h1 class="font-display text-[28px] font-bold">Masuk Pengurus</h1>
          <p class="text-[13px] text-slate-500 mt-1">Sebagai <strong x-text="roleLabel">-</strong> · Nomor WhatsApp + kata sandi.</p>
          <p id="login-form-error" x-show="formError" class="ui-form-error mt-3" role="alert" x-text="formError">-</p>

          <div class="mt-5">
            <label for="login-nomor" class="block text-[14px] font-bold mb-1">Nomor WhatsApp <span class="text-danger">*</span></label>
            <input id="login-nomor" type="text" x-model="nomor" inputmode="tel" placeholder="0812 3456 7890" :aria-invalid="fieldError === 'nomor'" aria-describedby="login-form-error"
                   class="ui-field w-full text-[14px]"
                   :class="fieldError === 'nomor' ? 'border-red-400' : 'border-border'" />
          </div>
          <div class="mt-4">
            <label for="login-sandi" class="block text-[14px] font-bold mb-1">Kata sandi <span class="text-danger">*</span></label>
            <div class="relative">
              <input id="login-sandi" :type="lihat ? 'text' : 'password'" x-model="sandi" placeholder="••••••••••" :aria-invalid="fieldError === 'sandi'" aria-describedby="login-form-error"
                     class="ui-field w-full pr-11 text-[14px]"
                     :class="fieldError === 'sandi' ? 'border-red-400' : 'border-border'" />
              <button type="button" @click="lihat = !lihat" aria-label="Tampilkan kata sandi" class="ui-button ui-button--ghost absolute right-2 top-1/2 -translate-y-1/2 p-2 min-w-[44px] min-h-[44px] text-primary">
                <span class="material-symbols-outlined" x-text="lihat ? 'visibility_off' : 'visibility'">-</span>
              </button>
            </div>
          </div>
          <button type="button" @click="masuk()" :disabled="loading" class="ui-button ui-button--primary mt-5 w-full text-[15px] font-medium flex items-center justify-center gap-2">
            <span x-show="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span x-text="loading ? 'Memeriksa...' : 'Masuk'">Masuk</span>
          </button>
          <button type="button" @click="mode = 'lupa'" class="ui-button ui-button--outline mt-3 w-full text-primary text-[15px] font-medium">Lupa kata sandi?</button>
          <p class="text-[13px] text-slate-500 mt-5">Akun pengurus dibuat melalui undangan WhatsApp dari System Admin atau Ketua Murid.</p>
          <p class="text-[13px] text-slate-500 mt-2">Mahasiswa tidak perlu login. Buka tautan portal kelas dari grup WhatsApp.</p>
          <a :href="areaUrl" class="mt-4 inline-block text-[13px] text-primary font-semibold hover:underline min-h-[44px]">Lanjut tanpa masuk (pratinjau area)</a>
        </div>
      </template>

      <template x-if="mode === 'pilih'">
        <div class="w-full max-w-md mx-auto md:mx-0 mt-8 md:mt-0">
          <h1 class="font-display text-[28px] font-bold">Pilih Ruang Kerja</h1>
          <p class="text-[13px] text-slate-500 mt-1">Akun Anda terdaftar pada beberapa peran. Pilih ruang kerja yang ingin Anda kelola:</p>
          <p x-show="formError" class="ui-form-error mt-3" role="alert" x-text="formError">-</p>
          <div class="mt-5 space-y-3">
            <template x-for="a in ruangKerja" :key="a.id">
              <div class="ui-card p-4">
                <p class="text-[15px] font-bold" x-text="labelPeran(a.role)">-</p>
                <p class="text-[13px] text-slate-500 mt-0.5" x-text="deskripsiPenugasan(a)">-</p>
                <button type="button" @click="pilihRuangKerja(a)" :disabled="loading" class="ui-button ui-button--primary mt-3 w-full text-[14px] font-semibold">Buka Ruang Kerja</button>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="mode === 'lupa'">
        <div class="w-full max-w-md mx-auto md:mx-0 mt-8 md:mt-0">
          <h1 class="font-display text-[28px] font-bold">Lupa kata sandi?</h1>
          <p class="text-[13px] text-slate-500 mt-1">Kami akan mengirim tautan pemulihan ke WhatsApp akun jika identitas terdaftar dan bot sedang terhubung.</p>
          <p x-show="formError" class="ui-form-error mt-3" role="alert" x-text="formError">-</p>
          <div x-show="!recoverySent" class="mt-5">
            <label for="recovery-identity" class="block text-[14px] font-bold mb-1">Nomor WhatsApp</label>
            <input id="recovery-identity" type="text" x-model="nomor" inputmode="tel" autocomplete="tel" placeholder="0812 3456 7890" class="ui-field w-full text-[16px]" />
            <button type="button" @click="mintaPemulihan()" :disabled="loading" class="ui-button ui-button--primary mt-4 w-full text-[15px] font-medium"><span x-text="loading ? 'Mengirim...' : 'Kirim tautan pemulihan'"></span></button>
          </div>
          <div x-show="recoverySent" class="mt-5 p-5 rounded-2xl border border-border bg-slate-50 text-[13px] text-slate-600" role="status">
            <p class="font-semibold text-ink">Periksa WhatsApp Anda</p>
            <p class="mt-1">Jika akun ditemukan dan bot terhubung, tautan pemulihan telah dikirim. Jika tidak masuk, hubungi System Admin untuk pemulihan manual.</p>
          </div>
          <button type="button" @click="mode = 'masuk'; formError = ''; recoverySent = false" class="ui-button ui-button--ghost mt-4 w-full h-11 rounded-xl border border-border bg-white text-[15px] font-medium min-h-[44px]">Kembali masuk</button>
        </div>
      </template>

      <template x-if="mode === 'reset'">
        <div class="w-full max-w-md mx-auto md:mx-0 mt-8 md:mt-0">
          <h1 class="font-display text-[28px] font-bold">Atur ulang kata sandi</h1>
          <p class="text-[13px] text-slate-500 mt-1">Buat kata sandi baru minimal 12 karakter. Semua sesi lama akan dicabut.</p>
          <p x-show="formError" class="ui-form-error mt-3 text-[13px] text-red-600" role="alert" x-text="formError">-</p>
          <label for="recovery-password" class="block text-[14px] font-bold mt-5 mb-1">Kata sandi baru</label>
          <input id="recovery-password" type="password" x-model="recoveryPassword" minlength="12" autocomplete="new-password" class="ui-field w-full text-[16px]" />
          <label for="recovery-confirm" class="block text-[14px] font-bold mt-4 mb-1">Ulangi kata sandi</label>
          <input id="recovery-confirm" type="password" x-model="recoveryConfirm" minlength="12" autocomplete="new-password" @keydown.enter="aturUlangSandi()" class="ui-field w-full text-[16px]" />
          <button type="button" @click="aturUlangSandi()" :disabled="loading" class="ui-button ui-button--primary mt-5 w-full text-[15px] font-medium"><span x-text="loading ? 'Menyimpan...' : 'Simpan kata sandi baru'"></span></button>
        </div>
      </template>

      <template x-if="mode === 'reset-selesai'">
        <div class="w-full max-w-md mx-auto md:mx-0 mt-8 md:mt-0" role="status">
          <h1 class="font-display text-[28px] font-bold">Kata sandi diperbarui</h1>
          <p class="text-[13px] text-slate-500 mt-2">Silakan masuk kembali menggunakan kata sandi baru.</p>
          <button type="button" @click="mode = 'masuk'; formError = ''" class="ui-button ui-button--primary mt-5 w-full text-[15px] font-medium">Kembali ke halaman masuk</button>
        </div>
      </template>
    </div>
  </div>

  <div x-show="toast.show" x-cloak class="ui-toast fixed bottom-6 right-4 z-50" role="status" aria-live="polite">
    <span x-text="toast.message">-</span>
  </div>
</body>
</html>
