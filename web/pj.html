<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk — Area PJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function() {
      const token = localStorage.getItem('access_token') || localStorage.getItem('token');
      if (!token) {
        window.location.replace('/login.html?role=pj');
      }
    })();
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="/js/api.js?v=20261001"></script>
  <script src="/js/app-pj.js?v=20261001"></script>
</head>
<!--
  AREA PJ (REVISI Figma). Pindah peran KM↔PJ via tautan di layar Akun kedua area.
  Isi per layar: web/partials/pj/*.html dimuat oleh initPJ() di js/app-pj.js.
-->
<body class="bg-white text-[#1F1F1F] min-h-screen" x-data="pjApp()" x-init="initPJ()" @keydown.escape.window="drawer = false">

  <div id="pj-sidebar"></div>

  <div class="md:pl-[248px] flex flex-col min-h-screen min-w-0">
    <div id="pj-topbar"></div>
    <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 md:px-8 py-6 pb-24 md:pb-10">
      <div id="pj-dashboard"></div>
      <div id="pj-tugas"></div>
      <div id="pj-jadwal"></div>
      <div id="pj-dosen"></div>
      <div id="pj-status"></div>
      <div id="pj-notif"></div>
      <div id="pj-akun"></div>
    </main>
  </div>

  <div id="pj-drawer"></div>
  <div id="pj-toast"></div>

</body>
</html>
