<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#3965FB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Asterisk" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
  <title>Asterisk — Aktivasi Undangan Pengurus</title>
  <script src="/js/theme-init.js?v=20261014"></script>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261014" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261013" />
  <link rel="stylesheet" href="/css/style.css?v=20261003" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261003-2" />
  <link rel="stylesheet" href="/css/components.css?v=20261026" />
  <script defer src="/js/vendor/alpine.cdn.min.js?v=3.14.3"></script>
  <script src="/js/api.js?v=20261103"></script>
  <script src="/js/app-invite.js?v=20261105"></script>
</head>
<body class="bg-white text-ink min-h-screen" x-data="inviteApp()" x-init="initInvite()">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-9 w-auto" />
    <div class="ui-card w-full max-w-md mt-6 p-6 sm:p-8">
      <template x-if="!done">
        <div>
          <h1 class="font-display text-[22px] sm:text-[24px] font-bold text-ink">Undangan Pengurus Kelas</h1>
          <p class="text-[13px] text-slate-500 mt-1.5 leading-relaxed">
            Selamat datang! Lengkapi data di bawah ini untuk mengaktifkan akun dan membuka ruang kerja pengurus kelas Anda.
          </p>

          <div x-show="!token" class="ui-form-error mt-4" role="alert">
            Tautan undangan tidak lengkap. Minta tautan baru kepada pengundang (KM atau Administrator).
          </div>

          <div x-show="token">
            <div x-show="formError" class="ui-form-error mt-4" role="alert" x-text="formError">-</div>

            <!-- TAMPILAN 1: Pengguna Sudah Masuk & Siap Menerima Peran (?existing=1) -->
            <div x-show="existingAccount" class="mt-4">
              <div class="rounded-xl border border-blue-200 bg-blue-50/70 p-5 text-center">
                <div class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-blue-100 text-primary">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
                </div>
                <h2 class="mt-2.5 text-[16px] font-semibold text-ink font-display">Terima Peran ke Akun Anda</h2>
                <p class="mt-1.5 text-[13px] text-slate-600">
                  Anda sudah masuk dengan akun penerima. Klik tombol di bawah untuk menambahkan peran pengurus ini ke akun yang sudah ada.
                </p>
                <p class="mt-2 text-[11px] text-slate-500">
                  Kata sandi, nama lengkap, dan sesi aktif Anda tidak akan berubah.
                </p>
              </div>

              <button type="button" @click="aktifkan()" :disabled="loading"
                class="ui-button ui-button--primary mt-4 w-full text-[14px] font-semibold flex items-center justify-center gap-2 cursor-pointer">
                <span x-show="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span x-text="loading ? 'Menambahkan Peran...' : 'Terima Peran Pengurus'">Terima Peran Pengurus</span>
              </button>

              <p class="mt-3 text-center text-[12px] text-slate-500">
                Bukan akun Anda? <a :href="loginUrl()" class="text-primary font-medium hover:underline">Ganti akun penerima</a>
              </p>
            </div>

            <!-- TAMPILAN 2: Pengguna Baru (Aktivasi Akun Baru) -->
            <div x-show="!existingAccount">
              <div class="mt-4 space-y-4">
                <div>
                  <label for="invite-nama" class="block text-[13px] font-medium text-slate-800 mb-1">Nama lengkap <span class="text-danger">*</span></label>
                  <input id="invite-nama" type="text" x-model="nama" placeholder="Contoh: Budi Santoso" autocomplete="name"
                    class="ui-field w-full text-[14px]" />
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label for="invite-sandi" class="block text-[13px] font-medium text-slate-800">
                      Kata sandi baru <span class="text-danger">*</span>
                    </label>
                    <span class="text-[11px] font-mono font-medium transition-colors"
                          :class="sandi.length >= 12 ? 'text-emerald-600 font-semibold' : (sandi.length > 0 ? 'text-amber-600' : 'text-slate-400')"
                          x-show="sandi.length > 0"
                          x-text="sandi.length >= 12 ? '✓ ' + sandi.length + ' karakter' : sandi.length + '/12 karakter'">
                    </span>
                  </div>
                  <div class="relative">
                    <input id="invite-sandi" :type="lihat ? 'text' : 'password'" x-model="sandi" placeholder="Minimal 12 karakter" autocomplete="new-password"
                      class="ui-field w-full pr-11 text-[14px]" />
                    <button type="button" @click="lihat = !lihat"
                            :aria-label="lihat ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#64748B] hover:text-[#1D1B3A] focus:outline-none min-w-[44px] min-h-[44px] justify-center cursor-pointer">
                      <svg x-show="!lihat" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                      <svg x-show="lihat" x-cloak width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499A10.75 10.75 0 0 1 2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.417-5.068"/><line x1="2" x2="22" y1="2" y2="22"/>
                      </svg>
                    </button>
                  </div>
                </div>
                <div>
                  <div class="flex items-center justify-between mb-1">
                    <label for="invite-konfirmasi" class="block text-[13px] font-medium text-slate-800">
                      Konfirmasi kata sandi <span class="text-danger">*</span>
                    </label>
                    <span class="text-[11px] font-medium transition-colors"
                          :class="sandi === konfirmasi ? 'text-emerald-600 font-semibold' : 'text-amber-600'"
                          x-show="konfirmasi.length > 0"
                          x-text="sandi === konfirmasi ? '✓ Cocok' : 'Belum cocok'">
                    </span>
                  </div>
                  <div class="relative">
                    <input id="invite-konfirmasi" :type="lihatKonfirmasi ? 'text' : 'password'" x-model="konfirmasi" placeholder="Ulangi kata sandi" autocomplete="new-password"
                      class="ui-field w-full pr-11 text-[14px]" />
                    <button type="button" @click="lihatKonfirmasi = !lihatKonfirmasi"
                            :aria-label="lihatKonfirmasi ? 'Sembunyikan konfirmasi kata sandi' : 'Tampilkan konfirmasi kata sandi'"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-[#64748B] hover:text-[#1D1B3A] focus:outline-none min-w-[44px] min-h-[44px] justify-center cursor-pointer">
                      <svg x-show="!lihatKonfirmasi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                      <svg x-show="lihatKonfirmasi" x-cloak width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                        <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499A10.75 10.75 0 0 1 2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.417-5.068"/><line x1="2" x2="22" y1="2" y2="22"/>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <button type="button" @click="aktifkan()" :disabled="loading"
                class="ui-button ui-button--primary mt-5 w-full text-[14px] font-semibold flex items-center justify-center gap-2 cursor-pointer">
                <span x-show="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span x-text="loading ? 'Mengaktifkan...' : 'Aktifkan Akun & Masuk'">Aktifkan Akun &amp; Masuk</span>
              </button>

              <div class="relative my-5">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-3 text-slate-400 font-medium">atau</span></div>
              </div>

              <div class="text-center">
                <p class="text-[13px] text-slate-600 font-medium">Sudah memiliki akun pengurus sebelumnya?</p>
                <a :href="loginUrl()" class="mt-2.5 w-full h-[42px] rounded-[10px] border border-slate-300 hover:border-slate-400 bg-white hover:bg-slate-50 text-[13px] font-semibold text-slate-700 hover:text-ink inline-flex items-center justify-center gap-2 transition-all active:scale-[0.99] cursor-pointer shadow-2xs">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
                  <span>Masuk dengan Akun yang Ada</span>
                </a>
              </div>
            </div>

            <!-- Catatan Masa Berlaku Tautan (A11y Compliant Text) -->
            <div class="flex items-center justify-center gap-1.5 text-[12px] text-slate-500 mt-5 pt-3 border-t border-slate-100">
              <svg class="w-3.5 h-3.5 text-slate-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>Tautan berlaku 7 hari sejak diterbitkan.</span>
            </div>
          </div>
        </div>
      </template>

      <template x-if="done">
        <div class="text-center">
          <span class="inline-flex w-14 h-14 rounded-full bg-emerald-100 items-center justify-center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-700" aria-hidden="true">
              <path d="M20 6L9 17l-5-5"/>
            </svg>
          </span>
          <h1 class="font-display text-[24px] font-bold text-ink mt-3" x-text="existingAccount ? 'Peran Berhasil Ditambahkan' : 'Akun Aktif'">Akun aktif</h1>
          <p class="text-[13px] text-slate-500 mt-1" x-text="existingAccount ? 'Peran baru sudah aktif di akun Anda. Masuk untuk membuka ruang kerja.' : 'Peran pengurus sudah ditambahkan ke akun Anda. Masuk untuk membuka ruang kerja.'">Peran pengurus sudah ditambahkan ke akun Anda. Masuk untuk membuka ruang kerja.</p>
          <a href="/login.html" class="ui-button ui-button--primary mt-5 w-full">Masuk Pengurus</a>
        </div>
      </template>
    </div>
  </div>
</body>
</html>
