<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk — Aktivasi Undangan</title>
  <link rel="stylesheet" href="/css/tailwind.css?v=20261003" />
  <link rel="stylesheet" href="/css/fonts.css?v=20261003" />
  <script src="/js/vendor/tailwindcss.play.js?v=20261003"></script>
  <link rel="stylesheet" href="/css/style.css?v=20261003" />
  <link rel="stylesheet" href="/css/tokens.css?v=20261003-2" />
  <link rel="stylesheet" href="/css/components.css?v=20261003-2" />
  <script defer src="/js/vendor/alpine.cdn.min.js?v=20261003"></script>
  <script src="/js/api.js?v=20261003"></script>
  <script src="/js/app-invite.js?v=20261003"></script>
</head>
<body class="bg-white text-ink min-h-screen" x-data="inviteApp()" x-init="initInvite()">
  <div class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
    <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-9 w-auto" />
    <div class="ui-card w-full max-w-md mt-6 p-6 sm:p-8">
      <template x-if="!done">
        <div>
          <h1 class="font-display text-[24px] font-bold text-ink">Undangan Pengurus</h1>
          <p class="text-[13px] text-slate-500 mt-1">Anda menerima undangan sebagai <strong>Ketua Murid</strong> atau <strong>PJ Mata Kuliah</strong>. Detail kelas dan mata kuliah mengikuti pesan undangan dari pengirim.</p>

          <div x-show="!token" class="ui-form-error mt-4" role="alert">
            Tautan undangan tidak lengkap. Minta tautan baru kepada pengundang (KM atau Administrator).
          </div>

          <div x-show="token">
            <div x-show="formError" class="ui-form-error mt-4" role="alert" x-text="formError">-</div>
            <div class="mt-4 space-y-4">
              <div>
                <label for="invite-nama" class="block text-[13px] font-medium mb-1">Nama lengkap <span class="text-danger">*</span></label>
                <input id="invite-nama" type="text" x-model="nama" placeholder="Nama tampilan di kelas" autocomplete="name"
                  class="ui-field w-full text-[14px]" />
              </div>
              <div>
                <label for="invite-sandi" class="block text-[13px] font-medium mb-1">Kata sandi baru (minimal 12 karakter) <span class="text-danger">*</span></label>
                <div class="relative">
                  <input id="invite-sandi" :type="lihat ? 'text' : 'password'" x-model="sandi" placeholder="••••••••••••" autocomplete="new-password"
                    class="ui-field w-full pr-11 text-[14px]" />
                  <button type="button" @click="lihat = !lihat" aria-label="Intip kata sandi" class="ui-button ui-button--ghost absolute right-1 top-1 w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100">
                    <span class="material-symbols-outlined text-[20px]" x-text="lihat ? 'visibility_off' : 'visibility'">-</span>
                  </button>
                </div>
              </div>
              <div>
                <label for="invite-konfirmasi" class="block text-[13px] font-medium mb-1">Konfirmasi kata sandi <span class="text-danger">*</span></label>
                <input id="invite-konfirmasi" :type="lihat ? 'text' : 'password'" x-model="konfirmasi" placeholder="Ulangi kata sandi" autocomplete="new-password"
                  class="ui-field w-full text-[14px]" />
              </div>
            </div>
            <button type="button" @click="aktifkan()" :disabled="loading"
              class="ui-button ui-button--primary mt-5 w-full text-[14px] font-semibold flex items-center justify-center gap-2">
              <span x-show="loading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              <span x-text="loading ? 'Mengaktifkan...' : 'Aktifkan Akun & Masuk'">Aktifkan Akun &amp; Masuk</span>
            </button>
            <p class="text-[11px] text-slate-400 mt-3 text-center">Tautan hanya berlaku 7 hari dan otomatis hangus setelah akun diaktifkan.</p>
          </div>
        </div>
      </template>

      <template x-if="done">
        <div class="text-center">
          <span class="inline-flex w-14 h-14 rounded-full bg-success items-center justify-center"><span class="material-symbols-outlined text-[28px] text-emerald-700">check_circle</span></span>
          <h1 class="font-display text-[24px] font-bold text-ink mt-3">Akun aktif</h1>
          <p class="text-[13px] text-slate-500 mt-1">Peran pengurus sudah ditambahkan ke akun Anda. Masuk untuk membuka ruang kerja.</p>
          <a href="/login.html" class="ui-button ui-button--primary mt-5 w-full">Masuk Pengurus</a>
        </div>
      </template>
    </div>
    <p class="text-[12px] text-slate-400 mt-4 text-center">Sudah punya akun sebelumnya? Tautan yang sama menambahkan peran ini ke akun Anda — <a href="/login.html" class="text-primary font-medium hover:underline">masuk di sini</a> setelah aktivasi.</p>
  </div>
</body>
</html>
