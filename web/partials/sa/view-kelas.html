<!-- partials/sa/view-kelas.html — Superadmin: Daftar, Buat, dan Detail Kelas (100% Persis Figma: classes, classNew, classDetail) -->

<!-- 1. DAFTAR KELAS (Figma: Superadmin / D / Daftar Kelas — id: 620:43110) -->
<section x-show="view === 'kelas'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Daftar kelas</h1>
    <p class="text-[14px] text-[#667085] mt-1">Kelas semester aktif · pengurus melalui undangan WhatsApp.</p>
    
    <!-- Tombol Buat Kelas Baru -->
    <button type="button" @click="go('buat')" class="mt-6 h-11 px-5 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px] inline-flex items-center gap-2">
      <img src="/assets/icons/plus.svg" alt="" class="w-5 h-5 shrink-0" />
      <span>Buat kelas baru</span>
    </button>

    <!-- Grid Kartu Kelas (Figma Hi-Fi: 3 kolom kartu kelas) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6">
      <template x-for="k in filteredKelas()" :key="k.id || k.nama">
        <div class="rounded-2xl border border-[#EEEEEE] overflow-hidden bg-white flex flex-col">
          <!-- Card Header (Lavender Subtle) -->
          <div class="bg-[#E9EAFF] p-6">
            <h2 class="text-[20px] font-bold text-[#1D1B3A]" x-text="k.nama">-</h2>
            <p class="text-[13px] text-[#667085] mt-1">
              <span x-text="k.prodi">Teknik Informatika</span> · Angkatan <span x-text="k.angkatan">2024</span>
            </p>
          </div>
          <!-- Card Body -->
          <div class="p-6 flex-1 flex flex-col justify-between min-h-[140px] bg-white">
            <template x-if="k.statusKM === 'none'">
              <p class="text-[14px] text-[#1F1F1F]">KM belum ditetapkan</p>
            </template>
            <template x-if="k.statusKM === 'active'">
              <p class="text-[14px] text-[#1F1F1F]">KM: <span x-text="k.kmName || 'Raisa Putri'">Raisa Putri</span></p>
            </template>
            <template x-if="k.statusKM === 'pending'">
              <p class="text-[14px] text-[#1F1F1F]">Undangan KM menunggu</p>
            </template>

            <!-- Card Actions -->
            <div class="mt-6">
              <template x-if="k.statusKM === 'none'">
                <button type="button" @click="bukaUndang(k)" class="w-full h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">
                  Undang KM
                </button>
              </template>
              <template x-if="k.statusKM === 'active'">
                <button type="button" @click="bukaDetail(k)" class="w-full h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">
                  Lihat detail
                </button>
              </template>
              <template x-if="k.statusKM === 'pending'">
                <button type="button" @click="bukaUndang(k)" class="w-full h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">
                  Lihat undangan
                </button>
              </template>
            </div>
          </div>
        </div>
      </template>
    </div>
  </div>
</section>

<!-- 2. BUAT KELAS BARU (Figma: Superadmin / D / Buat Kelas — id: 620:44305) -->
<section x-show="view === 'buat'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Buat kelas baru</h1>
    <p class="text-[14px] text-[#667085] mt-1">Kelas dapat dibuat sebelum Ketua Murid diundang.</p>
    
    <div x-show="kelasError" class="mt-4 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="kelasError">-</div>
    
    <div class="space-y-6 mt-6 max-w-2xl">
      <div>
        <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Nama kelas *</label>
        <input type="text" x-model="kelasForm.nama" placeholder="D4 TI 2025 B" class="w-full h-12 px-4 rounded-xl border border-[#EEEEEE] text-[14px] text-[#1F1F1F] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
      </div>
      <div>
        <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Program studi *</label>
        <input type="text" x-model="kelasForm.prodi" placeholder="Teknik Informatika" class="w-full h-12 px-4 rounded-xl border border-[#EEEEEE] text-[14px] text-[#1F1F1F] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
      </div>
      <div>
        <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Angkatan *</label>
        <input type="text" x-model="kelasForm.angkatan" placeholder="2025" class="w-full h-12 px-4 rounded-xl border border-[#EEEEEE] text-[14px] text-[#1F1F1F] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
      </div>
      <div class="flex items-center gap-4 pt-2">
        <button type="button" @click="simpanKelas()" class="h-11 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">Simpan kelas</button>
        <button type="button" @click="go('kelas')" class="h-11 px-8 rounded-xl border border-[#3965FB] text-[#3965FB] hover:bg-[#E9EAFF] text-[14px] font-medium min-h-[44px]">Batal</button>
      </div>
    </div>
  </div>
</section>

<!-- 3. DETAIL KELAS (Figma: Superadmin / D / Detail Kelas — id: 620:44710) -->
<section x-show="view === 'detail'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif" x-text="kelasAktifObj ? kelasAktifObj.nama : 'D4 TI 2024 B'">D4 TI 2024 B</h1>
    
    <div class="mt-4 space-y-1 text-[14px]">
      <p class="text-[#667085]"><span x-text="kelasAktifObj ? kelasAktifObj.prodi : 'Teknik Informatika'">Teknik Informatika</span> · Angkatan <span x-text="kelasAktifObj ? kelasAktifObj.angkatan : '2024'">2024</span></p>
      <p class="text-[#1F1F1F]">KM aktif: <span x-text="kelasAktifObj && kelasAktifObj.kmName ? (kelasAktifObj.kmName + ' · ' + (kelasAktifObj.kmPhone || '0812 3456 7890')) : 'Raisa · 0812 3456 7890'">Raisa · 0812 3456 7890</span></p>
      <p class="text-[#667085]"><span x-text="kelasAktifObj && kelasAktifObj.matkul ? kelasAktifObj.matkul : 7">7</span> mata kuliah · <span x-text="kelasAktifObj && kelasAktifObj.semester ? kelasAktifObj.semester : 'Semester Ganjil 2026/2027'">Semester Ganjil 2026/2027</span></p>
    </div>

    <div class="flex items-center gap-4 mt-8">
      <button type="button" @click="soon('Tampilan portal kelas')" class="h-11 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">Lihat tampilan kelas</button>
      <button type="button" @click="go('kelas')" class="h-11 px-8 rounded-xl border border-[#3965FB] text-[#3965FB] hover:bg-[#E9EAFF] text-[14px] font-medium min-h-[44px]">Kembali ke daftar kelas</button>
    </div>
  </div>
</section>
