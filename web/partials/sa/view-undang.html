<!-- partials/sa/view-undang.html — Superadmin: Undang KM + tautan siap -->
<section x-show="view === 'undang'" x-cloak>
  <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white">
    <h1 class="text-[24px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Undang Ketua Murid</h1>
    <p class="text-[13px] text-slate-500 mt-1"><span class="font-mono" x-text="kelasAktif">-</span> · Kelas ditetapkan oleh Superadmin dan tidak dapat diubah.</p>
    <div x-show="undangError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="undangError">-</div>
    <div class="mt-4">
      <label class="block text-[14px] font-bold mb-1">Nomor WhatsApp calon KM <span class="text-[#FF6C48]">*</span></label>
      <input type="text" x-model="undangNomor" placeholder="0812 3456 7890" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-5 max-w-xl">
      <button type="button" @click="buatUndangKM()" class="h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">Buat tautan undangan</button>
      <button type="button" @click="go('kelas')" class="h-11 rounded-xl border border-[#3965FB] text-[#3965FB] text-[14px] font-medium min-h-[44px]">Batal</button>
    </div>
  </div>
</section>

<section x-show="view === 'undang-siap'" x-cloak>
  <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white text-center max-w-2xl mx-auto">
    <span class="inline-flex w-14 h-14 rounded-full bg-[#E1FFB7] items-center justify-center"><span class="material-symbols-outlined text-[28px] text-emerald-700">check_circle</span></span>
    <h1 class="text-[24px] font-bold mt-3">Undangan KM siap</h1>
    <p class="text-[13px] text-slate-500 mt-1">Kirim tautan berikut ke calon KM via WhatsApp.</p>
    <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-[#EEEEEE] font-mono text-[13px] break-all" x-text="undangLink">-</div>
    <div class="flex flex-col sm:flex-row gap-3 mt-5">
      <button type="button" @click="copyText(undangLink, 'Tautan undangan tersalin.')" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] text-[14px] font-medium min-h-[44px]">Salin tautan</button>
      <button type="button" @click="go('kelas')" class="flex-1 h-11 rounded-xl bg-[#3965FB] text-white text-[14px] font-medium min-h-[44px]">Kembali ke daftar</button>
    </div>
    <p class="text-[11px] text-slate-400 mt-3">Penerbitan undangan permanen butuh endpoint backend.</p>
  </div>
</section>
