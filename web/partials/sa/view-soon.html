<!-- partials/sa/view-soon.html — Superadmin: Status Bot WA + Antrean + Master + Pengguna + Backup -->
<section x-show="view === 'status-bot'" x-cloak>
  <h1 class="text-[26px] md:text-[30px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Status Bot WhatsApp</h1>
  <p class="text-[14px] text-slate-500 mt-1">Koneksi dan sesi bot lintas kelas.</p>
  <div class="mt-5 p-6 rounded-2xl border border-[#EEEEEE] bg-white flex flex-col md:flex-row md:items-center gap-4">
    <span class="w-4 h-4 rounded-full shrink-0" :class="botOnline ? 'bg-emerald-500 animate-pulse' : 'bg-[#FF6C48]'"></span>
    <div class="flex-1">
      <p class="text-[18px] font-bold" x-text="botOnline ? 'Terhubung' : 'Terputus'">-</p>
      <p class="text-[12px] text-slate-500">whatsmeow session · penyambungan ulang mengikuti prosedur server</p>
    </div>
    <button type="button" @click="checkBot()" class="h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-medium min-h-[44px] self-start">Cek ulang</button>
  </div>
</section>

<section x-show="['antrean','master-ruangan','master-matkul','pengguna','backup'].includes(view)" x-cloak>
  <div class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center">
    <span class="material-symbols-outlined text-[36px] text-slate-300">construction</span>
    <p class="text-[15px] font-semibold mt-2" x-text="saTitle(view)">-</p>
    <p class="text-[13px] text-slate-500 mt-1">Fitur belum tersedia — butuh endpoint backend.</p>
  </div>
</section>
