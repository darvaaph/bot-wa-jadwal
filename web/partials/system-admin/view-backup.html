<!-- partials/system-admin/view-backup.html - System Admin: Backup dan Pemulihan Data -->
<section x-show="view === 'backup'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Backup Data</h1>
    <p class="text-[14px] text-[#667085] mt-1">Cadangan snapshot database per kelas dan pemulihan dengan alasan tercatat.</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-8 items-start">
      <div class="p-6 rounded-2xl border border-[#EEEEEE]">
        <h2 class="text-[18px] font-bold text-[#1D1B3A]">Buat cadangan</h2>
        <div x-show="backupError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="backupError">-</div>
        <div class="mt-4 space-y-4">
          <div>
            <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Kelas <span class="text-[#FF6C48]">*</span></label>
            <select x-model="backupForm.kelas" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white">
              <option value="">-- Pilih kelas --</option>
              <template x-for="k in kelasList" :key="k.slug"><option :value="k.slug" x-text="k.nama">-</option></template>
            </select>
          </div>
          <div>
            <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Alasan</label>
            <input type="text" x-model="backupForm.alasan" placeholder="Contoh: Sebelum migrasi semester" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px]" />
          </div>
          <button type="button" @click="buatBackup()" :disabled="backupLoading" class="h-11 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] disabled:opacity-60 text-white text-[14px] font-medium min-h-[44px] flex items-center gap-2">
            <span x-show="backupLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
            <span x-text="backupLoading ? 'Membuat...' : 'Buat cadangan'">Buat cadangan</span>
          </button>
        </div>
        <div x-show="backupHasil" class="mt-4 p-4 rounded-xl bg-[#E8F5E9] border border-green-200 text-[13px] text-[#32704A]">
          <p class="font-bold flex items-center gap-1.5"><span class="material-symbols-outlined">check_circle</span>Cadangan siap</p>
          <p class="mt-1 font-mono break-all" x-text="'ID ' + backupHasil.id + ' · ' + (backupHasil.checksum || '')">-</p>
        </div>
      </div>

      <div class="p-6 rounded-2xl border border-red-200 bg-red-50/40">
        <h2 class="text-[18px] font-bold text-[#A53A32] flex items-center gap-1.5"><span class="material-symbols-outlined">warning</span>Pulihkan cadangan</h2>
        <p class="text-[13px] text-red-800 mt-1">Pemulihan menimpa data berjalan dan tidak dapat dibatalkan langsung.</p>
        <div x-show="restoreError" class="mt-3 p-3 rounded-xl bg-white border border-red-300 text-[13px] text-red-700" x-text="restoreError">-</div>
        <div class="mt-4 space-y-4">
          <div>
            <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">ID cadangan <span class="text-[#FF6C48]">*</span></label>
            <input type="text" x-model="restoreForm.id" placeholder="Contoh: 12" inputmode="numeric" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono bg-white" />
          </div>
          <div>
            <label class="block text-[14px] font-bold text-[#1D1B3A] mb-2">Alasan pemulihan <span class="text-[#FF6C48]">*</span></label>
            <textarea x-model="restoreForm.alasan" rows="2" placeholder="Jelaskan mengapa data dipulihkan" class="w-full p-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white resize-none"></textarea>
          </div>
          <label class="flex items-start gap-2 text-[13px] text-[#1D1B3A] select-none">
            <input type="checkbox" x-model="restoreForm.paham" class="w-4 h-4 mt-0.5 accent-[#A53A32]" />
            Saya memahami pemulihan menimpa data berjalan.
          </label>
          <button type="button" @click="pulihkanBackup()" :disabled="restoreLoading" class="h-11 px-8 rounded-xl border border-[#A53A32] text-[#A53A32] disabled:opacity-60 text-[14px] font-semibold min-h-[44px] flex items-center gap-2 bg-white">
            <span x-show="restoreLoading" class="w-4 h-4 border-2 border-[#A53A32] border-t-transparent rounded-full animate-spin"></span>
            <span x-text="restoreLoading ? 'Memulihkan...' : 'Pulihkan cadangan'">Pulihkan cadangan</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
