<!-- partials/system-admin/view-dashboard.html - System Admin Dashboard: Ringkasan sistem -->
<section x-show="view === 'dashboard'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Ringkasan sistem</h1>
    <p class="text-[14px] text-[#667085] mt-1">Pantau kelas, pengurus, dan pesan bot dalam satu tampilan.</p>

    <!-- 4 Baris Statistik (2x2 Grid) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mt-6">
      <div class="p-6 rounded-2xl bg-[#E9EAFF]">
        <p class="text-[36px] font-bold text-[#1D1B3A] leading-none" x-text="totalKelas">0</p>
        <p class="text-[16px] font-bold text-[#1D1B3A] mt-2">Kelas aktif</p>
        <p class="text-[12px] text-[#667085] mt-1">Terdaftar pada sistem</p>
      </div>
      <div class="p-6 rounded-2xl bg-[#E1FFB7]">
        <p class="text-[36px] font-bold text-[#1D1B3A] leading-none" x-text="kmAktifCount">0</p>
        <p class="text-[16px] font-bold text-[#1D1B3A] mt-2">KM aktif</p>
        <p class="text-[12px] text-[#667085] mt-1">Mengelola kelas kampus</p>
      </div>
      <div class="p-6 rounded-2xl bg-[#FCD484]">
        <p class="text-[36px] font-bold text-[#1D1B3A] leading-none" x-text="kelasTanpaKMCount">0</p>
        <p class="text-[16px] font-bold text-[#1D1B3A] mt-2">Kelas tanpa KM</p>
        <p class="text-[12px] text-[#667085] mt-1">Perlu penetapan pengurus</p>
      </div>
      <div class="p-6 rounded-2xl bg-[#E9EAFF]">
        <p class="text-[36px] font-bold text-[#1D1B3A] leading-none" x-text="undanganMenungguCount">0</p>
        <p class="text-[16px] font-bold text-[#1D1B3A] mt-2">Undangan menunggu</p>
        <p class="text-[12px] text-[#667085] mt-1">Aktivasi melalui WhatsApp</p>
      </div>
    </div>

    <!-- Kondisi bot dan tindakan -->
    <div class="p-6 rounded-2xl border border-[#EEEEEE] bg-white mt-6">
      <div class="flex items-center gap-3">
        <span class="w-3.5 h-3.5 rounded-full shrink-0" :class="getBotStatusColor()"></span>
        <h2 class="text-[18px] font-bold text-[#1D1B3A]" x-text="'Bot WhatsApp: ' + getBotStatusLabel()">Bot WhatsApp</h2>
      </div>
      <p class="text-[13px] text-[#667085] mt-1.5" x-text="botOnline ? 'Koneksi sesi whatsmeow aktif dan siap menyiarkan pesan ke grup kelas.' : 'Status koneksi runtime WhatsApp bot kampus.'"></p>
      <div class="flex flex-wrap items-center gap-3 mt-4">
        <button type="button" @click="go('kelas')" class="h-11 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-medium min-h-[44px]">Buka daftar kelas</button>
        <button type="button" @click="checkBot()" class="h-11 px-6 rounded-xl border border-[#EEEEEE] hover:bg-slate-50 text-[14px] font-medium min-h-[44px]">Periksa status bot</button>
      </div>
    </div>
  </div>
</section>
