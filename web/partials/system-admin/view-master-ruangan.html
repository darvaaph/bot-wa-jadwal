<!-- partials/system-admin/view-master-ruangan.html - System Admin: Master Ruangan Kampus -->
<section x-show="view === 'master-ruangan'" x-cloak>
  <div class="rounded-[24px] border border-[#EEEEEE] bg-white p-6 md:p-10 shadow-sm">
    <h1 class="text-[28px] md:text-[32px] font-bold text-[#1F1F1F]" style="font-family:'Poppins',system-ui,sans-serif">Master Ruangan</h1>
    <p class="text-[14px] text-slate-500 mt-1">Daftar seluruh ruangan kuliah yang bisa dipakai untuk kelas pengganti.</p>

    <div class="mt-6 p-5 rounded-2xl border border-[#EEEEEE] bg-slate-50/60">
      <h2 class="text-[16px] font-bold text-[#1F1F1F]">Tambah Ruangan Baru</h2>
      <div x-show="ruangFormError" class="mt-2 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="ruangFormError">-</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 mt-3">
        <input type="text" x-model="ruangForm.kode" placeholder="Kode *" aria-label="Kode ruangan" class="h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
        <input type="text" x-model="ruangForm.nama" placeholder="Nama ruangan" aria-label="Nama ruangan" class="h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
        <input type="text" x-model="ruangForm.gedung" placeholder="Gedung" aria-label="Gedung" class="h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
        <input type="text" x-model="ruangForm.tipe" placeholder="Tipe (Lab/Teori)" aria-label="Tipe ruangan" class="h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
        <input type="number" x-model="ruangForm.kapasitas" placeholder="Kapasitas" min="0" aria-label="Kapasitas kursi" class="h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
      </div>
      <button type="button" @click="tambahRuang()" class="mt-3 h-11 px-6 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold min-h-[44px]">Tambah Ruangan</button>
    </div>

    <div x-show="ruangLoading" class="p-12 text-center text-slate-500">
      <div class="inline-block w-8 h-8 border-4 border-[#3965FB]/20 border-t-[#3965FB] rounded-full animate-spin"></div>
      <p class="mt-3 text-[14px]">Memuat daftar ruangan...</p>
    </div>
    <div x-show="ruangError" class="mt-6 p-4 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700">
      <span x-text="ruangError">-</span>
      <button type="button" @click="loadRuang()" class="ml-2 font-semibold underline">Coba Lagi</button>
    </div>
    <div x-show="!ruangLoading && !ruangError && ruangList.length === 0" class="p-12 text-center text-slate-500 mt-6 border border-dashed border-[#EEEEEE] rounded-2xl">
      <p class="text-[15px] font-semibold text-[#1F1F1F]">Belum ada ruangan</p>
      <p class="text-[13px] mt-0.5">Tambahkan ruangan pertama di atas.</p>
    </div>
    <div x-show="!ruangLoading && ruangList.length > 0" class="mt-6 overflow-x-auto">
      <table class="w-full text-[13px] min-w-[640px]">
        <thead>
          <tr class="text-left text-slate-500 border-b border-[#EEEEEE]">
            <th class="py-2 pr-3 font-semibold">Kode</th>
            <th class="py-2 pr-3 font-semibold">Nama</th>
            <th class="py-2 pr-3 font-semibold">Gedung</th>
            <th class="py-2 pr-3 font-semibold">Kapasitas</th>
            <th class="py-2 pr-3 font-semibold">Status</th>
            <th class="py-2 font-semibold text-right">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-[#EEEEEE]">
          <template x-for="r in ruangList" :key="r.id">
            <tr>
              <td class="py-3 pr-3 font-mono font-semibold" x-text="r.code">-</td>
              <td class="py-3 pr-3" x-text="r.name || '—'">-</td>
              <td class="py-3 pr-3" x-text="r.building || '—'">-</td>
              <td class="py-3 pr-3" x-text="r.capacity || '—'">-</td>
              <td class="py-3 pr-3">
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-bold"
                  :class="String(r.status).toUpperCase() === 'ACTIVE' ? 'bg-[#E1FFB7] text-green-800' : 'bg-slate-100 text-slate-500'">
                  <span class="material-symbols-outlined text-[12px]">meeting_room</span>
                  <span x-text="String(r.status).toUpperCase() === 'ACTIVE' ? 'Aktif' : 'Nonaktif'">-</span>
                </span>
              </td>
              <td class="py-3 text-right">
                <button type="button" @click="ubahStatusRuang(r)" class="h-10 px-3 rounded-lg border border-[#EEEEEE] text-[12px] font-medium hover:bg-slate-50 min-h-[44px]" x-text="String(r.status).toUpperCase() === 'ACTIVE' ? 'Nonaktifkan' : 'Aktifkan'">-</button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</section>
