<!-- partials/sa/topbar.html — Topbar Superadmin Desktop & Mobile (Figma: Top bar) -->
<header class="sticky top-0 z-30 bg-white border-b border-[#EEEEEE]">
  <div class="flex items-center justify-between gap-4 px-4 md:px-8 h-16 max-w-[1440px] mx-auto w-full">
    <!-- Hamburger button on mobile (Figma: Fixed header / Menu button) -->
    <button type="button" @click="drawer = true" aria-label="Buka menu" class="md:hidden p-2 -ml-2 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100 text-[#1D1B3A]">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Search Input -->
    <div class="relative flex-1 max-w-xl">
      <img src="/assets/icons/search.svg" alt="" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none opacity-60" />
      <input type="text" x-model="q" @keydown.enter="go('kelas')" placeholder="Cari tugas, jadwal, materi..."
             class="w-full h-11 pl-10 pr-4 rounded-xl border border-[#EEEEEE] bg-white text-[14px] text-[#1F1F1F] placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
    </div>

    <!-- Right Controls: Theme Toggle & Bell Notification -->
    <div class="flex items-center gap-3 shrink-0">
      <!-- Theme toggle -->
      <button type="button" @click="soon('Ganti tema')" aria-label="Ganti tema" class="hidden sm:flex items-center justify-center focus:outline-none">
        <img src="/assets/icons/theme-toggle.svg" alt="Theme Toggle" class="h-8 w-auto hover:opacity-90 transition-opacity" />
      </button>

      <!-- Bell notification with red dot -->
      <button type="button" @click="soon('Notifikasi')" aria-label="Notifikasi" class="relative p-2 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl hover:bg-slate-50 text-[#1F1F1F] focus:outline-none">
        <img src="/assets/icons/bell.svg" alt="Notifikasi" class="w-5 h-5" />
        <span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-[#E53935]"></span>
      </button>

      <!-- Account Avatar (Figma: Account avatar) -->
      <button type="button" @click="soon('Profil Superadmin')" aria-label="Profil" class="shrink-0 flex items-center justify-center focus:outline-none ml-1">
        <img src="/assets/icons/avatar.svg" alt="Avatar" class="w-9 h-9 rounded-xl hover:opacity-90 transition-opacity" />
      </button>

      <!-- Logout button -->
      <button type="button" @click="logout()" title="Keluar / Logout" class="h-9 px-3 rounded-xl bg-slate-50 hover:bg-red-50 border border-slate-200 text-slate-600 hover:text-red-600 text-[12px] font-semibold flex items-center gap-1.5 transition ml-1 cursor-pointer">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        <span class="hidden sm:inline">Keluar</span>
      </button>
    </div>
  </div>
</header>
