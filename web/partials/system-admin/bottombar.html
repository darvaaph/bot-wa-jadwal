<!-- partials/system-admin/bottombar.html - Bottom nav mobile System Admin -->
<nav aria-label="Navigasi bawah System Admin" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-[#EEEEEE]">
  <div class="grid grid-cols-4 h-[68px]">
    <!-- 1. Ringkasan -->
    <button type="button" @click="go('dashboard')"
      :class="view === 'dashboard' ? 'text-[#3965FB]' : 'text-slate-500'"
      class="flex flex-col items-center justify-center gap-1 min-h-[44px]">
      <span class="px-4 py-1 rounded-full" :class="view === 'dashboard' ? 'bg-[#E9EAFF]' : ''">
        <span class="material-symbols-outlined text-[20px]">dashboard</span>
      </span>
      <span class="text-[11px] font-semibold">Ringkasan</span>
    </button>

    <!-- 2. Kelas -->
    <button type="button" @click="resetKelasFilter(); go('kelas')"
      :class="isKelasView() ? 'text-[#3965FB]' : 'text-slate-500'"
      class="flex flex-col items-center justify-center gap-1 min-h-[44px]">
      <span class="px-4 py-1 rounded-full" :class="isKelasView() ? 'bg-[#E9EAFF]' : ''">
        <span class="material-symbols-outlined text-[20px]">domain</span>
      </span>
      <span class="text-[11px] font-semibold">Kelas</span>
    </button>

    <!-- 3. Antrean Notifikasi -->
    <button type="button" @click="go('antrean')"
      :class="view === 'antrean' ? 'text-[#3965FB]' : 'text-slate-500'"
      class="relative flex flex-col items-center justify-center gap-1 min-h-[44px]">
      <span class="px-4 py-1 rounded-full" :class="view === 'antrean' ? 'bg-[#E9EAFF]' : ''">
        <span class="material-symbols-outlined text-[20px]">forward_to_inbox</span>
      </span>
      <span class="text-[11px] font-semibold">Antrean</span>
      <span x-show="failedCount > 0" class="absolute top-1 right-1/2 translate-x-5 min-w-[18px] h-4 px-1 rounded-full bg-[#E53935] text-white text-[10px] font-bold flex items-center justify-center" x-text="failedCount > 50 ? '50+' : failedCount">0</span>
    </button>

    <!-- 4. Menu Lainnya (Drawer) -->
    <button type="button" @click="drawer = true" aria-label="Menu lainnya"
      class="relative flex flex-col items-center justify-center gap-1 min-h-[44px] text-slate-500">
      <span class="px-4 py-1 rounded-full">
        <span class="material-symbols-outlined text-[20px]">more_horiz</span>
      </span>
      <span class="text-[11px] font-semibold">Lainnya</span>
      <span x-show="kelasTanpaKMCount > 0" class="absolute top-1.5 right-1/2 translate-x-5 w-2 h-2 rounded-full bg-amber-500" title="Ada kelas tanpa KM"></span>
    </button>
  </div>
</nav>
