<!-- partials/sa/sidebar.html — Sidebar Superadmin Desktop (Figma: UI / Sidebar / Role / Superadmin) -->
<aside class="hidden md:flex flex-col w-[248px] fixed left-0 top-0 h-screen bg-white border-r border-[#EEEEEE] px-4 py-6 z-40 overflow-y-auto">
  <!-- Brand Logo -->
  <div class="flex items-center px-3">
    <img src="/assets/icons/asterisk-logo.svg" alt="Asterisk" class="h-8 w-auto" />
  </div>

  <!-- Navigation -->
  <nav aria-label="Navigasi Superadmin" class="mt-8 flex flex-col gap-1 text-[14px]">
    <!-- Section SUPERADMIN -->
    <p class="px-3 pb-1 text-[11px] font-semibold tracking-wider text-[#667085]">SUPERADMIN</p>
    <button type="button" @click="go('dashboard')"
      :class="view === 'dashboard' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/home.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'dashboard' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Dashboard</span>
    </button>

    <!-- Section ADMINISTRASI -->
    <p class="px-3 pt-4 pb-1 text-[11px] font-semibold tracking-wider text-[#667085]">ADMINISTRASI</p>
    <button type="button" @click="go('kelas')"
      :class="['kelas','buat','detail'].includes(view) ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/classes.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="['kelas','buat','detail'].includes(view) ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Daftar Kelas</span>
    </button>
    <button type="button" @click="go('status-bot')"
      :class="view === 'status-bot' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/bot.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'status-bot' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Status Bot WhatsApp</span>
    </button>
    <button type="button" @click="go('antrean')"
      :class="view === 'antrean' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/message-queue.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'antrean' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Antrean Pesan</span>
    </button>

    <!-- Section DATA & SISTEM -->
    <p class="px-3 pt-4 pb-1 text-[11px] font-semibold tracking-wider text-[#667085]">DATA &amp; SISTEM</p>
    <button type="button" @click="go('master-ruangan')"
      :class="view === 'master-ruangan' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/room.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'master-ruangan' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Master Ruangan</span>
    </button>
    <button type="button" @click="go('master-matkul')"
      :class="view === 'master-matkul' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/book.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'master-matkul' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Master Mata Kuliah</span>
    </button>
    <button type="button" @click="go('pengguna')"
      :class="view === 'pengguna' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/people.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'pengguna' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Kelola Pengguna</span>
    </button>
    <button type="button" @click="go('backup')"
      :class="view === 'backup' ? 'bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'text-[#1F1F1F] hover:bg-slate-50'"
      class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
      <img src="/assets/icons/backup.svg" alt="" class="w-5 h-5 shrink-0 transition-all"
        :style="view === 'backup' ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
      <span>Backup Data</span>
    </button>
  </nav>

  <!-- Role Identity Footer -->
  <div class="mt-auto pt-6 text-[13px] px-3 border-t border-[#EEEEEE]">
    <div class="flex items-center justify-between gap-2">
      <div class="truncate">
        <p class="font-semibold text-[#1F1F1F] truncate" x-text="currentUser ? currentUser.display_name : 'Superadmin'">Superadmin</p>
        <p class="text-[12px] text-[#667085] mt-0.5 font-mono truncate" x-text="currentUser ? currentUser.identity_key : 'Pengelola sistem'">Pengelola sistem</p>
      </div>
      <button type="button" @click="logout()" title="Keluar dari akun" class="p-1.5 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-600 transition-colors shrink-0">
        <span class="material-symbols-outlined text-[18px]">logout</span>
      </button>
    </div>
  </div>
</aside>
