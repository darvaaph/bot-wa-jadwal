<div x-show="dukunganMasihAktif()" x-cloak class="w-full border-b border-[#FCD34D] bg-[#FFFBEB] px-4 py-3 sm:px-6 lg:px-7" role="region" aria-label="Mode Dukungan aktif">
  <div class="flex min-w-0 flex-col gap-3 xl:flex-row xl:items-center xl:justify-between xl:gap-5">
    <div class="flex min-w-0 items-start gap-3">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-[#FDE68A] bg-[#FEF3C7] text-[#B45309]" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" focusable="false"><path d="M12 2.5 20 6v6c0 5-3.2 8.2-8 10-4.8-1.8-8-5-8-10V6l8-3.5Z"/></svg>
      </span>
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
          <span class="font-display break-words text-[16px] font-semibold leading-snug text-[#78350F] sm:text-[18px]">Mode Dukungan Aktif: <span x-text="namaDukungan()"></span></span>
          <span class="shrink-0 rounded-full border border-[#FDE68A] bg-[#FEF3C7] px-2.5 py-1 font-jbmono text-[12px] text-[#92400E]" aria-live="off" x-text="'Sisa ' + dukunganHitungMundur()"></span>
        </div>
        <p class="mt-1 break-words text-[13px] leading-relaxed text-[#92400E]">Alasan: <span x-text="dukunganAktif ? dukunganAktif.reason : ''"></span> · S.d. <span x-text="dukunganJam()"></span></p>
      </div>
    </div>
    <div class="flex min-w-0 flex-wrap gap-2 sm:gap-2.5">
      <button type="button" @click="bukaKelasDukungan()" class="ui-button ui-button--secondary min-h-[44px] border-[#CBD5E1] px-3.5 text-[13px] sm:px-4">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg>Kelola Kelas
      </button>
      <a :href="urlRuangKerjaKM()" class="ui-button ui-button--primary min-h-[44px] px-3.5 text-[13px] sm:px-4">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4h7v7M20 4l-9 9"/><path d="M20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h6"/></svg>Ruang Kerja KM
      </a>
      <button type="button" @click="bukaAuditSesi()" class="ui-button min-h-[44px] border-[#FCD34D] bg-white px-3.5 text-[13px] text-[#92400E] hover:bg-amber-50 sm:px-4">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M15 3v5h4M9 12h6M9 16h6"/></svg>Audit Sesi
      </button>
      <button type="button" @click="keluarDukungan()" :disabled="dukunganLoading" class="ui-button min-h-[44px] border-[#DC2626] bg-[#DC2626] px-3.5 text-[13px] text-white hover:bg-[#B91C1C] disabled:opacity-60 sm:px-4">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 5 19 19M19 5 5 19"/></svg><span x-text="dukunganLoading ? 'Keluar...' : 'Keluar Dukungan'"></span>
      </button>
    </div>
  </div>
</div>
<div x-show="dukunganError" x-cloak class="w-full border-b border-[#FCD34D] bg-[#FFFBEB] px-4 py-2 text-[13px] text-[#78350F] sm:px-6 lg:px-7" role="alert">
  <span x-text="dukunganError"></span>
  <button type="button" @click="muatDukunganAktif()" class="ml-2 min-h-[44px] font-semibold underline">Coba lagi</button>
</div>
