<!-- partials/view-jadwal.html — VIEW: JADWAL (kalender mingguan dari /api/schedule) -->
<section x-show="activeView === 'jadwal'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
    <div>
      <h1 class="text-[26px] md:text-[30px] font-bold text-[#1D1B3A]" style="font-family:'Poppins',sans-serif">Manajemen Jadwal</h1>
      <p class="text-[14px] text-slate-500 mt-1">Kalender kelas, ruangan, dan perubahan terkini</p>
    </div>
    <button type="button" @click="switchView('dosen')" class="h-11 px-5 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-semibold self-start min-h-[44px]">Pindah jadwal</button>
  </div>

  <div class="flex items-center gap-3 mt-5">
    <button type="button" @click="shiftWeek(-1)" aria-label="Minggu lalu" class="w-11 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] flex items-center justify-center hover:bg-[#E9EAFF]"><span class="material-symbols-outlined">chevron_left</span></button>
    <span class="text-[14px] font-medium" x-text="weekLabel">-</span>
    <button type="button" @click="shiftWeek(1)" aria-label="Minggu depan" class="w-11 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] flex items-center justify-center hover:bg-[#E9EAFF]"><span class="material-symbols-outlined">chevron_right</span></button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mt-4 items-start">
    <div class="lg:col-span-3 p-5 rounded-2xl border border-[#EEEEEE] bg-white overflow-x-auto">
      <h2 class="text-[18px] font-semibold text-[#1D1B3A]">Kalender mingguan</h2>
      <p class="text-[12px] text-slate-500">Data jadwal reguler dari API. Slot kosong = tidak ada sesi tercatat.</p>
      <div class="grid grid-cols-5 gap-2 mt-4 min-w-[640px]">
        <template x-for="d in weekDays" :key="d.name">
          <div class="text-center text-[12px] font-medium text-[#1F1F1F] bg-slate-50 rounded-lg py-2">
            <span x-text="d.name">-</span> <span class="text-slate-400" x-text="d.dateNum">-</span>
          </div>
        </template>
        <template x-for="slot in ['08','10','13','15']" :key="slot">
          <template x-for="d in weekDays" :key="d.name + slot">
            <div class="rounded-lg p-2 min-h-[64px] text-[11px] leading-snug"
                 :class="sessionAt(d.name, slot) ? 'bg-[#E9EAFF]' : 'bg-[#E1FFB7]'">
              <p class="font-mono font-semibold text-[#3965FB]" x-text="slot + '.00'">-</p>
              <p class="font-medium text-[#1F1F1F] line-clamp-2" x-text="sessionAt(d.name, slot) ? sessionAt(d.name, slot).matkul : 'Kosong'">-</p>
            </div>
          </template>
        </template>
      </div>
    </div>
    <div class="p-5 rounded-2xl border border-[#EEEEEE] bg-white">
      <h2 class="text-[18px] font-semibold text-[#1D1B3A] text-center">Ruangan tersedia</h2>
      <p class="text-[11px] text-slate-400 text-center mt-1">Data internal — konfirmasi ke TU sebelum dipakai.</p>
      <div class="divide-y divide-[#EEEEEE] mt-2">
        <template x-for="r in roomList" :key="r">
          <div class="py-3"><p class="text-[14px] font-medium" x-text="r">-</p><p class="text-[12px] text-slate-500">tercatat di jadwal</p></div>
        </template>
        <div x-show="roomList.length === 0" class="py-4 text-center text-[12px] text-slate-400">Belum ada data ruangan.</div>
      </div>
    </div>
  </div>
</section>
