<aside class="hidden md:flex flex-col fixed left-0 top-0 h-screen bg-white border-r border-border py-5 z-40 overflow-y-auto scroll-slim transition-[width,padding] duration-300" :class="sidebarCollapsed ? 'w-[76px] px-3 sidebar-collapsed' : 'w-[248px] px-4'" aria-label="Navigasi utama">
  <button type="button" @click="toggleSidebar()" :aria-expanded="String(!sidebarCollapsed)" :aria-label="sidebarCollapsed ? 'Lebarkan navigasi' : 'Ciutkan navigasi'" :title="sidebarCollapsed ? 'Lebarkan navigasi' : 'Ciutkan navigasi'" class="flex items-center min-w-[44px] min-h-[44px] rounded-xl hover:bg-slate-50" :class="sidebarCollapsed ? 'justify-center self-start' : 'justify-start w-full px-2'">
    <img src="/assets/icons/logo.svg" alt="Asterisk" :class="sidebarCollapsed ? 'h-8 w-8 object-left object-cover' : 'h-9 w-auto'" />
  </button>
  <nav aria-label="Navigasi utama" class="mt-6 flex flex-col gap-1 text-[14px]">
    <template x-for="section in shellNavSections()" :key="section.title">
      <div class="contents">
        <p class="sidebar-section px-3 pt-4 pb-1 text-[11px] font-semibold tracking-wider text-muted" x-text="section.title"></p>
        <template x-for="item in section.items" :key="item.id">
          <button type="button" @click="shellGo(item)" :title="sidebarCollapsed ? item.label : ''" :aria-label="sidebarCollapsed ? item.label : null" :aria-current="shellIsActive(item) ? 'page' : null" :class="shellIsActive(item) ? 'bg-primary-soft text-primary-hover font-semibold' : 'text-ink hover:bg-slate-50'" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px]">
            <span class="ui-icon" :class="shellIconClass(item)" aria-hidden="true"></span>
            <span class="sidebar-label" x-text="item.label"></span>
          </button>
        </template>
      </div>
    </template>
  </nav>
  <div class="mt-auto pt-4 px-2 border-t border-border">
    <label x-show="shellRoleKey !== 'portal' && contextAssignments && contextAssignments.length > 1" class="sidebar-footer-text block pb-3 text-[11px] font-semibold text-muted">Ruang kerja
      <select :value="meCache?.active_assignment?.id || ''" @change="switchContextById($event.target.value)" :disabled="contextSwitching" class="ui-field mt-1 text-[12px]">
        <template x-for="a in contextAssignments || []" :key="a.id"><option :value="a.id" x-text="contextLabel(a)"></option></template>
      </select>
    </label>
    <p class="sidebar-footer-text text-[13px] font-semibold text-ink truncate" x-text="shellIdentity().label + ' · ' + shellIdentity().detail"></p>
    <p class="sidebar-footer-text text-[12px] text-muted truncate" x-text="shellIdentity().sub"></p>
    <button type="button" @click="shellRoleKey === 'portal' ? kunciPortal() : logout()" :title="shellRoleKey === 'portal' ? 'Kunci portal' : 'Keluar dari akun'" :aria-label="shellRoleKey === 'portal' ? 'Kunci portal' : 'Keluar dari akun'" class="mt-2 min-w-[44px] min-h-[44px] flex items-center gap-2 rounded-lg text-muted hover:text-danger">
      <span class="material-symbols-outlined" x-text="shellRoleKey === 'portal' ? 'lock' : 'logout'"></span><span class="sidebar-footer-text" x-text="shellRoleKey === 'portal' ? 'Kunci portal' : 'Keluar'"></span>
    </button>
  </div>
</aside>

<div class="flex flex-col min-h-screen min-w-0 bg-canvas transition-[padding] duration-300" :class="sidebarCollapsed ? 'md:pl-[76px]' : 'md:pl-[248px]'" :inert="drawer">
  <header class="sticky top-0 z-30 bg-white border-b border-border">
    <div class="flex items-center gap-2 md:gap-3 px-4 md:px-8 h-16 max-w-[1280px] mx-auto w-full min-w-0">
      <button type="button" @click="shellOpenDrawer($event)" aria-label="Buka menu" :aria-expanded="String(drawer)" class="md:hidden min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100"><span class="material-symbols-outlined">menu</span></button>
      <div class="relative flex-1 min-w-0 max-w-xl">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none text-muted" aria-hidden="true">search</span>
        <input type="search" x-model="q" @keydown.enter="shellSearch()" :aria-label="shellRoleKey === 'sa' ? 'Cari kelas' : 'Cari tugas atau jadwal'" :placeholder="shellRoleKey === 'sa' ? 'Cari kelas' : 'Cari tugas atau jadwal'" class="ui-field h-11 pl-10" />
      </div>
      <span class="hidden sm:flex items-center gap-1.5 text-[12px] text-muted shrink-0" :title="shellRoleKey === 'portal' ? 'Status bot tidak tersedia' : botOnline ? 'Bot terhubung' : 'Bot terputus'"><span class="w-2 h-2 rounded-full" :class="shellRoleKey === 'portal' ? 'bg-slate-400' : botOnline ? 'bg-emerald-600' : 'bg-danger'" aria-hidden="true"></span><span x-text="shellRoleKey === 'portal' ? 'Status bot tidak tersedia' : botOnline ? 'Bot terhubung' : 'Bot terputus'"></span></span>
      <button type="button" @click="shellGo({id: shellBellTarget()})" :aria-label="shellRoleKey === 'sa' ? 'Buka antrean notifikasi' : shellRoleKey === 'portal' ? 'Buka perubahan terbaru' : 'Buka notifikasi'" class="relative min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl hover:bg-slate-50">
        <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
        <span x-show="shellAttentionCount() > 0" class="absolute top-0 right-0 min-w-[18px] h-[18px] px-1 rounded-full bg-danger text-ink text-[10px] font-bold flex items-center justify-center" x-text="shellAttentionCount() > 9 ? '9+' : shellAttentionCount()"></span>
      </button>
      <span class="hidden md:flex min-w-[44px] min-h-[44px] items-center justify-center rounded-xl bg-primary-soft text-primary-hover text-[12px] font-bold" :title="shellIdentity().label" x-text="shellIdentity().short"></span>
    </div>
  </header>
  <div id="{{prefix}}-banner"></div>
  <main id="main-content" tabindex="-1" class="flex-1 w-full min-w-0 max-w-[1280px] mx-auto px-4 md:px-8 py-6 pb-24 md:pb-10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary">
    <div x-show="view === '__error' && pageState" x-cloak class="ui-empty max-w-[480px]" role="alert">
      <div class="w-28 h-28 mx-auto rounded-full bg-primary-soft flex items-center justify-center text-primary text-[32px] font-bold" x-text="pageState?.status === 'offline' ? '↯' : pageState?.status"></div>
      <h1 class="mt-6 text-[24px] font-bold text-ink" x-text="pageState?.status === 'offline' ? 'Koneksi terputus' : pageState?.status === '404' ? 'Halaman tidak ditemukan' : 'Ada gangguan server'"></h1>
      <p class="mt-2 text-muted" x-text="pageState?.status === 'offline' ? 'Periksa jaringan internet Anda, lalu coba memuat ulang.' : pageState?.status === '404' ? 'Tautan mungkin sudah berubah.' : 'Data belum berhasil dimuat. Coba lagi beberapa saat.'"></p>
      <button type="button" @click="pageState?.status === '404' ? go('dashboard') : location.reload()" class="ui-button ui-button--primary mt-8" x-text="pageState?.status === '404' ? 'Kembali ke Ringkasan' : 'Coba lagi'"></button>
    </div>
    <div x-show="dashboardLoading && view !== '__error'" x-cloak role="status" aria-label="Memuat ringkasan"><span class="sr-only">Memuat ringkasan</span><div class="ui-skeleton h-8 w-2/3"></div><div class="ui-skeleton h-4 w-1/3 mt-3"></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6" aria-hidden="true"><div class="ui-skeleton h-[120px]"></div><div class="ui-skeleton h-[120px]"></div><div class="ui-skeleton h-[120px]"></div></div></div>
    {{viewSlots}}
  </main>
</div>

<div x-show="drawer" x-cloak x-transition.opacity class="fixed inset-0 bg-black/50 z-40 md:hidden" @click="shellCloseDrawer()" aria-hidden="true"></div>
<aside x-show="drawer" x-cloak x-transition:enter="transition ease-out duration-300 transform" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200 transform" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full" @keydown="shellTrapDrawer($event)" class="ui-drawer scroll-slim fixed left-0 top-0 z-50 md:hidden flex flex-col px-4 py-5" role="dialog" aria-modal="true" :aria-label="'Menu ' + shellIdentity().label">
  <div class="flex items-center justify-between px-2"><img src="/assets/icons/logo.svg" alt="Asterisk" class="h-7 w-auto" /><button type="button" data-drawer-close @click="shellCloseDrawer()" aria-label="Tutup menu" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100"><span class="material-symbols-outlined">close</span></button></div>
  <nav aria-label="Navigasi mobile" class="mt-6 flex flex-col gap-1 text-[14px]">
    <template x-for="section in shellNavSections()" :key="section.title"><div class="contents"><p class="px-3 pt-4 pb-1 text-[11px] font-semibold tracking-wider text-muted" x-text="section.title"></p><template x-for="item in section.items" :key="item.id"><button type="button" @click="shellGo(item)" :aria-current="shellIsActive(item) ? 'page' : null" :class="shellIsActive(item) ? 'bg-primary-soft text-primary-hover font-semibold' : 'text-ink hover:bg-slate-50'" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px]"><span class="ui-icon" :class="shellIconClass(item)" aria-hidden="true"></span><span x-text="item.label"></span></button></template></div></template>
  </nav>
  <div class="mt-auto pt-4 px-2 border-t border-border text-[13px]">
    <label x-show="shellRoleKey !== 'portal' && contextAssignments && contextAssignments.length > 1" class="block pb-3 text-[11px] font-semibold text-muted">Ruang kerja<select :value="meCache?.active_assignment?.id || ''" @change="switchContextById($event.target.value)" :disabled="contextSwitching" class="ui-field mt-1"><template x-for="a in contextAssignments || []" :key="a.id"><option :value="a.id" x-text="contextLabel(a)"></option></template></select></label>
    <p class="font-semibold text-ink truncate" x-text="shellIdentity().label + ' · ' + shellIdentity().detail"></p><p class="text-muted truncate" x-text="shellIdentity().sub"></p>
    <button type="button" @click="shellRoleKey === 'portal' ? kunciPortal() : logout()" class="mt-2 min-h-[44px] text-danger font-semibold" x-text="shellRoleKey === 'portal' ? 'Kunci portal / Ganti kelas' : 'Keluar dari akun'"></button>
  </div>
</aside>

<nav aria-label="Navigasi bawah" :inert="drawer" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-border pb-[env(safe-area-inset-bottom)]">
  <div class="grid grid-cols-4 h-[68px]">
    <template x-for="item in shellBottomNav()" :key="item.id"><button type="button" @click="shellGo(item, $event)" :aria-current="shellBottomIsActive(item) ? 'page' : null" :aria-label="item.label" :class="shellBottomIsActive(item) ? 'text-primary-hover' : 'text-muted'" class="min-w-0 min-h-[44px] flex flex-col items-center justify-center gap-1 text-center"><span class="px-3 py-1 rounded-full" :class="shellBottomIsActive(item) ? 'bg-primary-soft' : ''"><span class="material-symbols-outlined text-[20px]" aria-hidden="true" x-text="item.icon"></span></span><span class="text-[11px] font-semibold truncate max-w-full px-1" x-text="item.label"></span></button></template>
  </div>
</nav>

<div x-show="toast.show" x-cloak role="status" aria-live="polite" class="ui-toast fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 flex items-center gap-2"><span class="material-symbols-outlined text-[18px] text-success" aria-hidden="true">info</span><span x-text="toast.message"></span></div>
