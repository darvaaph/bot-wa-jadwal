  <template x-if="shellRoleKey !== 'sa'">

</div>

<div x-show="drawer" x-cloak x-transition.opacity class="fixed inset-0 bg-black/50 z-40 md:hidden" @click="shellCloseDrawer()" aria-hidden="true"></div>
<aside x-show="drawer" x-cloak x-transition:enter="transition ease-out duration-300 transform" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0" x-transition:leave="transition ease-in duration-200 transform" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full" @keydown="shellTrapDrawer($event)" class="ui-drawer scroll-slim fixed left-0 top-0 z-50 md:hidden flex flex-col px-4 py-5" role="dialog" aria-modal="true" :aria-label="'Menu ' + shellIdentity().label">
  <template x-if="shellRoleKey === 'sa'">
    <div class="contents">
      <div class="flex items-center gap-3 px-1">
        <span class="flex items-center justify-center w-11 h-11 rounded-2xl bg-primary text-white shrink-0" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 4v16M5 8l14 8M19 8 5 16"/></svg>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block text-[17px] font-bold text-ink leading-tight truncate">Bot Jadwal</span>
          <span class="block text-[13px] font-semibold text-primary leading-tight">System Admin</span>
        </span>
        <button type="button" data-drawer-close @click="shellCloseDrawer()" aria-label="Tutup menu" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100 shrink-0"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="mt-5 rounded-2xl border border-border px-3 py-3">
        <p class="text-[11px] font-semibold tracking-wider text-slate-500">LINGKUP KERJA</p>
        <label class="relative mt-1.5 flex items-center gap-2 min-h-[44px]">
          <span class="text-primary shrink-0" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 21V5.5A1.5 1.5 0 0 1 5.5 4h9A1.5 1.5 0 0 1 16 5.5V21"/><path d="M2.5 21h17"/><path d="M16 9.5h2.3a1 1 0 0 1 1 1V21"/><path d="M7.2 7.5h1.6M7.2 11h1.6M7.2 14.5h1.6M11.2 7.5h1.6M11.2 11h1.6M11.2 14.5h1.6"/></svg>
          </span>
          <span class="sr-only">Lingkup kerja</span>
          <select x-model="lingkupKelas" @change="onLingkupChange()" class="w-full min-w-0 appearance-none bg-transparent pr-6 text-[14px] font-bold text-ink truncate cursor-pointer rounded-lg">
            <option value="">Seluruh Kampus</option>
            <template x-for="k in kelasList" :key="k.slug"><option :value="k.slug" x-text="k.nama"></option></template>
          </select>
          <span class="pointer-events-none absolute right-0 text-slate-500" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg>
          </span>
        </label>
      </div>
      <nav aria-label="Navigasi mobile" class="mt-2 flex flex-col text-[14px]">
        <template x-for="section in shellNavSections()" :key="section.title"><div class="contents"><p class="px-3 pt-5 pb-1.5 text-[12px] font-semibold tracking-wider text-slate-500" x-text="section.title"></p><div class="flex flex-col gap-1"><template x-for="item in section.items" :key="item.id"><button type="button" @click="shellGo(item)" :aria-current="shellIsActive(item) ? 'page' : null" :class="shellIsActive(item) ? 'bg-primary-faint text-primary font-semibold' : 'text-slate-600 hover:bg-slate-100 font-medium'" class="flex items-center gap-3 px-3 rounded-xl text-left min-h-[44px]"><span x-show="!item.icon" class="ui-icon" :class="shellIconClass(item)" aria-hidden="true"></span><span x-show="item.icon" x-html="saIcon(item)" aria-hidden="true"></span><span x-text="item.label"></span></button></template></div></div></template>
      </nav>
      <div class="mt-auto pt-4 mt-6 border-t border-border">
        <div class="flex items-center gap-3 px-1">
          <span class="flex items-center justify-center w-11 h-11 rounded-full bg-primary-soft text-primary text-[14px] font-bold shrink-0" aria-hidden="true" x-text="saInitials()"></span>
          <span class="min-w-0 flex-1">
            <span class="block text-[14px] font-bold text-ink leading-tight truncate" x-text="shellIdentity().detail"></span>
            <span class="block text-[12px] text-muted leading-tight truncate" x-text="shellIdentity().sub"></span>
          </span>
          <button type="button" @click="logout()" title="Keluar dari akun" aria-label="Keluar dari akun" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-xl text-muted hover:text-danger hover:bg-slate-100 shrink-0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H14"/><path d="M10 12h10M18 8.5 21.5 12 18 15.5"/></svg>
          </button>
        </div>
      </div>
    </div>
  </template>
  <template x-if="shellRoleKey !== 'sa'">
    <div class="contents">
      <div class="flex items-center justify-between px-2"><img src="/assets/icons/logo.svg" alt="Asterisk" class="h-7 w-auto" /><button type="button" data-drawer-close @click="shellCloseDrawer()" aria-label="Tutup menu" class="min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100"><span class="material-symbols-outlined">close</span></button></div>
      <nav aria-label="Navigasi mobile" class="mt-6 flex flex-col gap-1 text-[14px]">
        <template x-for="section in shellNavSections()" :key="section.title"><div class="contents"><p class="px-3 pt-4 pb-1 text-[11px] font-semibold tracking-wider text-muted" x-text="section.title"></p><template x-for="item in section.items" :key="item.id"><button type="button" @click="shellGo(item)" :aria-current="shellIsActive(item) ? 'page' : null" :class="shellIsActive(item) ? 'bg-primary-soft text-primary-hover font-semibold' : 'text-ink hover:bg-slate-50'" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px]"><span class="ui-icon" :class="shellIconClass(item)" aria-hidden="true"></span><span x-text="item.label"></span></button></template></div></template>
      </nav>
      <div class="mt-auto pt-4 px-2 border-t border-border text-[13px]">
        <label x-show="shellRoleKey !== 'portal' && contextAssignments && contextAssignments.length > 1" class="block pb-3 text-[11px] font-semibold text-muted">Ruang kerja<select :value="meCache?.active_assignment?.id || ''" @change="switchContextById($event.target.value)" :disabled="contextSwitching" class="ui-field mt-1"><template x-for="a in contextAssignments || []" :key="a.id"><option :value="a.id" x-text="contextLabel(a)"></option></template></select></label>
        <p class="font-semibold text-ink truncate" x-text="shellIdentity().label + ' · ' + shellIdentity().detail"></p><p class="text-muted truncate" x-text="shellIdentity().sub"></p>
        <button type="button" @click="shellRoleKey === 'portal' ? kunciPortal() : logout()" class="mt-2 min-h-[44px] text-danger font-semibold" x-text="shellRoleKey === 'portal' ? 'Kunci portal / Ganti kelas' : 'Keluar dari akun'"></button>
      </div>
    </div>
  </template>
</aside>

<nav aria-label="Navigasi bawah" :inert="drawer" class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-border pb-[env(safe-area-inset-bottom)]">
  <div class="grid grid-cols-4 h-[68px]">
    <template x-for="item in shellBottomNav()" :key="item.id"><button type="button" @click="shellGo(item, $event)" :aria-current="shellBottomIsActive(item) ? 'page' : null" :aria-label="item.label" :class="shellBottomIsActive(item) ? 'text-primary-hover' : 'text-muted'" class="min-w-0 min-h-[44px] flex flex-col items-center justify-center gap-1 text-center"><span class="px-3 py-1 rounded-full" :class="shellRoleKey === 'sa' ? '' : (shellBottomIsActive(item) ? 'bg-primary-soft' : '')"><span x-show="shellRoleKey === 'sa'" x-html="saTabIcon(item)" aria-hidden="true"></span><span x-show="shellRoleKey !== 'sa'" class="material-symbols-outlined text-[20px]" aria-hidden="true" x-text="item.icon"></span></span><span class="text-[11px] font-semibold truncate max-w-full px-1" x-text="item.label"></span></button></template>
  </div>
</nav>

<div x-show="toast.show" x-cloak role="status" aria-live="polite" class="ui-toast fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 flex items-center gap-2"><span class="material-symbols-outlined text-[18px] text-success" aria-hidden="true">info</span><span x-text="toast.message"></span></div>
