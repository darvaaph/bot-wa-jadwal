<!-- partials/common/sidebar.html — Sidebar desktop generik (PJ). Menu dari navSections di js/app-*.js -->
<aside class="hidden md:flex flex-col fixed left-0 top-0 h-screen bg-white border-r border-border py-6 z-40 overflow-y-auto transition-[width,padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)]" :class="sidebarCollapsed ? 'w-[76px] px-3 sidebar-collapsed' : 'w-[248px] px-4'" aria-label="Navigasi utama">
  <div class="flex items-center px-3" :class="sidebarCollapsed ? 'justify-center px-0' : ''">
    <button type="button" @click="toggleSidebar()" :aria-expanded="!sidebarCollapsed ? 'true' : 'false'" :aria-label="sidebarCollapsed ? 'Lebarkan navigasi' : 'Ciutkan navigasi'" :title="sidebarCollapsed ? 'Lebarkan navigasi' : 'Ciutkan navigasi'" class="rounded-xl p-1 hover:bg-slate-50 transition-colors cursor-pointer">
      <span class="block overflow-hidden transition-[width] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)]" :class="sidebarCollapsed ? 'w-[32px]' : 'w-[140px]'">
        <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-8 w-auto max-w-none object-left" />
      </span>
    </button>
  </div>
  <nav aria-label="Navigasi utama" class="mt-8 flex flex-col gap-1 text-[14px]">
    <template x-for="(section, si) in navSections" :key="section.title">
      <div class="contents">
        <p class="sidebar-section px-3 pb-1 text-[11px] font-semibold tracking-wider text-muted" :class="si > 0 ? 'pt-4' : ''" x-text="section.title">-</p>
        <template x-for="item in section.items" :key="item.id">
          <button type="button" @click="go(item.id)" :title="sidebarCollapsed ? item.label : ''" :aria-current="isActive(item) ? 'page' : null"
            :class="isActive(item) ? 'bg-primary-soft text-primary font-semibold' : 'text-ink hover:bg-slate-50'"
            class="group flex items-center gap-3 px-3 py-2.5 rounded-xl text-left min-h-[44px] transition-colors">
            <img :src="item.img" alt="" class="w-5 h-5 shrink-0 transition-all" :style="isActive(item) ? 'filter: invert(36%) sepia(82%) saturate(2329%) hue-rotate(222deg) brightness(99%) contrast(98%);' : ''" />
            <span class="sidebar-label" x-text="item.label">-</span>
          </button>
        </template>
      </div>
    </template>
  </nav>
  <div class="mt-auto pt-6 text-[13px] px-3 border-t border-border">
    <label x-show="!sidebarCollapsed && contextAssignments && contextAssignments.length > 1" class="sidebar-footer-text block pb-3 text-[11px] font-semibold text-muted">
      Ruang kerja
      <select :value="meCache && meCache.active_assignment ? meCache.active_assignment.id : ''" @change="switchContextById($event.target.value)" :disabled="contextSwitching"
        class="mt-1 w-full min-h-[44px] rounded-xl border border-border bg-white px-2 text-[12px] text-ink focus:outline-none focus:ring-2 focus:ring-primary disabled:opacity-60">
        <template x-for="a in contextAssignments" :key="a.id"><option :value="a.id" x-text="contextLabel(a)"></option></template>
      </select>
    </label>
    <div class="sidebar-footer flex items-center justify-between gap-2" :class="sidebarCollapsed ? 'justify-center' : 'justify-between'">
      <div class="sidebar-footer-text truncate" x-show="!sidebarCollapsed">
        <p class="font-semibold text-ink truncate"><span x-text="roleLabel">-</span> · <span x-text="selectedClass || '—'">—</span></p>
        <p class="text-[12px] text-muted mt-0.5 font-mono truncate" x-text="roleSub">-</p>
      </div>
      <button type="button" @click="logout()" title="Keluar dari akun" :aria-label="'Keluar dari akun ' + roleLabel"
              class="p-1.5 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-600 transition-colors shrink-0 min-w-[44px] min-h-[44px] flex items-center justify-center cursor-pointer">
        <span class="material-symbols-outlined text-[18px]">logout</span>
      </button>
    </div>
  </div>
</aside>
