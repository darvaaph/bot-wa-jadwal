<!-- partials/common/state-error.html — State galat halaman (500/luring/404). Dibaca dari `pageState.status`; tampil saat `view === '__error'`. -->
<div x-show="view === '__error' && pageState && pageState.status === '500'" x-cloak class="py-16 px-6">
  <div class="max-w-[480px] mx-auto flex flex-col items-center text-center">
    <div class="w-[180px] h-[180px] rounded-full bg-[#E9EAFF] flex items-center justify-center">
      <span class="font-bold text-[#3965FB] text-[48px] leading-none" style="font-family:'Poppins',sans-serif">500</span>
    </div>
    <h1 class="text-[24px] font-bold text-[#1F1F1F] mt-8" style="font-family:'Poppins',sans-serif">Ada gangguan server</h1>
    <p class="text-[14px] text-slate-500 mt-2">Data belum berhasil dimuat. Coba lagi beberapa saat.</p>
    <button type="button" @click="location.reload()" class="mt-10 h-12 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[15px] font-semibold min-h-[44px] min-w-[280px] transition-colors">Coba lagi</button>
  </div>
</div>
<div x-show="view === '__error' && pageState && pageState.status === 'offline'" x-cloak class="py-16 px-6">
  <div class="max-w-[480px] mx-auto flex flex-col items-center text-center">
    <div class="w-[180px] h-[180px] rounded-full bg-[#E9EAFF] flex items-center justify-center">
      <svg viewBox="0 0 24 24" fill="#3965FB" class="w-12 h-12" aria-hidden="true"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
    </div>
    <h1 class="text-[24px] font-bold text-[#1F1F1F] mt-8" style="font-family:'Poppins',sans-serif">Koneksi terputus</h1>
    <p class="text-[14px] text-slate-500 mt-2">Periksa jaringan internet Anda, lalu coba memuat ulang.</p>
    <button type="button" @click="location.reload()" class="mt-10 h-12 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[15px] font-semibold min-h-[44px] min-w-[280px] transition-colors">Coba lagi</button>
  </div>
</div>
<div x-show="view === '__error' && pageState && pageState.status === '404'" x-cloak class="py-16 px-6">
  <div class="max-w-[480px] mx-auto flex flex-col items-center text-center">
    <div class="w-[180px] h-[180px] rounded-full bg-[#E9EAFF] flex items-center justify-center">
      <span class="font-bold text-[#3965FB] text-[48px] leading-none" style="font-family:'Poppins',sans-serif">404</span>
    </div>
    <h1 class="text-[24px] font-bold text-[#1F1F1F] mt-8" style="font-family:'Poppins',sans-serif">Halaman tidak ditemukan</h1>
    <p class="text-[14px] text-slate-500 mt-2">Tautan mungkin sudah berubah. Kembali ke halaman utama untuk melanjutkan.</p>
    <button type="button" @click="go('dashboard')" class="mt-10 h-12 px-8 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[15px] font-semibold min-h-[44px] min-w-[280px] transition-colors">Kembali ke Dashboard</button>
  </div>
</div>
