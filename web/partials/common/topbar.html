<!-- partials/common/topbar.html — Topbar generik (KM/PJ). Badge role dari roleLabel di js/app-*.js -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#EEEEEE]">
  <div class="flex items-center gap-3 px-4 md:px-8 h-16 max-w-[1280px] mx-auto w-full">
    <button type="button" @click="drawer = true" aria-label="Buka menu" class="md:hidden p-2 -ml-2 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="relative flex-1 max-w-xl">
      <img src="/assets/icons/search.svg" alt="" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" />
      <input type="text" x-model="q" @keydown.enter="go('tugas')" placeholder="Cari tugas, jadwal, materi..."
             class="w-full h-11 pl-10 pr-4 rounded-xl border border-[#EEEEEE] bg-white text-[14px] focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
    </div>
    <div class="ml-auto flex items-center gap-1.5 shrink-0">
      <button type="button" @click="go('notifikasi')" aria-label="Notifikasi" class="relative w-11 h-11 flex items-center justify-center rounded-full hover:bg-slate-100 text-[#1F1F1F]"><img src="/assets/icons/bell.svg" alt="" class="w-5 h-5" /><span x-show="unreadCount > 0" class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#FF6C48]"></span></button>
      <button type="button" @click="go('akun')" aria-label="Akun" class="w-9 h-9 rounded-full bg-[#E9EAFF] text-[#3965FB] font-bold text-[13px] flex items-center justify-center" x-text="roleLabel">-</button>
      <button type="button" @click="logout()" title="Keluar / Logout" class="h-9 px-3 rounded-xl bg-slate-50 hover:bg-red-50 border border-slate-200 text-slate-600 hover:text-red-600 text-[12px] font-semibold flex items-center gap-1.5 transition ml-1 cursor-pointer">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        <span class="hidden sm:inline">Keluar</span>
      </button>
    </div>
  </div>
</header>
