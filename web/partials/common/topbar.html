<!-- partials/common/topbar.html — Topbar generik (KM/PJ). Badge role dari roleLabel di js/app-*.js -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-border">
  <div class="flex items-center gap-3 px-4 md:px-8 h-16 max-w-[1280px] mx-auto w-full">
    <button type="button" @click="drawer = true" aria-label="Buka menu" class="md:hidden p-2 -ml-2 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="relative flex-1 max-w-xl min-w-0">
      <button type="button" @click="go('akun')" class="w-full h-11 px-3 rounded-xl border border-border bg-white text-left flex items-center gap-2 min-h-[44px] hover:bg-slate-50">
        <span class="w-2 h-2 rounded-full shrink-0" :class="botOnline ? 'bg-emerald-500' : 'bg-danger'" aria-hidden="true"></span>
        <span class="sr-only" x-text="botOnline ? 'Bot terhubung' : 'Bot terputus'"></span>
        <span class="min-w-0 truncate text-[14px] font-semibold" x-text="(selectedClass || '—') + ' · ' + roleLabel">-</span>
        <span class="hidden sm:inline shrink-0 text-[12px] text-slate-500 truncate" x-text="activeSemesterLabel">-</span>
      </button>
    </div>
    <div class="ml-auto flex items-center gap-1.5 shrink-0">
      <button x-show="pinnedNav('notifikasi')" type="button" @click="go('notifikasi')" aria-label="Notifikasi" class="relative w-11 h-11 flex items-center justify-center rounded-full hover:bg-slate-100 text-ink"><img src="/assets/icons/bell.svg" alt="" class="w-5 h-5" /><span x-show="attentionCount > 0" class="absolute top-2 right-2 min-w-[16px] h-4 px-1 rounded-full bg-danger text-white text-[10px] font-bold flex items-center justify-center" x-text="attentionCount > 9 ? '9+' : attentionCount">-</span></button>
      <button type="button" @click="go('akun')" aria-label="Akun" class="w-9 h-9 rounded-full bg-primary-soft text-primary font-bold text-[13px] flex items-center justify-center" x-text="roleLabel">-</button>
      <button type="button" @click="logout()" title="Keluar / Logout" class="h-9 px-3 rounded-xl bg-slate-50 hover:bg-red-50 border border-slate-200 text-slate-600 hover:text-red-600 text-[12px] font-semibold flex items-center gap-1.5 transition ml-1 cursor-pointer">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        <span class="hidden sm:inline">Keluar</span>
      </button>
    </div>
  </div>
</header>
