<!-- partials/portal/gate.html — Gerbang PIN portal kelas -->
<div class="min-h-screen flex flex-col">
  <div class="flex justify-end p-4">
    <button type="button" @click="soon('Ganti tema')" aria-label="Ganti tema" class="w-11 h-11 flex items-center justify-center rounded-full bg-[#E9EAFF] text-[#3965FB]"><span class="material-symbols-outlined">light_mode</span></button>
  </div>
  <div class="flex-1 flex flex-col items-center justify-center px-4 pb-16">
    <img src="/assets/icons/logo.svg" alt="Asterisk" class="h-12 w-auto" />
    <div class="w-full max-w-md mt-10 p-6 rounded-2xl border border-[#EEEEEE] bg-white">
      <h1 class="text-[22px] font-bold">Portal <span x-text="selectedClass || 'kelas'">-</span></h1>
      <p class="text-[13px] text-slate-500 mt-1">Masukkan 6 digit kode akses kelas untuk melanjutkan. Akses akan diingat selama 30 hari.</p>
      <div x-show="pinError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="pinError">-</div>
      <label class="block text-[14px] font-bold mt-4 mb-1">Kode akses kelas <span class="text-[#FF6C48]">*</span></label>
      <input type="text" x-model="pin" inputmode="numeric" maxlength="6" placeholder="2 4 8 1 6 9"
             class="w-full h-12 px-3 rounded-xl border border-[#EEEEEE] text-[16px] font-mono tracking-[0.3em] text-center focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
      <button type="button" @click="bukaPortal()" class="mt-4 w-full h-12 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[15px] font-medium min-h-[44px]">Buka portal</button>
      <p class="text-[11px] text-slate-400 mt-3 text-center">Pratinjau lokal — verifikasi kode butuh endpoint backend.</p>
    </div>
  </div>
</div>
