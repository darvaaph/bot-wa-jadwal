<!-- partials/portal/view-materi.html — Portal Materi per jenis -->
<section x-show="view === 'materi'" x-cloak>
  <h1 class="font-display text-[26px] md:text-[30px] font-bold">Materi</h1>
  <p class="text-[14px] text-slate-500 mt-1">Materi dan tautan kelas.</p>
  <div x-show="materiLoading" class="mt-5 py-6 text-center text-[13px] text-slate-400">Memuat materi...</div>
  <div x-show="!materiLoading && materiList.length === 0" class="ui-card mt-5 p-10 text-center">
    <img src="/assets/illustrations/empty-folder.svg" alt="" class="w-16 h-16 mx-auto opacity-70" />
    <p class="text-[15px] font-semibold mt-3">Belum ada materi</p>
    <p class="text-[13px] text-slate-500">Materi dari pengurus kelas akan muncul di sini.</p>
  </div>
  <div x-show="!materiLoading && materiList.length > 0" class="mt-4 space-y-4">
    <template x-for="g in materiGrup" :key="g.jenis">
      <div class="ui-card p-5">
        <h2 class="text-[16px] font-semibold" x-text="g.jenis">-</h2>
        <div class="mt-2 divide-y divide-border">
          <template x-for="m in g.items" :key="m.id">
            <div class="py-3">
              <p class="text-[14px] font-medium" x-text="m.title">-</p>
              <p x-show="m.description" class="text-[12px] text-slate-500 mt-0.5" x-text="m.description">-</p>
              <a x-show="m.url" :href="m.url" target="_blank" rel="noopener noreferrer" class="text-[13px] text-primary font-medium hover:underline break-all" x-text="m.url">-</a>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>
</section>
