<!-- partials/portal/view-materi.html — Repositori & Modul Kuliah (SCR-USER-MAT-001 & SCR-USER-MAT-002) -->
<section x-show="view === 'materi'" x-cloak class="w-full flex flex-col gap-[20px] md:gap-[24px]">

  <!-- Judul dan pengantar materi (Desktop: SCR-USER-MAT-001) -->
  <div class="hidden md:flex flex-col gap-[5px] justify-start items-start w-full">
    <h1 class="text-[25px] leading-tight text-[#0F172A] font-heading font-bold text-left">
      Materi &amp; Modul Kuliah
    </h1>
    <p class="text-[12px] text-[#64748B] font-medium text-left">
      Kumpulan modul, slide presentasi dosen, dan rekaman kuliah <span x-text="selectedClassFormatted">D4-TI 1A</span>.
    </p>
  </div>

  <!-- Judul dan pengantar materi (Mobile: SCR-USER-MAT-001 Mobile 375) -->
  <div class="flex md:hidden flex-col gap-[3px] justify-start items-start w-full">
    <h1 class="text-[20px] leading-tight text-[#0F172A] font-heading font-bold text-left">
      Materi Kuliah
    </h1>
    <p class="text-[11px] text-[#64748B] font-medium text-left">
      <span x-text="filteredMateriList.length">28</span> berkas untuk <span x-text="selectedClassFormatted">D4-TI 1A</span>
    </p>
  </div>

  <!-- Kolom Pencarian Cepat (Mobile & Tablet/Desktop) -->
  <div class="w-full relative">
    <div class="relative flex items-center w-full">
      <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" />
        </svg>
      </div>
      <input type="text" x-model="searchMateriQuery"
        placeholder="Cari materi, topik, atau mata kuliah..."
        class="w-full h-[44px] pl-10 pr-10 bg-white border border-slate-200 rounded-[12px] text-[13px] text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-2xs">
      <button type="button" x-show="searchMateriQuery" @click="searchMateriQuery = ''" x-cloak
        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer">
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Area gulir filter mata kuliah satu baris (Mobile) -->
  <div class="relative flex lg:hidden w-full">
    <div class="flex w-full overflow-x-auto no-scrollbar py-0.5 pr-8 scroll-smooth">
      <div class="flex flex-row gap-[8px] shrink-0 items-center">
        <template x-for="cat in materiCategories" :key="'mob-cat-' + cat.key">
          <button type="button" @click="filterMateriMatkul = cat.key"
            :class="filterMateriMatkul === cat.key ? 'bg-[#2563EB] text-[#FFFFFF] border-[#2563EB] font-bold shadow-xs' : 'bg-[#FFFFFF] text-[#334155] border-[#E2E8F0] font-semibold hover:bg-slate-50'"
            class="h-[38px] min-h-[38px] shrink-0 flex items-center justify-center px-[13px] border rounded-full text-[12px] whitespace-nowrap transition-all cursor-pointer active:scale-95">
            <span x-text="cat.shortLabel">Semua</span>
            <span class="ml-1 text-[10px] opacity-80 font-mono" x-text="'(' + cat.count + ')'">(28)</span>
          </button>
        </template>
      </div>
    </div>
    <!-- Efek fade kanan halus penanda daftar masih bisa digulir -->
    <div class="pointer-events-none absolute right-0 top-0 bottom-0 w-8 bg-gradient-to-l from-slate-50/90 to-transparent"></div>
  </div>

  <!-- Filter dan daftar berkas dua panel (Desktop & Tablet) -->
  <div class="w-full flex flex-col lg:flex-row gap-[24px] justify-start items-start">

    <!-- Panel Filter Mata Kuliah (Desktop Left Panel: w-[256px]) -->
    <div
      class="hidden lg:flex w-[256px] shrink-0 [box-shadow:0px_2px_8px_#0F172A08] flex-col gap-[14px] p-[20px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[16px]">
      <div
        class="text-[11px] text-[#64748B] font-bold tracking-[0.6px] text-left uppercase whitespace-nowrap">
        MATA KULIAH
      </div>
      <div class="w-full flex flex-col gap-[6px] justify-start items-start">
        <template x-for="cat in materiCategories" :key="'desk-cat-' + cat.key">
          <button type="button" @click="filterMateriMatkul = cat.key"
            :class="filterMateriMatkul === cat.key ? 'bg-[#EFF6FF] text-[#1D4ED8]' : 'bg-[#FFFFFF] hover:bg-slate-50 text-[#475569]'"
            class="w-full h-[44px] shrink-0 flex flex-row gap-[8px] px-[12px] justify-between items-center rounded-[12px] cursor-pointer transition-colors text-left">
            <div :class="filterMateriMatkul === cat.key ? 'text-[#1D4ED8] font-bold' : 'text-[#475569] font-medium'"
              class="text-[11px] leading-[14px] flex-1 truncate"
              x-text="cat.label">
              Semua Materi
            </div>
            <div :class="filterMateriMatkul === cat.key ? 'text-[#1D4ED8]' : 'text-[#64748B]'"
              class="text-[11px] font-mono font-semibold whitespace-nowrap shrink-0" x-text="cat.count">
              28
            </div>
          </button>
        </template>
      </div>
    </div>

    <!-- Panel Daftar Berkas Materi (Desktop: Card Panel / Mobile: Flat Container) -->
    <div
      class="flex-1 w-full lg:[box-shadow:0px_2px_8px_#0F172A08] flex flex-col gap-[14px] p-0 lg:p-[24px] justify-start items-start lg:bg-[#FFFFFF] lg:[outline:1px_solid_#E2E8F0] lg:[outline-offset:-0.5px] lg:rounded-[16px]">

      <!-- Kepala daftar materi, filter sesi, & urutan -->
      <div class="w-full flex flex-col sm:flex-row gap-2.5 justify-between items-start sm:items-center pb-1">
        <div class="flex flex-col gap-0.5 min-w-0">
          <div
            class="text-[14px] md:text-[16px] text-[#0F172A] font-heading font-bold text-left truncate"
            x-text="currentMateriHeading">
            Semua Berkas Materi (28 Berkas)
          </div>
        </div>

        <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end shrink-0 flex-wrap">
          <!-- Toggle Filter Sesi (Semua / Teori / Praktikum) -->
          <div class="flex items-center gap-0.5 p-0.5 bg-slate-100 border border-slate-200/80 rounded-[10px]">
            <button type="button" @click="filterMateriSesi = 'SEMUA'"
              :class="filterMateriSesi === 'SEMUA' ? 'bg-white text-slate-900 shadow-2xs font-bold' : 'text-slate-500 hover:text-slate-900 font-medium'"
              class="h-[30px] px-2.5 rounded-[8px] text-[11px] transition-all cursor-pointer flex items-center gap-1 active:scale-95">
              <span>Semua</span>
              <span class="text-[9.5px] opacity-75 font-mono" x-text="'(' + materiSesiCounts.total + ')'">(28)</span>
            </button>
            <button type="button" @click="filterMateriSesi = 'TEORI'"
              :class="filterMateriSesi === 'TEORI' ? 'bg-white text-blue-700 shadow-2xs font-bold' : 'text-slate-500 hover:text-slate-900 font-medium'"
              class="h-[30px] px-2.5 rounded-[8px] text-[11px] transition-all cursor-pointer flex items-center gap-1.5 active:scale-95">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
              <span>Teori</span>
              <span class="text-[9.5px] opacity-75 font-mono" x-text="'(' + materiSesiCounts.teori + ')'">(18)</span>
            </button>
            <button type="button" @click="filterMateriSesi = 'PRAKTIKUM'"
              :class="filterMateriSesi === 'PRAKTIKUM' ? 'bg-white text-purple-700 shadow-2xs font-bold' : 'text-slate-500 hover:text-slate-900 font-medium'"
              class="h-[30px] px-2.5 rounded-[8px] text-[11px] transition-all cursor-pointer flex items-center gap-1.5 active:scale-95">
              <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>
              <span>Praktikum</span>
              <span class="text-[9.5px] opacity-75 font-mono" x-text="'(' + materiSesiCounts.praktikum + ')'">(8)</span>
            </button>
          </div>

          <!-- Dropdown Urutkan -->
          <div class="relative shrink-0" x-data="{ sortDropdownOpen: false }">
            <button type="button" @click="sortDropdownOpen = !sortDropdownOpen"
              class="h-[32px] px-2.5 rounded-[9px] bg-white lg:bg-transparent border border-slate-200 lg:border-transparent text-[11px] text-[#64748B] font-medium hover:text-[#0F172A] flex items-center gap-1 cursor-pointer transition-colors shadow-2xs lg:shadow-none">
              <span x-text="sortMateri === 'terbaru' ? 'Urutkan: Terbaru ▾' : 'Urutkan: Terlama ▾'">Urutkan: Terbaru ▾</span>
            </button>
            <div x-show="sortDropdownOpen" @click.outside="sortDropdownOpen = false" x-cloak
              class="absolute right-0 mt-1.5 w-36 bg-white border border-[#E2E8F0] rounded-[12px] shadow-lg py-1 z-30">
              <button type="button" @click="sortMateri = 'terbaru'; sortDropdownOpen = false"
                :class="sortMateri === 'terbaru' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold' : 'text-[#334155] font-medium'"
                class="w-full text-left px-3 py-2 text-[11px] hover:bg-slate-50 transition-colors">
                Terbaru
              </button>
              <button type="button" @click="sortMateri = 'terlama'; sortDropdownOpen = false"
                :class="sortMateri === 'terlama' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold' : 'text-[#334155] font-medium'"
                class="w-full text-left px-3 py-2 text-[11px] hover:bg-slate-50 transition-colors">
                Terlama
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- State Loading -->
      <div x-show="materiLoading"
        class="w-full py-12 text-center text-[13px] text-slate-400">
        Memuat berkas materi...
      </div>

      <!-- State Kosong -->
      <div x-show="!materiLoading && filteredMateriList.length === 0"
        class="w-full py-12 flex flex-col items-center justify-center text-center">
        <svg class="w-12 h-12 text-slate-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
        </svg>
        <p class="text-[14px] font-semibold text-slate-700 mt-3">Tidak ada materi
        </p>
        <p class="text-[12px] text-slate-400 mt-1">Belum ada berkas untuk
          kategori mata kuliah yang dipilih.</p>
      </div>

      <!-- DAFTAR BERKAS (DESKTOP: Baris Rapi dengan Pemisah Garis #F1F5F9) -->
      <div x-show="!materiLoading && filteredMateriList.length > 0" class="hidden md:flex w-full flex-col">
        <template x-for="(m, idx) in filteredMateriList" :key="'desk-row-' + (m.id || idx)">
          <div class="w-full">
            <div
              class="w-full h-fit flex flex-row gap-[14px] py-[16px] items-center hover:bg-slate-50/70 -mx-3 px-3 rounded-[12px] transition-colors cursor-pointer"
              @click="bukaDetailMateri(m)">

              <!-- Ikon Berkas (44x44 dengan aksen warna tipe) -->
              <div
                class="w-[44px] shrink-0 h-[44px] flex items-center justify-center border rounded-[12px]"
                :class="getMateriIconTheme(m).bg">
                <svg class="w-[22px] h-[22px] text-[#475569]" viewBox="0 0 14 14" fill="currentColor">
                  <!-- Simbol Slide / Dokumen -->
                  <path x-show="getMateriType(m) === 'Slide' || getMateriType(m) === 'Dokumen'"
                    d="M5.25 10.21h3.5a.29.29 0 0 0 .2-.08.29.29 0 0 0 .09-.21.29.29 0 0 0-.09-.2.29.29 0 0 0-.2-.09h-3.5a.29.29 0 0 0-.2.09.29.29 0 0 0-.09.2.29.29 0 0 0 .09.21.29.29 0 0 0 .2.08zm0-2.33h3.5a.29.29 0 0 0 .2-.08.29.29 0 0 0 .09-.21.29.29 0 0 0-.09-.2.29.29 0 0 0-.2-.09h-3.5a.29.29 0 0 0-.2.09.29.29 0 0 0-.09.2.29.29 0 0 0 .09.2.29.29 0 0 0 .2.09zm-1.39 4.38a.94.94 0 0 1-.94-.95V2.69c0-.26.09-.48.27-.67a.92.92 0 0 1 .67-.27h4.21c.19 0 .37.08.57.2l2.06 2.07c.13.13.2.3.2.5v6.54c0 .4-.27.67-.67.67h-6.28zm4.3-8.06V2.34H3.86a.35.35 0 0 0-.35.35v8.62a.35.35 0 0 0 .35.35h6.28a.35.35 0 0 0 .36-.35V4.67H8.64a.47.47 0 0 1-.48-.47z" />
                  <!-- Simbol Video -->
                  <path x-show="getMateriType(m) === 'Video'"
                    d="M2.97 11.08a.94.94 0 0 1-.94-.94V3.86a.94.94 0 0 1 .94-.94h6.28c.4 0 .67.27.67.67v2.72l1.37-1.37a.23.23 0 0 1 .26-.05c.15.05.15.21.15.21v3.27a.23.23 0 0 1-.15.22.23.23 0 0 1-.26-.06l-1.37-1.36v2.71c0 .4-.27.67-.67.67H2.97zm0-.58h6.28a.36.36 0 0 0 .36-.36V3.86a.36.36 0 0 0-.36-.36H2.97a.36.36 0 0 0-.36.36v6.28c0 .16.1.26.26.26z" />
                  <!-- Simbol Repositori -->
                  <path x-show="getMateriType(m) === 'Repositori'"
                    d="M2.4 7l2.47 2.47a.29.29 0 0 1 0 .42.29.29 0 0 1-.41 0L1.9 7.33a.47.47 0 0 1 0-.66L4.46 4.1a.29.29 0 0 1 .42 0 .29.29 0 0 1 0 .42L2.4 7zm9.2 0l-2.47-2.48a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l2.56 2.56a.47.47 0 0 1 0 .66l-2.56 2.56a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L11.6 7z" />
                </svg>
              </div>

              <!-- Informasi Berkas (Judul & Sumber) -->
              <div class="flex-1 min-w-0 flex flex-col gap-[4px] justify-start items-start text-left">
                <div class="flex items-center gap-2 w-full">
                  <div
                    class="text-[13px] leading-[18px] text-[#0F172A] font-bold truncate"
                    x-text="m.title">
                    Slide Normalisasi Database: 1NF hingga BCNF
                  </div>
                  <!-- Tag Sesi (Teori / Praktikum) -->
                  <span class="inline-flex items-center px-1.5 py-0.5 rounded-[5px] text-[9.5px] font-bold tracking-wide uppercase shrink-0"
                    :class="getMateriActivityTheme(m)"
                    x-text="getMateriActivity(m)">
                    PRAKTIKUM
                  </span>
                </div>
                <div
                  class="text-[11px] leading-[15px] w-full text-[#64748B] font-medium truncate"
                  x-text="getMateriSubtitle(m)">
                  Sistem Basis Data · PDF · Diunggah oleh PJ (Farhan)
                </div>
              </div>

              <!-- Jenis, Tanggal, dan Aksi Buka Tautan -->
              <div class="w-fit shrink-0 flex flex-row gap-[12px] items-center">
                <div
                  class="text-[11px] text-[#475569] font-semibold whitespace-nowrap"
                  x-text="getMateriType(m)">
                  Slide
                </div>
                <div
                  class="text-[11px] text-[#64748B] font-medium whitespace-nowrap"
                  x-text="getMateriDate(m)">
                  06 Okt
                </div>
                <button type="button" @click.stop="bukaTautanLangsung(m.url)"
                  class="h-[40px] px-[12px] flex flex-row gap-[5px] items-center bg-[#FFFFFF] [outline:1px_solid_#CBD5E1] [outline-offset:-0.5px] rounded-[8px] hover:bg-slate-50 transition-colors cursor-pointer">
                  <span
                    class="text-[11px] text-[#334155] font-bold whitespace-nowrap">Buka
                    Tautan</span>
                  <svg class="w-[14px] h-[14px] text-[#475569]" viewBox="0 0 14 14" fill="currentColor">
                    <path
                      d="M3.27 11.67a.94.94 0 0 1-.94-.94V3.27c0-.52.42-.94.94-.94h2.98a.29.29 0 0 1 .21.09.29.29 0 0 1 .08.2.29.29 0 0 1-.08.21.29.29 0 0 1-.21.08H3.27a.36.36 0 0 0-.36.36v7.46c0 .2.16.36.36.36h7.45a.36.36 0 0 0 .36-.36V7.75a.29.29 0 0 1 .09-.21.29.29 0 0 1 .2-.08.29.29 0 0 1 .21.08.29.29 0 0 1 .08.21v2.98a.94.94 0 0 1-.94.94H3.27zm7.81-8.34L5.88 8.52a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41l5.2-5.2H8.46a.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21.29.29 0 0 1 .08-.2.29.29 0 0 1 .21-.09h2.74c.2 0 .34.14.34.34v2.74a.29.29 0 0 1-.09.21.29.29 0 0 1-.2.08.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21V3.33z" />
                  </svg>
                </button>
              </div>
            </div>

            <!-- Pemisah berkas (#F1F5F9) -->
            <div x-show="idx < filteredMateriList.length - 1" class="w-full h-[1px] bg-[#F1F5F9]"></div>
          </div>
        </template>
      </div>

      <!-- DAFTAR BERKAS (MOBILE: Kartu Mandiri, Aksen Warna, & Thumb-friendly Tap Target) -->
      <div x-show="!materiLoading && filteredMateriList.length > 0" class="flex md:hidden w-full flex-col gap-[10px]">
        <template x-for="m in filteredMateriList" :key="'mob-card-' + m.id">
          <div @click="bukaDetailMateri(m)"
            class="w-full bg-white border border-slate-200 rounded-[14px] p-3.5 shadow-2xs active:bg-slate-50 transition-all cursor-pointer text-left flex flex-col gap-2.5">

            <!-- Baris 1: Tag Mata Kuliah, Tag Sesi, & Tanggal -->
            <div class="w-full flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[10px] font-bold tracking-wider uppercase bg-blue-50 text-blue-700 border border-blue-200 max-w-[130px] sm:max-w-none truncate"
                  x-text="m.course_name || 'UMUM KELAS'">
                  SISTEM BASIS DATA
                </span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-[6px] text-[10px] font-bold tracking-wider uppercase shrink-0"
                  :class="getMateriActivityTheme(m)"
                  x-text="getMateriActivity(m)">
                  PRAKTIKUM
                </span>
              </div>
              <span class="text-[10px] text-slate-400 font-medium whitespace-nowrap shrink-0"
                x-text="getMateriDate(m)">06 Okt</span>
            </div>

            <!-- Baris 2: Ikon Tipe Berkas & Judul Materi -->
            <div class="w-full flex items-start gap-3">
              <!-- Ikon Tipe Berkas Berwarna -->
              <div class="w-10 h-10 shrink-0 rounded-[10px] flex items-center justify-center border"
                :class="getMateriIconTheme(m).bg">
                <svg class="w-5 h-5" viewBox="0 0 14 14" fill="currentColor">
                  <path x-show="getMateriType(m) === 'Slide' || getMateriType(m) === 'Dokumen'"
                    d="M5.25 10.21h3.5a.29.29 0 0 0 .2-.08.29.29 0 0 0 .09-.21.29.29 0 0 0-.09-.2.29.29 0 0 0-.2-.09h-3.5a.29.29 0 0 0-.2.09.29.29 0 0 0-.09.2.29.29 0 0 0 .09.21.29.29 0 0 0 .2.08zm0-2.33h3.5a.29.29 0 0 0 .2-.08.29.29 0 0 0 .09-.21.29.29 0 0 0-.09-.2.29.29 0 0 0-.2-.09h-3.5a.29.29 0 0 0-.2.09.29.29 0 0 0-.09.2.29.29 0 0 0 .09.2.29.29 0 0 0 .2.09zm-1.39 4.38a.94.94 0 0 1-.94-.95V2.69c0-.26.09-.48.27-.67a.92.92 0 0 1 .67-.27h4.21c.19 0 .37.08.57.2l2.06 2.07c.13.13.2.3.2.5v6.54c0 .4-.27.67-.67.67h-6.28zm4.3-8.06V2.34H3.86a.35.35 0 0 0-.35.35v8.62a.35.35 0 0 0 .35.35h6.28a.35.35 0 0 0 .36-.35V4.67H8.64a.47.47 0 0 1-.48-.47z" />
                  <path x-show="getMateriType(m) === 'Video'"
                    d="M2.97 11.08a.94.94 0 0 1-.94-.94V3.86a.94.94 0 0 1 .94-.94h6.28c.4 0 .67.27.67.67v2.72l1.37-1.37a.23.23 0 0 1 .26-.05c.15.05.15.21.15.21v3.27a.23.23 0 0 1-.15.22.23.23 0 0 1-.26-.06l-1.37-1.36v2.71c0 .4-.27.67-.67.67H2.97zm0-.58h6.28a.36.36 0 0 0 .36-.36V3.86a.36.36 0 0 0-.36-.36H2.97a.36.36 0 0 0-.36.36v6.28c0 .16.1.26.26.26z" />
                  <path x-show="getMateriType(m) === 'Repositori'"
                    d="M2.4 7l2.47 2.47a.29.29 0 0 1 0 .42.29.29 0 0 1-.41 0L1.9 7.33a.47.47 0 0 1 0-.66L4.46 4.1a.29.29 0 0 1 .42 0 .29.29 0 0 1 0 .42L2.4 7zm9.2 0l-2.47-2.48a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l2.56 2.56a.47.47 0 0 1 0 .66l-2.56 2.56a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L11.6 7z" />
                </svg>
              </div>

              <!-- Judul & Keterangan Pengunggah -->
              <div class="flex-1 min-w-0">
                <h3 class="text-[13px] leading-[18px] text-slate-900 font-bold line-clamp-2"
                  x-text="m.title">
                  Slide Normalisasi Database: 1NF hingga BCNF
                </h3>
                <p class="text-[11px] leading-[15px] text-slate-500 font-medium truncate mt-0.5"
                  x-text="m.uploader_name ? 'Oleh ' + m.uploader_name : 'Oleh PJ Kelas'">
                  Oleh Farhan Pratama (PJ)
                </p>
              </div>
            </div>

            <!-- Baris 3: Format & Action Bar -->
            <div class="w-full flex items-center justify-between pt-1 border-t border-slate-100">
              <div class="flex items-center gap-1.5 text-[11px] text-slate-500 font-medium">
                <span class="font-semibold text-slate-700" x-text="getMateriType(m)">Slide</span>
                <span>•</span>
                <span x-text="m.url && m.url.includes('drive.google.com') ? 'Google Drive' : (m.url && m.url.includes('github.com') ? 'GitHub' : 'Tautan')">Google Drive</span>
              </div>

              <!-- Aksi Cepat: Buka Langsung (Stop Propagation) -->
              <div class="flex items-center gap-2">
                <button type="button" @click.stop="bukaTautanLangsung(m.url)"
                  class="h-[34px] px-3 flex items-center gap-1.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-[8px] text-[11px] text-slate-700 font-bold transition-colors cursor-pointer active:scale-95">
                  <span>Buka</span>
                  <svg class="w-3.5 h-3.5 text-slate-500" viewBox="0 0 14 14" fill="currentColor">
                    <path d="M3.27 11.67a.94.94 0 0 1-.94-.94V3.27c0-.52.42-.94.94-.94h2.98a.29.29 0 0 1 .21.09.29.29 0 0 1 .08.2.29.29 0 0 1-.08.21.29.29 0 0 1-.21.08H3.27a.36.36 0 0 0-.36.36v7.46c0 .2.16.36.36.36h7.45a.36.36 0 0 0 .36-.36V7.75a.29.29 0 0 1 .09-.21.29.29 0 0 1 .2-.08.29.29 0 0 1 .21.08.29.29 0 0 1 .08.21v2.98a.94.94 0 0 1-.94.94H3.27zm7.81-8.34L5.88 8.52a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41l5.2-5.2H8.46a.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21.29.29 0 0 1 .08-.2.29.29 0 0 1 .21-.09h2.74c.2 0 .34.14.34.34v2.74a.29.29 0 0 1-.09.21.29.29 0 0 1-.2.08.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21V3.33z" />
                  </svg>
                </button>
              </div>
            </div>

          </div>
        </template>
      </div>

    </div>
  </div>

  <!-- MODAL / BOTTOM SHEET DETAIL MATERI PERKULIAHAN (SCR-USER-MAT-002 DESKTOP & MOBILE) -->
  <div x-show="detailMateriModalOpen" x-cloak
    class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4"
    @keydown.escape.window="tutupDetailMateri()">

    <!-- Backdrop Hitam Transparan Blur dengan Animasi Fade Halus -->
    <div x-show="detailMateriModalOpen"
      x-transition:enter="transition-opacity ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition-opacity ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      class="fixed inset-0 bg-[#0F172A]/40 backdrop-blur-xs"
      @click="tutupDetailMateri()"
      aria-hidden="true"></div>

    <!-- Sheet Modal Konten dengan Animasi Slide-Up & Drag to Dismiss -->
    <div x-show="detailMateriModalOpen"
      x-transition:enter="transition ease-out duration-300 transform"
      x-transition:enter-start="translate-y-full md:translate-y-4 md:scale-95 opacity-0 md:opacity-0"
      x-transition:enter-end="translate-y-0 md:scale-100 opacity-100 md:opacity-100"
      x-transition:leave="transition ease-in duration-200 transform"
      x-transition:leave-start="translate-y-0 md:scale-100 opacity-100 md:opacity-100"
      x-transition:leave-end="translate-y-full md:translate-y-4 md:scale-95 opacity-0 md:opacity-0"
      :style="sheetMateriTransform"
      class="relative bg-white rounded-t-[24px] md:rounded-[16px] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] w-full md:w-[460px] max-h-[90vh] md:max-h-[85vh] [box-shadow:0px_18px_36px_#0F172A33] flex flex-col overflow-hidden text-left z-10 will-change-transform"
      @click.outside="tutupDetailMateri()">

      <!-- Drag handle (Mobile) -->
      <div class="md:hidden w-full h-[32px] shrink-0 flex justify-center items-center pt-2 cursor-grab active:cursor-grabbing select-none touch-none"
        @pointerdown="onMateriPointerDown($event)"
        @pointermove="onMateriPointerMove($event)"
        @pointerup="onMateriPointerUp($event)"
        @pointercancel="onMateriPointerUp($event)">
        <div class="w-[48px] h-[5px] bg-[#CBD5E1] rounded-full"></div>
      </div>

      <template x-if="selectedMateri">
        <div class="flex-1 flex flex-col p-[20px] md:p-[24px] gap-[16px] md:gap-[18px] overflow-y-auto">

          <!-- Kepala detail materi -->
          <div class="w-full flex flex-row gap-[10px] justify-between items-start select-none md:select-text touch-none cursor-grab active:cursor-grabbing"
            @pointerdown="onMateriPointerDown($event)"
            @pointermove="onMateriPointerMove($event)"
            @pointerup="onMateriPointerUp($event)"
            @pointercancel="onMateriPointerUp($event)">
            <div class="flex-1 flex flex-col gap-[7px] items-start">
              <!-- Kategori & Sesi Pill -->
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="inline-flex items-center px-2.5 py-1 rounded-[6px] text-[10px] font-bold tracking-wider uppercase bg-blue-50 text-blue-700 border border-blue-200"
                  x-text="(selectedMateri.course_name || 'UMUM KELAS').toUpperCase()">
                  SISTEM BASIS DATA
                </span>
                <span class="inline-flex items-center px-2.5 py-1 rounded-[6px] text-[10px] font-bold tracking-wider uppercase"
                  :class="getMateriActivityTheme(selectedMateri)"
                  x-text="getMateriActivity(selectedMateri)">
                  PRAKTIKUM
                </span>
              </div>
              <!-- Judul Materi -->
              <h2 class="text-[18px] leading-[23px] text-[#0F172A] font-heading font-bold"
                x-text="selectedMateri.title">Slide Normalisasi Database: 1NF hingga BCNF</h2>
              <!-- Format & Pengunggah -->
              <div class="text-[11px] leading-[15px] text-[#64748B] font-medium"
                x-text="getMateriModalMeta(selectedMateri)">
                Format: Dokumen PDF · Diunggah oleh Farhan Pratama (PJ)
              </div>
            </div>
            <!-- Tombol Tutup Silang -->
            <button type="button" @click="tutupDetailMateri()"
              class="w-[44px] h-[44px] shrink-0 flex items-center justify-center text-[#64748B] hover:text-[#0F172A] hover:bg-slate-100 rounded-full transition-colors cursor-pointer">
              <svg class="w-[20px] h-[20px]" viewBox="0 0 14 14" fill="currentColor">
                <path
                  d="M7 7.414l-3.06 3.06a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L6.59 7 3.53 3.94a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0L7 6.59l3.06-3.06a.29.29 0 0 1 .41 0 .29.29 0 0 1 0 .41L7.41 7l3.06 3.06a.29.29 0 0 1 0 .41.29.29 0 0 1-.41 0L7 7.414z" />
              </svg>
            </button>
          </div>

          <!-- Catatan dan akses berkas -->
          <div class="w-full flex flex-col gap-[16px]">

            <!-- CATATAN & INSTRUKSI -->
            <div class="w-full flex flex-col gap-[7px]" x-show="selectedMateri.description">
              <div
                class="text-[10px] text-[#64748B] font-bold tracking-[0.5px] uppercase">
                CATATAN &amp; INSTRUKSI
              </div>
              <div
                class="w-full p-[14px] bg-[#F8FAFC] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[12px]">
                <p class="text-[12px] leading-[19px] text-[#334155] font-medium whitespace-pre-line"
                  x-text="selectedMateri.description">
                  Slide materi pertemuan ke-4 mengenai aturan pembentukan 1NF, 2NF, 3NF hingga Boyce-Codd Normal Form
                  (BCNF). Mohon pelajari contoh dekomposisi tabel sebelum praktikum pekan depan.
                </p>
              </div>
            </div>

            <!-- AKSES BERKAS -->
            <div class="w-full flex flex-col gap-[7px]" x-show="selectedMateri.url">
              <div
                class="text-[10px] text-[#64748B] font-bold tracking-[0.5px] uppercase">
                AKSES BERKAS
              </div>
              <div
                class="w-full p-[12px] bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[12px] flex flex-row gap-[9px] items-center">
                <!-- Cloud Icon -->
                <svg class="w-[20px] h-[20px] text-[#64748B] shrink-0" viewBox="0 0 14 14" fill="currentColor">
                  <path
                    d="M3.79 11.08a2.6 2.6 0 0 1-1.86-.76 2.61 2.61 0 0 1-.77-1.85c0-1 .69-1.78 1.71-1.84.2-1.27 1.17-2.1 2.27-2.1a3.5 3.5 0 0 1 2.48 1.02c1.02 1.02 1.02 2.48 1.02 2.48l0 .58.36 0c.84.03 1.4.62 1.4 1.43 0 .86-.59 1.45-1.45 1.45l-7 0zm0-.58h7a.86.86 0 0 0 .86-.86c0-.48-.38-.86-.86-.86l-.88 0v-1.17c0-1.21-.85-2.06-2.06-2.06-1.21 0-2.06.85-2.06 2.06l-.3 0c-.84 0-1.44.6-1.44 1.45 0 .84.6 1.44 1.44 1.44z" />
                </svg>
                <!-- Alamat URL -->
                <div class="text-[10px] text-[#475569] font-mono font-medium truncate flex-1"
                  x-text="cleanUrlDisplay(selectedMateri.url)">
                  drive.google.com/file/d/18k9aZ-Normalisasi...
                </div>
                <!-- Tombol Salin -->
                <button type="button" @click="salinTautanMateri(selectedMateri.url)"
                  class="h-[36px] md:h-[44px] px-[12px] bg-[#FFFFFF] [outline:1px_solid_#CBD5E1] [outline-offset:-0.5px] rounded-[8px] text-[11px] text-[#334155] font-bold hover:bg-slate-50 transition-colors cursor-pointer shrink-0">
                  Salin
                </button>
              </div>
            </div>

          </div>

          <!-- Aksi detail materi -->
          <div class="w-full flex flex-col gap-2 mt-2 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
            <button type="button" @click="bukaTautanLangsung(selectedMateri.url)"
              class="w-full h-[48px] bg-[#2563EB] hover:bg-[#1D4ED8] text-white rounded-[12px] flex items-center justify-center gap-[8px] text-[13px] font-bold shadow-xs transition-all active:scale-[0.99] cursor-pointer">
              <span
                x-text="selectedMateri.url && selectedMateri.url.includes('drive.google.com') ? 'Buka Berkas di Google Drive' : (selectedMateri.url && selectedMateri.url.includes('github.com') ? 'Buka Repositori di GitHub' : 'Buka Berkas')">Buka
                Berkas di Google Drive</span>
              <svg class="w-[17px] h-[17px] text-white" viewBox="0 0 14 14" fill="currentColor">
                <path
                  d="M3.27 11.67a.94.94 0 0 1-.94-.94V3.27c0-.52.42-.94.94-.94h2.98a.29.29 0 0 1 .21.09.29.29 0 0 1 .08.2.29.29 0 0 1-.08.21.29.29 0 0 1-.21.08H3.27a.36.36 0 0 0-.36.36v7.46c0 .2.16.36.36.36h7.45a.36.36 0 0 0 .36-.36V7.75a.29.29 0 0 1 .09-.21.29.29 0 0 1 .2-.08.29.29 0 0 1 .21.08.29.29 0 0 1 .08.21v2.98a.94.94 0 0 1-.94.94H3.27zm7.81-8.34L5.88 8.52a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41l5.2-5.2H8.46a.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21.29.29 0 0 1 .08-.2.29.29 0 0 1 .21-.09h2.74c.2 0 .34.14.34.34v2.74a.29.29 0 0 1-.09.21.29.29 0 0 1-.2.08.29.29 0 0 1-.21-.08.29.29 0 0 1-.08-.21V3.33z" />
              </svg>
            </button>
            <button type="button" @click="tutupDetailMateri()"
              class="w-full h-[42px] flex items-center justify-center text-[12px] text-[#64748B] font-bold hover:text-[#0F172A] transition-colors cursor-pointer">
              Tutup
            </button>
          </div>

        </div>
      </template>

    </div>
  </div>


</section>
