<!-- partials/portal/view-materi.html — Portal Materi + Detail (butuh endpoint) -->
<section x-show="view === 'materi'" x-cloak>
  <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Materi</h1>
  <p class="text-[14px] text-slate-500 mt-1">Materi dan tautan kelas.</p>
  <div class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center">
    <img src="/assets/illustrations/empty-folder.svg" alt="" class="w-16 h-16 mx-auto opacity-70" />
    <p class="text-[15px] font-semibold mt-3">Belum ada materi</p>
    <p class="text-[13px] text-slate-500">Materi tampil di sini setelah endpoint materi tersedia.</p>
  </div>
</section>

<section x-show="view === 'detail-materi'" x-cloak>
  <button type="button" @click="go('materi')" class="text-[13px] text-[#3965FB] font-medium hover:underline min-h-[44px]">← Kembali ke materi</button>
  <div class="p-5 rounded-2xl border border-[#EEEEEE] bg-white mt-2 text-[13px] text-slate-400">Detail materi butuh endpoint backend.</div>
</section>
