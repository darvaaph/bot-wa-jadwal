<!-- partials/portal/view-perubahan.html — Portal Perubahan Terbaru (jadwal terbit) -->
<section x-show="view === 'perubahan'" x-cloak>
  <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Perubahan Terbaru</h1>
  <p class="text-[14px] text-slate-500 mt-1">Pengumuman jadwal yang sudah terbit untuk kelas ini.</p>
  <div x-show="perubahanLoading" class="mt-5 py-6 text-center text-[13px] text-slate-400">Memuat perubahan...</div>
  <div x-show="!perubahanLoading && perubahanList.length === 0" class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center text-[13px] text-slate-400">Belum ada pengumuman perubahan.</div>
  <div class="mt-4 space-y-3">
    <template x-for="c in perubahanList" :key="c.id">
      <div class="p-4 rounded-2xl border border-[#EEEEEE] bg-white">
        <p class="text-[14px] font-semibold flex items-center gap-1.5 flex-wrap">
          <span class="material-symbols-outlined text-[18px] text-[#3965FB]">event</span>
          <span x-text="labelJenisUbah(c.event_kind)">-</span>
          <span class="text-slate-400 font-normal">·</span>
          <span class="font-normal text-slate-600" x-text="c.offering || ''">-</span>
        </p>
        <p class="text-[12px] text-slate-500 font-mono mt-1" x-text="fmtDeadlineID(c.starts_at) + ' – ' + fmtDeadlineID(c.ends_at)">-</p>
        <p x-show="c.room" class="text-[12px] text-slate-500 mt-0.5" x-text="'Ruangan: ' + c.room">-</p>
        <p x-show="c.reason" class="text-[13px] text-slate-600 mt-1" x-text="c.reason">-</p>
      </div>
    </template>
  </div>
</section>
