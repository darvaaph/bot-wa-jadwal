<!-- partials/portal/view-jadwal.html — Portal Jadwal Mahasiswa (Redesain Figma Desktop & Mobile 390) -->
<section x-show="view === 'jadwal'" x-cloak class="w-full flex flex-col gap-[20px] p-[20px_16px_36px_16px] md:p-[30px_32px_36px_32px]">

  <!-- Judul dan konteks jadwal -->
  <div class="box-border w-full h-fit shrink-0 flex flex-col gap-[5px] justify-start items-start">
    <h1 class="text-[24px] md:text-[25px] box-border text-[#0F172A] font-display font-bold text-left leading-tight">
      Jadwal Perkuliahan
    </h1>
    <p class="text-[11px] md:text-[12px] leading-[18px] box-border w-full text-[#64748B] font-sans font-medium text-left">
      Jadwal efektif kelas <span class="font-semibold text-[#334155]" x-text="selectedClass || 'D4-TI 1A'">D4-TI 1A</span> pekan ini, termasuk kuliah pengganti resmi.
    </p>
  </div>

  <!-- Navigasi Pekan dan Legenda Portal (DESKTOP) -->
  <div class="box-border w-full h-[60px] shrink-0 [box-shadow:0px_3px_12px_#0F172A08] hidden md:flex flex-row p-[10px_16px] justify-between items-center bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[12px]">
    <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[12px] justify-start items-center">
      <!-- Kontrol Stepper Pekan -->
      <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] justify-start items-center">
        <div class="box-border w-fit shrink-0 h-[40px] flex flex-row gap-0 justify-start items-center bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[10px] overflow-hidden">
          <button type="button" @click="prevWeek()" title="Minggu Sebelumnya"
            class="box-border w-[40px] shrink-0 h-[40px] flex flex-row justify-center items-center bg-[#FFFFFF] hover:bg-slate-50 transition-colors">
            <svg viewBox="0 0 14 14" class="w-[20px] h-[20px] shrink-0" fill="currentColor">
              <path d="M5.896 7l2.478 2.478a.29.29 0 0 1 0 .41.29.29 0 0 1-.41 0L5.4 7.33a.47.47 0 0 1 0-.66l2.56-2.56a.29.29 0 0 1 .41 0 .29.29 0 0 1 0 .41L5.896 7z" fill="#1D1B3A"/>
            </svg>
          </button>
          <div class="box-border w-[250px] shrink-0 h-[40px] flex flex-row gap-[8px] px-[12px] justify-start items-center border-x border-[#E2E8F0]">
            <div class="text-[14px] text-[#1D1B3A] font-mono font-bold text-left whitespace-nowrap" x-text="rentangPekanLabel">
              5 – 11 Oktober 2026
            </div>
            <div class="box-border w-fit shrink-0 h-fit flex flex-row px-[8px] py-[4px] justify-start items-center bg-[#F1F5F9] rounded-[6px]">
              <span class="text-[11px] text-[#475467] font-sans font-semibold whitespace-nowrap" x-text="'Pekan ' + pekanAktifNum">
                Pekan 6
              </span>
            </div>
          </div>
          <button type="button" @click="nextWeek()" title="Minggu Berikutnya"
            class="box-border w-[40px] shrink-0 h-[40px] flex flex-row justify-center items-center bg-[#FFFFFF] hover:bg-slate-50 transition-colors">
            <svg viewBox="0 0 14 14" class="w-[20px] h-[20px] shrink-0" fill="currentColor">
              <path d="M7.755 7L5.277 4.522a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l2.56 2.56a.47.47 0 0 1 0 .66l-2.56 2.56a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L7.755 7z" fill="#1D1B3A"/>
            </svg>
          </button>
        </div>
        <button type="button" @click="mingguIni()"
          class="box-border w-fit shrink-0 h-[40px] flex flex-row px-[12px] justify-start items-center bg-[#FFFFFF] hover:bg-slate-50 [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[8px] transition-colors">
          <span class="text-[12px] text-[#1D1B3A] font-sans font-semibold whitespace-nowrap">Minggu Ini</span>
        </button>
      </div>

      <!-- Riwayat Perubahan -->
      <button type="button" @click="showToast('Riwayat perubahan pekan ini: ' + (perubahanList.length || 1) + ' catatan terbit.')"
        class="box-border w-fit shrink-0 h-[40px] flex flex-row gap-[6px] px-[12px] justify-start items-center bg-[#FFFFFF] hover:bg-slate-50 [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[8px] transition-colors"
        title="Riwayat Perubahan Jadwal">
        <svg viewBox="0 0 14 14" class="w-[16px] h-[16px] shrink-0" fill="currentColor">
          <path d="M6.976 11.666a4.7 4.7 0 0 1-2.95-1.03 4.9 4.9 0 0 1-1.6-2.645.28.28 0 0 1 .218-.363.29.29 0 0 1 .352.26 4.3 4.3 0 0 0 1.43 2.296 4.1 4.1 0 0 0 2.55.902c1.71 0 2.895-1.19 2.895-2.895s-1.186-2.895-2.895-2.895a4.04 4.04 0 0 0-1.7.383 4.1 4.1 0 0 0-1.41 1.053l1.156.002a.29.29 0 0 1 .29.29.29.29 0 0 1-.29.29H3.107a.47.47 0 0 1-.47-.47V4.996a.29.29 0 0 1 .29-.29.29.29 0 0 1 .29.29l.002 1.101A4.6 4.6 0 0 1 5.13 4.942a4.67 4.67 0 0 1 1.846-.42c1.82 0 3.3 1.48 3.3 3.3s-1.48 3.3-3.3 3.3zm.328-4.785l1.75 1.75a.29.29 0 0 1 0 .41.29.29 0 0 1-.41 0l-1.78-1.777a.38.38 0 0 1-.11-.16.4.4 0 0 1-.03-.174V4.382a.29.29 0 0 1 .29-.29.29.29 0 0 1 .29.29v2.505z" fill="#475569"/>
        </svg>
        <span class="text-[11px] text-[#334155] font-sans font-bold whitespace-nowrap">Riwayat Perubahan</span>
        <div class="box-border w-fit shrink-0 h-fit flex flex-row px-[6px] py-[3px] justify-start items-center bg-[#FEF3C7] rounded-[10px]">
          <span class="text-[10px] text-[#92400E] font-sans font-bold whitespace-nowrap" x-text="perubahanList.length || 1">1</span>
        </div>
      </button>
    </div>

    <!-- Pengalih Tampilan (Kalender / Daftar) -->
    <div class="box-border w-fit shrink-0 h-[40px] flex flex-row gap-[2px] p-[4px] justify-start items-center bg-[#F1F5F9] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[12px]">
      <button type="button" @click="modeTampilan = 'kalender'"
        :class="modeTampilan === 'kalender' ? 'bg-[#FFFFFF] [box-shadow:0px_1px_3px_#0F172A12] text-[#3965FB]' : 'bg-[#F1F5F9] text-[#667085] hover:text-[#334155]'"
        class="box-border w-fit shrink-0 h-[32px] flex flex-row gap-[6px] px-[12px] justify-start items-center rounded-[8px] transition-all">
        <svg viewBox="0 0 14 14" class="w-[15px] h-[15px] shrink-0" fill="currentColor">
          <path d="M2.693 11.084a.94.94 0 0 1-.943-.943V3.859c0-.52.423-.943.943-.943h8.613c.52 0 .943.423.943.943v6.282c0 .52-.423.943-.943.943H2.693zm4.597-.584h1.897v-7H7.29v7zm-2.478 0h1.897v-7H4.812v7zm-2.12 0h1.535v-7H2.693a.36.36 0 0 0-.36.36v6.28c0 .2.16.36.36.36zm7.08 0h1.534a.36.36 0 0 0 .36-.36v-6.28a.36.36 0 0 0-.36-.36h-1.535v7z"/>
        </svg>
        <span class="text-[12px] font-sans font-bold whitespace-nowrap">Kalender</span>
      </button>
      <button type="button" @click="modeTampilan = 'daftar'"
        :class="modeTampilan === 'daftar' ? 'bg-[#FFFFFF] [box-shadow:0px_1px_3px_#0F172A12] text-[#3965FB]' : 'bg-[#F1F5F9] text-[#667085] hover:text-[#334155]'"
        class="box-border w-fit shrink-0 h-[32px] flex flex-row gap-[6px] px-[12px] justify-start items-center rounded-[8px] transition-all">
        <svg viewBox="0 0 14 14" class="w-[15px] h-[15px] shrink-0" fill="currentColor">
          <path d="M4.758 5.318a.29.29 0 0 1-.294-.297.29.29 0 0 1 .294-.29h6.617a.29.29 0 0 1 .29.29.29.29 0 0 1-.29.297H4.758zm0 1.972a.29.29 0 0 1-.294-.293.29.29 0 0 1 .294-.291h6.617a.29.29 0 0 1 .29.29.29.29 0 0 1-.29.294H4.758zm0 1.976a.29.29 0 0 1-.294-.291.29.29 0 0 1 .294-.294h6.617a.29.29 0 0 1 .29.294.29.29 0 0 1-.29.291H4.758zM2.693 5.385a.36.36 0 0 1-.36-.369.36.36 0 0 1 .36-.349.36.36 0 0 1 .358.35.36.36 0 0 1-.358.368zm0 1.965a.36.36 0 0 1-.36-.352.36.36 0 0 1 .36-.369.36.36 0 0 1 .358.37.36.36 0 0 1-.358.351zm0 1.986a.36.36 0 0 1-.36-.376.36.36 0 0 1 .36-.345.36.36 0 0 1 .358.345.36.36 0 0 1-.358.376z"/>
        </svg>
        <span class="text-[12px] font-sans font-medium whitespace-nowrap">Daftar</span>
      </button>
    </div>
  </div>

  <!-- Navigasi Pekan dan Hari (MOBILE) -->
  <div class="box-border w-full h-fit shrink-0 flex md:hidden flex-col gap-[10px] justify-start items-start">
    <div class="box-border w-full h-fit shrink-0 flex flex-row justify-between items-center">
      <div class="box-border w-fit shrink-0 h-fit flex flex-row items-center">
        <button type="button" @click="prevWeek()" title="Pekan Sebelumnya"
          class="box-border w-[44px] shrink-0 h-[44px] flex justify-center items-center text-slate-600 active:bg-slate-100 rounded-lg">
          <svg viewBox="0 0 14 14" class="w-[20px] h-[20px] shrink-0" fill="currentColor">
            <path d="M5.896 7l2.478 2.478a.29.29 0 0 1 0 .41.29.29 0 0 1-.41 0L5.4 7.33a.47.47 0 0 1 0-.66l2.56-2.56a.29.29 0 0 1 .41 0 .29.29 0 0 1 0 .41L5.896 7z"/>
          </svg>
        </button>
        <div class="text-[12px] text-[#1E293B] font-sans font-bold whitespace-nowrap" x-text="rentangPekanSingkatLabel">
          5 - 11 Okt (Pekan 6)
        </div>
        <button type="button" @click="nextWeek()" title="Pekan Berikutnya"
          class="box-border w-[44px] shrink-0 h-[44px] flex justify-center items-center text-slate-600 active:bg-slate-100 rounded-lg">
          <svg viewBox="0 0 14 14" class="w-[20px] h-[20px] shrink-0" fill="currentColor">
            <path d="M7.755 7L5.277 4.522a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l2.56 2.56a.47.47 0 0 1 0 .66l-2.56 2.56a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L7.755 7z"/>
          </svg>
        </button>
      </div>

      <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[8px] items-center">
        <button type="button" @click="mingguIni()"
          class="box-border w-fit shrink-0 h-[44px] px-[5px] flex items-center text-[12px] text-[#2563EB] font-sans font-bold">
          Hari Ini
        </button>
        <button type="button" @click="showToast('Riwayat perubahan: ' + (perubahanList.length || 1) + ' catatan terbit.')"
          class="box-border w-[44px] shrink-0 h-[44px] flex justify-center items-center" title="Riwayat Perubahan">
          <div class="box-border w-[36px] shrink-0 h-[36px] flex justify-center items-center bg-[#F1F5F9] rounded-full relative">
            <svg viewBox="0 0 14 14" class="w-[18px] h-[18px] shrink-0 text-slate-600" fill="currentColor">
              <path d="M6.976 11.666a4.7 4.7 0 0 1-2.95-1.03 4.9 4.9 0 0 1-1.6-2.645.28.28 0 0 1 .218-.363.29.29 0 0 1 .352.26 4.3 4.3 0 0 0 1.43 2.296 4.1 4.1 0 0 0 2.55.902c1.71 0 2.895-1.19 2.895-2.895s-1.186-2.895-2.895-2.895a4.04 4.04 0 0 0-1.7.383 4.1 4.1 0 0 0-1.41 1.053l1.156.002a.29.29 0 0 1 .29.29.29.29 0 0 1-.29.29H3.107a.47.47 0 0 1-.47-.47V4.996a.29.29 0 0 1 .29-.29.29.29 0 0 1 .29.29l.002 1.101A4.6 4.6 0 0 1 5.13 4.942a4.67 4.67 0 0 1 1.846-.42c1.82 0 3.3 1.48 3.3 3.3s-1.48 3.3-3.3 3.3zm.328-4.785l1.75 1.75a.29.29 0 0 1 0 .41.29.29 0 0 1-.41 0l-1.78-1.777a.38.38 0 0 1-.11-.16.4.4 0 0 1-.03-.174V4.382a.29.29 0 0 1 .29-.29.29.29 0 0 1 .29.29v2.505z"/>
            </svg>
            <div class="box-border w-[10px] h-[10px] absolute right-[-1px] top-[-1px] bg-[#F59E0B] border-2 border-white rounded-full"></div>
          </div>
        </button>
      </div>
    </div>

    <!-- Strip Tanggal Satu Baris (Mobile) -->
    <div class="box-border w-full h-[44px] shrink-0 flex flex-row gap-[5px] justify-start items-center overflow-x-auto no-scrollbar">
      <template x-for="d in pekanHariListMobile" :key="d">
        <button type="button" @click="pilihHari(d)"
          :class="hari === d ? 'bg-[#2563EB] text-white [box-shadow:0px_2px_4px_#0F172A14]' : 'bg-[#F1F5F9] text-[#334155]'"
          class="box-border flex-1 h-[44px] min-w-[52px] flex justify-center items-center rounded-[12px] relative transition-all">
          <span class="text-[10px] font-sans font-bold whitespace-nowrap"
            x-text="d.slice(0, 3) + ' ' + (tanggalPekan[d] ? tanggalPekan[d].slice(8, 10) : '')">Sen 5</span>
          <!-- Indikator ada sesi pengganti khusus Sabtu -->
          <template x-if="d === 'Sabtu' && hasSaturdayClass">
            <div class="box-border w-[7px] h-[7px] absolute right-[6px] top-[4px] bg-[#D97706] rounded-full border border-white"></div>
          </template>
        </button>
      </template>
    </div>
  </div>

  <!-- Loading State Skeleton -->
  <div x-show="jadwalLoading" class="w-full flex flex-col gap-4 py-8 animate-pulse">
    <div class="hidden md:grid grid-cols-5 gap-3 w-full">
      <template x-for="i in 5" :key="i">
        <div class="h-[420px] bg-slate-100 rounded-xl flex flex-col gap-2 p-3">
          <div class="h-10 bg-slate-200 rounded-lg w-full"></div>
          <div class="h-28 bg-white rounded-lg w-full mt-2"></div>
          <div class="h-28 bg-white rounded-lg w-full"></div>
        </div>
      </template>
    </div>
    <div class="block md:hidden space-y-3 w-full">
      <div class="h-32 bg-slate-100 rounded-2xl w-full"></div>
      <div class="h-32 bg-slate-100 rounded-2xl w-full"></div>
    </div>
  </div>

  <!-- Error State Alert -->
  <div x-show="jadwalError" class="box-border w-full p-4 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700 flex items-center justify-between">
    <span x-text="jadwalError">Jadwal belum dapat dimuat. Periksa koneksi lalu coba lagi.</span>
    <button type="button" @click="loadJadwalPekan()" class="font-semibold underline hover:text-red-900 ml-3">Coba Lagi</button>
  </div>

  <!-- PAPAN JADWAL MINGGUAN (DESKTOP) -->
  <div x-show="!jadwalLoading && !jadwalError"
    class="box-border w-full [box-shadow:0px_4px_16px_#0F172A0A] hidden md:flex flex-col gap-[12px] p-[20px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[16px]">

    <!-- Header Kalender Mingguan -->
    <div class="box-border w-full h-[32px] shrink-0 flex flex-row gap-[12px] justify-between items-center">
      <div class="text-[16px] text-[#1D1B3A] font-display font-bold text-left whitespace-nowrap">
        Jadwal Pekan Ini
      </div>
      <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[9px] justify-start items-center">
        <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[6px] justify-start items-center">
          <div class="box-border w-[4px] shrink-0 h-[14px] bg-[#3965FB] rounded-[2px]"></div>
          <div class="text-[12px] text-[#667085] font-sans font-medium text-left whitespace-nowrap">Teori</div>
        </div>
        <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[6px] justify-start items-center">
          <div class="box-border w-[4px] shrink-0 h-[14px] bg-[#7C3AED] rounded-[2px]"></div>
          <div class="text-[12px] text-[#667085] font-sans font-medium text-left whitespace-nowrap">Praktikum</div>
        </div>
        <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[6px] justify-start items-center">
          <div class="box-border w-[4px] shrink-0 h-[14px] bg-[#F59E0B] rounded-[2px]"></div>
          <div class="text-[12px] text-[#667085] font-sans font-medium text-left whitespace-nowrap">Kuliah Pengganti</div>
        </div>
      </div>
    </div>

    <!-- Tampilan Kalender (Grid 5 Kolom: Senin s/d Jumat) -->
    <div x-show="modeTampilan === 'kalender'" class="box-border w-full flex flex-row gap-[12px] justify-start items-start">
      <template x-for="d in pekanHariListDesktop" :key="d">
        <div class="box-border flex-1 h-full flex flex-col gap-0 justify-start items-start">
          <!-- Header Hari -->
          <div :class="d === todayName && weekOffset === 0 ? 'bg-[#2563EB] [outline:1px_solid_#2563EB] text-white' : 'bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] text-[#1D1B3A]'"
            class="box-border w-full h-[63px] shrink-0 flex flex-row px-[11px] justify-between items-center [outline-offset:-0.5px] rounded-[12px_12px_0px_0px]">
            <div class="box-border w-fit shrink-0 h-fit flex flex-col gap-[2px] justify-start items-start">
              <div class="text-[13px] font-sans font-bold text-left whitespace-nowrap"
                :class="d === todayName && weekOffset === 0 ? 'text-[#FFFFFF]' : 'text-[#1D1B3A]'" x-text="d">
                Senin
              </div>
              <div class="text-[11px] font-sans font-normal text-left whitespace-nowrap"
                :class="d === todayName && weekOffset === 0 ? 'text-[#DBEAFE]' : 'text-[#667085]'"
                x-text="tanggalPekanFormatted[d]">
                5 Okt
              </div>
            </div>
            <div class="box-border w-fit shrink-0 h-fit flex flex-col gap-[3px] justify-start items-end">
              <template x-if="d === todayName && weekOffset === 0">
                <div class="box-border w-fit h-fit shrink-0 flex flex-row px-[6px] py-[3px] justify-start items-center bg-[#FFFFFF] rounded-[5px]">
                  <span class="text-[9px] text-[#3965FB] font-sans font-extrabold whitespace-nowrap">HARI INI</span>
                </div>
              </template>
              <div class="text-[10px] md:text-[11px] font-sans font-semibold text-left whitespace-nowrap"
                :class="d === todayName && weekOffset === 0 ? 'text-[#DBEAFE]' : 'text-[#98A2B3]'"
                x-text="(jadwalPekan[d] || []).length + ' Sesi'">
                0 Sesi
              </div>
            </div>
          </div>

          <!-- Area Sesi Hari -->
          <div :class="d === todayName && weekOffset === 0 ? 'bg-[#F8FAFC] [outline:1px_solid_#BFDBFE]' : 'bg-[#F8FAFC] [outline:1px_solid_#E2E8F0]'"
            class="box-border w-full min-h-[400px] flex flex-col gap-[9px] p-[9px] justify-start items-start [outline-offset:-0.5px] rounded-[0px_0px_12px_12px]">
            <template x-for="s in (jadwalPekan[d] || [])" :key="s.id">
              <div :class="s.kind === 'PENGGANTI' ? 'bg-[#FFFBEB] [outline:1px_solid_#FDE68A]' : 'bg-[#FFFFFF] [outline:1px_solid_#E2E8F0]'"
                class="box-border w-full h-fit shrink-0 flex flex-col gap-[6px] p-[10px] justify-start items-start [outline-offset:-0.5px] rounded-[9px] transition-shadow hover:shadow-sm">
                <!-- Jam Sesi -->
                <div class="box-border w-fit h-fit shrink-0 flex flex-row px-[6px] py-[3px] justify-start items-center bg-[#EFF6FF] [outline:1px_solid_#BFDBFE] [outline-offset:-0.5px] rounded-[6px]">
                  <span class="text-[10px] text-[#1D4ED8] font-mono font-bold whitespace-nowrap"
                    x-text="s.timeStart + ' – ' + s.timeEnd">08:40 – 10:20</span>
                </div>
                <!-- Badge Jenis -->
                <div class="box-border w-fit h-fit shrink-0 flex flex-row px-[7px] py-[3px] justify-start items-center rounded-[6px]"
                  :class="s.kind === 'PENGGANTI' ? 'bg-[#FEF3C7] text-[#92400E]' : (s.activityType === 'PRACTICE' ? 'bg-[#F5F3FF] text-[#6D28D9]' : 'bg-[#EFF6FF] text-[#1D4ED8]')">
                  <span class="text-[10px] font-sans font-semibold whitespace-nowrap"
                    x-text="s.kind === 'PENGGANTI' ? 'Pengganti' : (s.activityType === 'PRACTICE' ? 'Praktikum' : 'Teori')">Teori</span>
                </div>
                <!-- Mata Kuliah -->
                <div class="text-[13px] leading-[17px] box-border w-full font-sans font-bold text-left"
                  :class="s.kind === 'PENGGANTI' ? 'text-[#78350F]' : 'text-[#1D1B3A]'"
                  x-text="s.matkul">
                  Mata Kuliah
                </div>
                <!-- Lokasi dan Dosen -->
                <div class="text-[11px] leading-[15px] box-border w-full font-sans font-normal text-left"
                  :class="s.kind === 'PENGGANTI' ? 'text-[#92400E]' : 'text-[#667085]'"
                  x-text="(s.ruang ? s.ruang + ' · ' : '') + s.dosen">
                  Ruang · Dosen
                </div>
                <!-- Khusus Kuliah Pengganti -->
                <template x-if="s.kind === 'PENGGANTI'">
                  <div class="text-[10px] box-border w-full text-[#B45309] font-sans font-medium italic text-left"
                    x-text="fmtAsalPengganti(s.originDate, s.reason)">
                    Pengganti sesi
                  </div>
                </template>
                <!-- Tombol Zoom / Daring jika ada -->
                <template x-if="s.link">
                  <a :href="s.link" target="_blank" rel="noopener noreferrer"
                    class="mt-1 w-full flex items-center justify-center gap-1.5 py-1.5 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-[11px] font-medium transition-colors">
                    <svg viewBox="0 0 14 14" class="w-3.5 h-3.5" fill="currentColor"><path d="M2.974 11.084a.94.94 0 0 1-.944-.943V3.86a.94.94 0 0 1 .944-.944h6.282c.52 0 .943.424.943.944v2.714l1.367-1.364a.2.2 0 0 1 .33.157v3.268a.2.2 0 0 1-.33.157l-1.367-1.364v2.714c0 .52-.423.943-.943.943H2.974z"/></svg>
                    <span>Zoom Kelas</span>
                  </a>
                </template>
              </div>
            </template>
            <!-- Placeholder saat tidak ada sesi di hari ini -->
            <template x-if="(jadwalPekan[d] || []).length === 0">
              <div class="w-full py-16 flex flex-col items-center justify-center text-center">
                <span class="text-[11px] font-medium text-slate-400">Tidak ada sesi</span>
              </div>
            </template>
          </div>
        </div>
      </template>
    </div>

    <!-- Tampilan Daftar / Agenda Mingguan (DESKTOP) -->
    <div x-show="modeTampilan === 'daftar'" class="box-border w-full flex flex-col gap-4">
      <template x-for="d in pekanHariListDesktop" :key="'list-' + d">
        <div class="w-full border border-slate-200 rounded-xl p-4 bg-slate-50/50">
          <div class="flex items-center justify-between pb-2 border-b border-slate-200">
            <span class="font-bold text-[14px] text-slate-800" x-text="d + ', ' + tanggalPekanFormatted[d]">Senin</span>
            <span class="text-[12px] text-slate-500 font-medium" x-text="(jadwalPekan[d] || []).length + ' Sesi'">0 Sesi</span>
          </div>
          <div class="mt-3 space-y-2">
            <template x-for="s in (jadwalPekan[d] || [])" :key="'list-s-' + s.id">
              <div class="bg-white p-3 rounded-lg border border-slate-200 flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="font-mono text-[12px] font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md" x-text="s.timeStart + ' - ' + s.timeEnd">08:40 - 10:20</span>
                  <div>
                    <p class="font-bold text-[13px] text-slate-900" x-text="s.matkul">Mata Kuliah</p>
                    <p class="text-[11px] text-slate-500" x-text="(s.ruang ? s.ruang + ' · ' : '') + s.dosen">Ruang · Dosen</p>
                  </div>
                </div>
                <span class="text-[11px] px-2.5 py-1 rounded-md font-semibold"
                  :class="s.kind === 'PENGGANTI' ? 'bg-amber-100 text-amber-800' : (s.activityType === 'PRACTICE' ? 'bg-purple-100 text-purple-800' : 'bg-blue-100 text-blue-800')"
                  x-text="s.kind === 'PENGGANTI' ? 'Pengganti' : (s.activityType === 'PRACTICE' ? 'Praktikum' : 'Teori')">Teori</span>
              </div>
            </template>
            <div x-show="(jadwalPekan[d] || []).length === 0" class="text-slate-400 text-[12px] py-2">Tidak ada sesi kelas pada hari ini.</div>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- KONTEN JADWAL MAHASISWA (MOBILE 390) -->
  <div x-show="!jadwalLoading && !jadwalError" class="box-border w-full flex md:hidden flex-col gap-[12px] justify-start items-start">

    <!-- Daftar Sesi untuk Hari Terpilih -->
    <template x-if="jadwalEfektif.length > 0">
      <div class="w-full flex flex-col gap-[12px]">
        <template x-for="s in jadwalHari" :key="'mob-' + s.id">
          <div class="box-border w-full h-fit shrink-0 [box-shadow:0px_2px_5px_#0F172A08] flex flex-col gap-[8px] p-[16px] justify-start items-start bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[16px]">
            <!-- Waktu dan jenis sesi -->
            <div class="box-border w-full h-fit shrink-0 flex flex-row gap-[8px] justify-between items-center">
              <div class="text-[12px] font-mono font-bold text-left whitespace-nowrap"
                :class="s.kind === 'PENGGANTI' ? 'text-[#D97706]' : 'text-[#2563EB]'"
                x-text="s.timeStart + ' - ' + s.timeEnd + ' WIB'">
                08:40 - 10:20 WIB
              </div>
              <div class="box-border w-fit shrink-0 h-fit flex flex-row gap-[6px] justify-start items-center">
                <div class="box-border w-fit shrink-0 h-fit flex flex-row px-[8px] py-[4px] justify-start items-center rounded-[6px]"
                  :class="s.kind === 'PENGGANTI' ? 'bg-[#FEF3C7] [outline:1px_solid_#FDE68A] text-[#92400E]' : (s.link && s.activityType === 'THEORY' ? 'bg-[#F5F3FF] [outline:1px_solid_#DDD6FE] text-[#6D28D9]' : (s.activityType === 'PRACTICE' ? 'bg-[#F5F3FF] [outline:1px_solid_#DDD6FE] text-[#6D28D9]' : 'bg-[#EFF6FF] [outline:1px_solid_#BFDBFE] text-[#1D4ED8]'))">
                  <span class="text-[10px] font-sans font-bold whitespace-nowrap"
                    x-text="s.kind === 'PENGGANTI' ? 'PENGGANTI' : (s.link && s.activityType === 'THEORY' ? 'TEORI HYBRID' : (s.activityType === 'PRACTICE' ? 'PRAKTIKUM' : 'TEORI'))">TEORI</span>
                </div>
                <svg viewBox="0 0 14 14" class="w-[17px] h-[17px] shrink-0 text-[#94A3B8]" fill="currentColor">
                  <path d="M7.755 7L5.277 4.522a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l2.56 2.56a.47.47 0 0 1 0 .66l-2.56 2.56a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41L7.755 7z"/>
                </svg>
              </div>
            </div>

            <!-- Nama Mata Kuliah -->
            <div class="text-[16px] leading-[21px] box-border w-full text-[#0F172A] font-sans font-bold text-left"
              x-text="s.matkul">
              Mata Kuliah
            </div>

            <!-- Detail lokasi dan dosen -->
            <div class="text-[12px] leading-[18px] box-border w-full text-[#475569] font-sans font-medium text-left"
              x-text="(s.ruang ? s.ruang + ' · ' : '') + (s.dosen ? 'Dosen: ' + s.dosen : '') + (s.link ? ' · Daring & Luring' : '')">
              Ruang · Dosen
            </div>

            <!-- Tombol Gabung Zoom jika ada link -->
            <template x-if="s.link">
              <a :href="s.link" target="_blank" rel="noopener noreferrer"
                class="box-border w-full h-[44px] shrink-0 flex flex-row gap-[7px] px-[12px] justify-center items-center bg-[#2563EB] active:bg-[#1D4ED8] text-white rounded-[12px] transition-colors mt-1">
                <svg viewBox="0 0 14 14" class="w-[16px] h-[16px] shrink-0" fill="currentColor">
                  <path d="M2.974 11.084a.94.94 0 0 1-.944-.943V3.86a.94.94 0 0 1 .944-.944h6.282c.52 0 .943.424.943.944v2.714l1.367-1.364a.2.2 0 0 1 .33.157v3.268a.2.2 0 0 1-.33.157l-1.367-1.364v2.714c0 .52-.423.943-.943.943H2.974z"/>
                </svg>
                <span class="text-[12px] font-sans font-bold whitespace-nowrap">Gabung Kuliah Daring Zoom</span>
                <svg viewBox="0 0 14 14" class="w-[14px] h-[14px] shrink-0" fill="currentColor">
                  <path d="M3.274 11.666a.94.94 0 0 1-.943-.943V3.272c0-.52.423-.943.943-.943h2.984a.29.29 0 0 1 .29.29.29.29 0 0 1-.29.29H3.274a.36.36 0 0 0-.36.363v7.451c0 .2.16.36.36.36h7.451a.36.36 0 0 0 .36-.36V7.75a.29.29 0 0 1 .29-.29.29.29 0 0 1 .29.29v2.973c0 .52-.423.943-.94.943H3.274zm7.81-8.336L5.885 8.525a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41l5.195-5.199H8.46a.29.29 0 0 1-.29-.29.29.29 0 0 1 .29-.29h2.734c.48 0 .81.33.81.81v2.734a.29.29 0 0 1-.29.29.29.29 0 0 1-.29-.29V3.33z"/>
                </svg>
              </a>
            </template>

            <!-- Metadata footer pemisah (PJ Matkul & Pekan) -->
            <div class="box-border w-full h-fit shrink-0 flex flex-col gap-[7px] justify-start items-start mt-1">
              <div class="box-border w-full h-[1px] shrink-0 bg-[#F1F5F9]"></div>
              <div class="text-[11px] leading-[15px] box-border w-full text-[#64748B] font-sans font-medium text-left"
                x-text="(s.pj ? 'PJ Matkul: ' + s.pj + ' · ' : '') + 'Sesi Reguler Pekan Ke-' + pekanAktifNum">
                Sesi Reguler Pekan Ke-6
              </div>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Empty State Mobile (SCR-USER-SCHED-EMPTY · Mobile 390 · Tampilan tanpa jadwal) -->
    <template x-if="jadwalEfektif.length === 0">
      <div class="box-border w-full h-fit shrink-0 [box-shadow:0px_2px_7px_#0F172A08] flex flex-col gap-0 p-[28px] justify-start items-center bg-[#FFFFFF] [outline:1px_solid_#E2E8F0] [outline-offset:-0.5px] rounded-[16px]">
        <div class="box-border w-full h-fit shrink-0 flex flex-col gap-[10px] p-[10px_0px_0px_0px] justify-start items-center text-center">
          <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-1">
            <svg viewBox="0 0 14 14" class="w-6 h-6" fill="currentColor">
              <path d="M3.274 12.25a.94.94 0 0 1-.94-.94V3.86a.94.94 0 0 1 .94-.94h1.032V1.936a.31.31 0 0 1 .62 0V2.92h4.173V1.936a.31.31 0 0 1 .62 0V2.92h1.032c.52 0 .94.42.94.94v7.45a.94.94 0 0 1-.94.94H3.274zm0-.585h7.45a.36.36 0 0 0 .36-.36V6.192H2.915V11.3a.36.36 0 0 0 .36.36z"/>
            </svg>
          </div>
          <div class="text-[18px] leading-[23px] box-border w-full text-[#0F172A] font-sans font-bold text-center">
            Tidak Ada Jadwal Kuliah
          </div>
          <div class="text-[13px] leading-[20px] box-border w-full text-[#64748B] font-sans font-normal text-center">
            Tidak ada sesi kelas yang dijadwalkan untuk hari <span class="font-semibold text-slate-700" x-text="tanggalHariTerpilihFormat">Sabtu</span>. Waktu luang dapat digunakan untuk istirahat atau menyelesaikan tugas mandiri.
          </div>
        </div>

        <div class="box-border w-full h-fit shrink-0 flex flex-col gap-[10px] p-[24px_0px_0px_0px] justify-start items-start">
          <!-- Aksi 1: Lihat Jadwal Besok -->
          <button type="button" @click="lihatJadwalBesok()"
            class="box-border w-full h-[44px] shrink-0 flex flex-row gap-[8px] justify-center items-center bg-[#2563EB] active:bg-[#1D4ED8] rounded-[10px] transition-colors">
            <span class="text-[13px] text-[#FFFFFF] font-sans font-bold whitespace-nowrap">Lihat Jadwal Besok</span>
            <svg viewBox="0 0 14 14" class="w-[18px] h-[18px] shrink-0" fill="currentColor">
              <path d="M9.963 7.29H3.21a.29.29 0 0 1-.29-.29.29.29 0 0 1 .29-.29h6.753L6.79 3.538a.29.29 0 0 1 0-.41.29.29 0 0 1 .41 0l3.548 3.548a.47.47 0 0 1 0 .66L7.2 10.884a.29.29 0 0 1-.41 0 .29.29 0 0 1 0-.41l3.173-3.184z" fill="#FFFFFF"/>
            </svg>
          </button>

          <!-- Aksi 2: Periksa Tugas Aktif -->
          <button type="button" @click="go('tugas')"
            class="box-border w-full h-[44px] shrink-0 flex flex-row gap-[8px] justify-center items-center bg-[#FFFFFF] hover:bg-slate-50 [outline:1px_solid_#CBD5E1] [outline-offset:-0.5px] rounded-[10px] transition-colors">
            <span class="text-[13px] text-[#334155] font-sans font-bold whitespace-nowrap">Periksa Tugas Aktif</span>
            <div class="box-border w-[22px] shrink-0 h-[22px] flex flex-row justify-center items-center bg-[#FEF3C7] rounded-[6px]">
              <span class="text-[11px] text-[#92400E] font-sans font-bold whitespace-nowrap" x-text="activeTasksCount">2</span>
            </div>
          </button>
        </div>
      </div>
    </template>
  </div>

</section>
