<!-- partials/portal/topbar.html + drawer.html + toast.html — Portal -->
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-[#EEEEEE]">
  <div class="flex items-center gap-3 px-4 md:px-8 h-16 max-w-[1280px] mx-auto w-full">
    <button type="button" @click="drawer = true" aria-label="Buka menu" class="md:hidden p-2 -ml-2 min-w-[44px] min-h-[44px] flex items-center justify-center rounded-lg hover:bg-slate-100">
      <span class="material-symbols-outlined">menu</span>
    </button>
    <div class="relative flex-1 max-w-xl">
      <img src="/assets/icons/search.svg" alt="" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 pointer-events-none" />
      <input type="text" x-model="q" @keydown.enter="go('tugas')" placeholder="Cari tugas atau jadwal..."
             class="w-full h-11 pl-10 pr-4 rounded-xl border border-[#EEEEEE] bg-white text-[14px] focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
    </div>
    <div class="ml-auto shrink-0">
      <label for="portal-semester-picker" class="sr-only">Pilih semester</label>
      <select id="portal-semester-picker" @change="if ($event.target.value === 'archive') go('arsip'); else go('dashboard')" class="h-11 max-w-[150px] rounded-xl border border-[#EEEEEE] px-2 text-[12px] bg-white">
        <option value="active">Semester aktif</option>
        <option value="archive">Arsip semester</option>
      </select>
    </div>
  </div>
</header>
