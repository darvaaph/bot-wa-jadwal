<!-- partials/pj/view-dosen.html — PJ Dosen Berhalangan + Ganti Hari + Preview -->
<section x-show="view === 'dosen'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
    <div>
      <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Dosen Berhalangan</h1>
      <p class="text-[14px] text-slate-500 mt-1">Catat perubahan perkuliahan <span x-text="pjMatkul || ''">-</span> dan beri kabar ke kelas</p>
    </div>
    <button type="button" @click="publishDosen()" class="h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold self-start min-h-[44px]">Publish info</button>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-5 gap-4 mt-5 items-start">
    <div class="lg:col-span-3 p-5 rounded-2xl border border-[#EEEEEE] bg-white">
      <h2 class="text-[18px] font-semibold">Informasi perkuliahan</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Tanggal kelas <span class="text-[#FF6C48]">*</span></label>
          <input type="text" x-model="dosen.tanggal" placeholder="24 September 2026" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Jam kelas</label>
          <input type="text" x-model="dosen.jam" placeholder="10.00 - 11.40" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
      </div>
      <p class="text-[13px] font-medium mt-4 mb-2">Mode perkuliahan pengganti <span class="text-[#FF6C48]">*</span></p>
      <div class="grid grid-cols-2 gap-3">
        <button type="button" @click="dosen.mode = 'online'"
          :class="dosen.mode === 'online' ? 'border-[#3965FB] bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'border-[#EEEEEE]'"
          class="h-12 rounded-xl border text-[14px] min-h-[44px]">Kelas online</button>
        <button type="button" @click="dosen.mode = 'ganti'"
          :class="dosen.mode === 'ganti' ? 'border-[#3965FB] bg-[#E9EAFF] text-[#3965FB] font-semibold' : 'border-[#EEEEEE]'"
          class="h-12 rounded-xl border text-[14px] min-h-[44px]">Ganti hari</button>
      </div>
      <div x-show="dosen.mode === 'ganti'" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Hari pengganti</label>
          <select x-model="dosen.hariGanti" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white focus:outline-none focus:ring-2 focus:ring-[#3965FB]">
            <option value="">-- Pilih hari --</option>
            <template x-for="d in ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu']" :key="d"><option :value="d" x-text="d">-</option></template>
          </select>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Jam pengganti</label>
          <input type="text" x-model="dosen.jamGanti" placeholder="10.00 - 11.40" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Alasan dosen <span class="text-[#FF6C48]">*</span></label>
          <input type="text" x-model="dosen.alasan" placeholder="Berhalangan hadir" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Link meeting</label>
          <input type="text" x-model="dosen.link" placeholder="meet.google.com/kelas-..." class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="previewDosen()" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] font-medium min-h-[44px]">Lihat preview</button>
        <button type="button" @click="publishDosen()" class="flex-1 h-11 rounded-xl bg-[#3965FB] text-white font-semibold min-h-[44px]">Konfirmasi &amp; publish</button>
      </div>
    </div>
    <div class="lg:col-span-2 p-5 rounded-2xl border border-[#EEEEEE] bg-white">
      <h2 class="text-[18px] font-semibold">Preview pengumuman</h2>
      <p class="text-[12px] text-slate-500">Pesan otomatis untuk grup kelas</p>
      <div class="mt-3 p-4 rounded-2xl bg-[#E1FFB7]/60 border border-[#d3f5a0] text-[13px] leading-relaxed">
        <p class="text-[11px] font-semibold tracking-wide text-slate-600">INFO PERKULIAHAN • <span x-text="selectedClass">-</span></p>
        <p class="text-[18px] font-semibold mt-1" x-text="dosen.mode === 'ganti' ? 'Jadwal diganti hari' : 'Perkuliahan dialihkan online'">-</p>
        <p class="mt-2" x-text="(dosen.tanggal || '—') + (dosen.mode === 'ganti' && dosen.hariGanti ? ' → ' + dosen.hariGanti + ' ' + dosen.jamGanti : '')">-</p>
        <p class="mt-1" x-text="dosen.alasan || 'Alasan belum diisi.'">-</p>
        <p class="text-[#3965FB] mt-1" x-show="dosen.link" x-text="'Tautan pertemuan: ' + dosen.link">-</p>
      </div>
      <span class="inline-block mt-3 px-3 py-1.5 rounded-lg bg-[#FCD484] text-[12px] font-semibold">Menunggu publish</span>
      <button type="button" @click="copyDosen()" class="mt-3 w-full h-11 rounded-xl border border-[#EEEEEE] text-[14px] font-medium hover:bg-slate-50 min-h-[44px] flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-[18px]">content_copy</span><span>Salin teks pengumuman</span>
      </button>
    </div>
  </div>
</section>
