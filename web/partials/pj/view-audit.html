<section x-show="view === 'audit'" x-cloak>
  <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Riwayat Perubahan</h1>
  <p class="mt-1 text-[14px] text-slate-500">Aktivitas yang tercatat untuk penugasan PJ aktif.</p>
  <p x-show="auditLoading" class="mt-5 py-6 text-center text-[13px] text-slate-500" role="status">Memuat riwayat...</p>
  <div x-show="auditError" class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-[13px] text-red-700" role="alert"><span x-text="auditError"></span><button type="button" @click="loadAuditPJ()" class="ml-2 font-semibold underline">Coba lagi</button></div>
  <div x-show="!auditLoading && !auditError && auditList.length === 0" class="mt-5 rounded-2xl border border-dashed border-[#EEEEEE] p-8 text-center text-[13px] text-slate-500">Belum ada perubahan yang tercatat.</div>
  <div class="mt-5 space-y-2"><template x-for="a in auditList" :key="a.id"><article class="rounded-2xl border border-[#EEEEEE] bg-white p-4"><button type="button" @click="auditDetailId = auditDetailId === a.id ? null : a.id" class="w-full text-left focus:outline-none focus:ring-2 focus:ring-[#3965FB]"><p class="text-[14px] font-semibold" x-text="labelAuditPJ(a.action)"></p><p class="mt-1 text-[12px] text-slate-500" x-text="(a.entity_type || 'Objek') + (a.entity_id ? ' #' + a.entity_id : '') + ' · ' + API.fmtWaktuID(a.created_at)"></p></button><div x-show="auditDetailId === a.id" class="mt-3 rounded-xl bg-slate-50 p-3 text-[12px] text-slate-600"><p x-show="a.reason" x-text="'Alasan: ' + a.reason"></p><pre class="mt-2 overflow-x-auto whitespace-pre-wrap break-all font-mono text-[11px]" x-text="JSON.stringify(a.after_json || {}, null, 2)"></pre></div></article></template></div>
</section>
