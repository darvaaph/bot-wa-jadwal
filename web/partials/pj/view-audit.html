<!-- partials/pj/view-audit.html — PJ Riwayat Perubahan (Audit Log) -->
<section x-show="view === 'audit'" x-cloak>
  <div class="mb-4">
    <h1 class="font-display text-[22px] sm:text-[26px] md:text-[30px] font-bold text-slate-900 tracking-tight">Riwayat Perubahan</h1>
    <p class="mt-1 text-[13px] sm:text-[14px] text-slate-500">Catatan aktivitas dan audit log untuk penugasan PJ aktif.</p>
  </div>

  <!-- Loading State -->
  <div x-show="auditLoading" class="mt-4 space-y-3 py-2" role="status">
    <div class="p-4 sm:p-5 rounded-2xl border border-slate-200 bg-white animate-pulse space-y-3">
      <div class="h-4 bg-slate-200 rounded w-1/4"></div>
      <div class="h-3 bg-slate-200 rounded w-1/2"></div>
    </div>
  </div>

  <!-- Error State -->
  <div x-show="auditError" class="mt-4 rounded-xl border border-red-200 bg-red-50 p-4 text-[13px] text-red-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2" role="alert">
    <span x-text="auditError"></span>
    <button type="button" @click="loadAuditPJ()" class="min-h-[44px] px-4 py-2 rounded-lg bg-red-100 hover:bg-red-200 text-red-800 font-semibold text-[13px] transition cursor-pointer w-fit">Coba lagi</button>
  </div>

  <!-- Empty State -->
  <div x-show="!auditLoading && !auditError && auditList.length === 0" class="mt-6 rounded-2xl border border-dashed border-slate-300 bg-white p-8 sm:p-12 text-center">
    <div class="w-12 h-12 rounded-full bg-slate-100 mx-auto flex items-center justify-center text-slate-400 mb-3">
      <span class="material-symbols-outlined text-[24px]">history</span>
    </div>
    <p class="text-[14px] font-semibold text-slate-900">Belum ada aktivitas tercatat</p>
    <p class="text-[13px] text-slate-500 mt-0.5 max-w-sm mx-auto">Perubahan jadwal atau pengajuan tugas akan otomatis terekam di sini.</p>
  </div>

  <!-- List Audit Items -->
  <div x-show="!auditLoading && !auditError && auditList.length > 0" class="mt-4 space-y-3">
    <template x-for="a in auditList" :key="a.id">
      <article class="p-4 sm:p-5 rounded-2xl border border-slate-200 bg-white shadow-xs">
        <button type="button" @click="auditDetailId = auditDetailId === a.id ? null : a.id"
                class="w-full text-left flex items-start justify-between gap-3 min-h-[44px] cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-lg">
          <div class="flex-1 min-w-0">
            <p class="text-[14px] sm:text-[15px] font-bold text-slate-900 leading-snug" x-text="labelAuditPJ(a.action)"></p>
            <div class="mt-1 flex items-center gap-2 text-[12px] text-slate-500 flex-wrap">
              <span class="inline-flex items-center px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-mono text-[11px]"
                    x-text="(a.entity_type || 'Objek') + (a.entity_id ? ' #' + a.entity_id : '')">
              </span>
              <span>·</span>
              <span x-text="API.fmtWaktuID(a.created_at)"></span>
            </div>
          </div>
          <span class="material-symbols-outlined text-[20px] text-slate-400 shrink-0 transition-transform duration-200 mt-0.5"
                :class="auditDetailId === a.id ? 'rotate-180 text-blue-600' : ''">expand_more</span>
        </button>

        <!-- Detail Accordion -->
        <div x-show="auditDetailId === a.id" x-collapse class="mt-3 pt-3 border-t border-slate-100 text-[12px] text-slate-600">
          <p x-show="a.reason" class="font-medium text-slate-800 mb-2" x-text="'Alasan: ' + a.reason"></p>
          <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 overflow-hidden">
            <div class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1">Payload Perubahan</div>
            <pre class="overflow-x-auto whitespace-pre-wrap break-all font-mono text-[11px] text-slate-800" x-text="JSON.stringify(a.after_json || {}, null, 2)"></pre>
          </div>
        </div>
      </article>
    </template>
  </div>
</section>
