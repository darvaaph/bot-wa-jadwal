<!-- partials/pj/view-status.html — PJ Status Pemeriksaan (review KM atas tugas PJ) -->
<section x-show="view === 'status'" x-cloak>
  <div class="mb-4">
    <h1 class="font-display text-[22px] sm:text-[26px] md:text-[30px] font-bold text-slate-900 tracking-tight">Status Pemeriksaan</h1>
    <p class="text-[13px] sm:text-[14px] text-slate-500 mt-1">Hasil pemeriksaan Ketua Murid atas tugas <span class="font-medium text-slate-700" x-text="pjMatkul || 'mata kuliah Anda'">-</span>.</p>
  </div>

  <!-- State: Kosong -->
  <div x-show="tugasSaya.length === 0" class="mt-6 rounded-2xl border border-dashed border-slate-300 bg-white p-8 sm:p-12 text-center">
    <div class="w-12 h-12 rounded-full bg-slate-100 mx-auto flex items-center justify-center text-slate-400 mb-3">
      <span class="material-symbols-outlined text-[24px]">assignment_turned_in</span>
    </div>
    <p class="text-[14px] font-semibold text-slate-900">Belum ada tugas untuk diperiksa</p>
    <p class="text-[13px] text-slate-500 mt-0.5 max-w-sm mx-auto">Semua draf tugas yang diajukan ke Ketua Murid akan muncul status pemeriksaannya di sini.</p>
  </div>

  <!-- Daftar Status Pemeriksaan -->
  <div x-show="tugasSaya.length > 0" class="mt-4 space-y-3">
    <template x-for="t in tugasSaya" :key="t.id">
      <button type="button" @click="bukaDetailTugas(t.id)"
              class="w-full p-4 sm:p-5 rounded-2xl border border-slate-200 bg-white shadow-xs hover:border-blue-400 hover:shadow-sm transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-left cursor-pointer group">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap mb-1">
            <span class="text-[11px] font-bold uppercase tracking-wider text-blue-600" x-text="t.matkul || pjMatkul || 'Mata Kuliah'"></span>
            <span x-show="t.task_type" class="text-[11px] text-slate-400 font-medium">· <span x-text="t.task_type"></span></span>
          </div>
          <p class="text-[14px] sm:text-[15px] font-bold text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-2"
             x-text="t.title || t.deskripsi">-</p>
          <div class="flex items-center gap-1.5 text-[12px] text-slate-500 mt-1.5">
            <span class="material-symbols-outlined text-[16px] text-slate-400">schedule</span>
            <span x-text="'Tenggat: ' + t.deadline">-</span>
          </div>
        </div>

        <div class="flex items-center justify-between sm:justify-end gap-2 shrink-0 pt-2 sm:pt-0 border-t border-slate-100 sm:border-t-0">
          <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-[12px] font-semibold"
            :class="String(t.review_state).toUpperCase() === 'APPROVED' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : (String(t.review_state).toUpperCase() === 'CHANGES_REQUESTED' ? 'bg-amber-50 text-amber-900 border border-amber-200' : 'bg-slate-100 text-slate-700 border border-slate-200')">
            <span class="material-symbols-outlined text-[16px]" x-text="String(t.review_state).toUpperCase() === 'APPROVED' ? 'check_circle' : (String(t.review_state).toUpperCase() === 'CHANGES_REQUESTED' ? 'warning' : 'pending')">-</span>
            <span x-text="reviewLabel(t.review_state) + ' · v' + t.version">-</span>
          </span>
          <span class="material-symbols-outlined text-[18px] text-slate-400 group-hover:text-blue-600 group-hover:translate-x-0.5 transition-all">chevron_right</span>
        </div>
      </button>
    </template>
  </div>
</section>
