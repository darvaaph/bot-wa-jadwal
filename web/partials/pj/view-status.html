<!-- partials/pj/view-status.html — PJ Status Pemeriksaan (review KM atas tugas PJ) -->
<section x-show="view === 'status'" x-cloak>
  <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Status Pemeriksaan</h1>
  <p class="text-[14px] text-slate-500 mt-1">Hasil pemeriksaan KM atas tugas <span x-text="pjMatkul || 'yang ditugaskan'">-</span>.</p>
  <div x-show="tugasSaya.length === 0" class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center text-[13px] text-slate-400">Belum ada tugas untuk diperiksa.</div>
  <div class="mt-4 space-y-3">
    <template x-for="t in tugasSaya" :key="t.id">
      <div class="p-4 rounded-2xl border border-[#EEEEEE] bg-white flex flex-col md:flex-row md:items-center gap-3">
        <div class="flex-1 min-w-0">
          <p class="text-[15px] font-medium line-clamp-1" x-text="t.deskripsi">-</p>
          <p class="text-[12px] text-slate-500" x-text="'Tenggat ' + t.deadline">-</p>
        </div>
        <span class="px-3 py-1.5 rounded-lg bg-[#FCD484] text-[12px] font-semibold shrink-0">Menunggu pemeriksaan</span>
      </div>
    </template>
  </div>
  <p class="text-[11px] text-slate-400 mt-3">Status detail (Disetujui / Perlu koreksi) butuh endpoint review backend.</p>
</section>

<!-- partials/pj/view-materi.html — PJ Materi -->
<section x-show="view === 'materi'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
    <div>
      <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Materi</h1>
      <p class="text-[14px] text-slate-500 mt-1">Materi <span x-text="pjMatkul || 'mata kuliah yang ditugaskan'">-</span>.</p>
    </div>
    <button type="button" @click="soon('Tambah materi')" class="h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold self-start min-h-[44px]">Tambah materi</button>
  </div>
  <div class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center">
    <img src="/assets/illustrations/empty-folder.svg" alt="" class="w-16 h-16 mx-auto opacity-70" />
    <p class="text-[15px] font-semibold mt-3">Belum ada materi</p>
    <p class="text-[13px] text-slate-500">Materi tampil di sini setelah endpoint materi tersedia.</p>
  </div>
</section>
