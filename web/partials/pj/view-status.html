<!-- partials/pj/view-status.html — PJ Status Pemeriksaan (review KM atas tugas PJ) -->
<section x-show="view === 'status'" x-cloak>
  <h1 class="font-display text-[26px] md:text-[30px] font-bold">Status Pemeriksaan</h1>
  <p class="text-[14px] text-slate-500 mt-1">Hasil pemeriksaan KM atas tugas <span x-text="pjMatkul || 'yang ditugaskan'">-</span>.</p>
  <div x-show="tugasSaya.length === 0" class="ui-card mt-5 p-10 text-center text-[13px] text-slate-400">Belum ada tugas untuk diperiksa.</div>
  <div class="mt-4 space-y-3">
    <template x-for="t in tugasSaya" :key="t.id">
      <button type="button" @click="bukaDetailTugas(t.id)" class="ui-button ui-button--ghost w-full p-4 rounded-2xl border border-border bg-white flex flex-col md:flex-row md:items-center gap-3 text-left">
        <div class="flex-1 min-w-0">
          <p class="text-[15px] font-medium line-clamp-1" x-text="t.title || t.deskripsi">-</p>
          <p class="text-[12px] text-slate-500" x-text="'Tenggat ' + t.deadline">-</p>
        </div>
        <span class="ui-badge inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-[12px] font-semibold shrink-0"
          :class="String(t.review_state).toUpperCase() === 'APPROVED' ? 'bg-success text-green-800' : (String(t.review_state).toUpperCase() === 'CHANGES_REQUESTED' ? 'bg-warning-soft text-amber-900' : 'bg-slate-100 text-slate-600')">
          <span class="material-symbols-outlined text-[16px]" x-text="String(t.review_state).toUpperCase() === 'APPROVED' ? 'check_circle' : (String(t.review_state).toUpperCase() === 'CHANGES_REQUESTED' ? 'warning' : 'pending')">-</span>
          <span x-text="reviewLabel(t.review_state) + ' · versi ' + t.version">-</span>
        </span>
      </button>
    </template>
  </div>
</section>
