<!-- partials/pj/view-jadwal.html — PJ Jadwal + Pindah + Perubahan -->
<section x-show="view === 'jadwal'" x-cloak>
  <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
    <div>
      <h1 class="text-[26px] md:text-[30px] font-bold" style="font-family:'Poppins',sans-serif">Manajemen Jadwal</h1>
      <p class="text-[14px] text-slate-500 mt-1">Kalender <span x-text="pjMatkul || 'mata kuliah yang ditugaskan'">-</span> dan perubahan terkini</p>
    </div>
    <button type="button" @click="go('dosen')" class="h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold self-start min-h-[44px]">Pindah jadwal</button>
  </div>
  <div class="flex items-center gap-3 mt-5">
    <button type="button" @click="weekOffset--" aria-label="Minggu lalu" class="w-11 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] flex items-center justify-center hover:bg-[#E9EAFF]"><span class="material-symbols-outlined">chevron_left</span></button>
    <span class="text-[14px] font-medium" x-text="weekLabel">-</span>
    <button type="button" @click="weekOffset++" aria-label="Minggu depan" class="w-11 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] flex items-center justify-center hover:bg-[#E9EAFF]"><span class="material-symbols-outlined">chevron_right</span></button>
  </div>
  <div class="p-5 rounded-2xl border border-[#EEEEEE] bg-white mt-4 overflow-x-auto">
    <h2 class="text-[18px] font-semibold">Kalender mingguan</h2>
    <div class="grid grid-cols-5 gap-2 mt-4 min-w-[640px]">
      <template x-for="d in weekDays" :key="d.name">
        <div class="text-center text-[12px] font-medium bg-slate-50 rounded-lg py-2"><span x-text="d.name">-</span> <span class="text-slate-400" x-text="d.dateNum">-</span></div>
      </template>
      <template x-for="slot in ['08','10','13','15']" :key="slot">
        <template x-for="d in weekDays" :key="d.name + slot">
          <div class="rounded-lg p-2 min-h-[64px] text-[11px] leading-snug" :class="slotSaya(d.name, slot) ? 'bg-[#E9EAFF]' : 'bg-[#E1FFB7]'">
            <p class="font-mono font-semibold text-[#3965FB]" x-text="slot + '.00'">-</p>
            <p class="font-medium line-clamp-2" x-text="slotSaya(d.name, slot) ? slotSaya(d.name, slot).matkul : 'Kosong'">-</p>
          </div>
        </template>
      </template>
    </div>
  </div>
  <div class="p-5 rounded-2xl border border-[#EEEEEE] bg-white mt-4">
    <h2 class="text-[18px] font-semibold">Perubahan jadwal</h2>
    <p class="text-[13px] text-slate-500">Riwayat perubahan pada mata kuliah yang ditugaskan.</p>
    <div class="py-6 text-center text-[13px] text-slate-400">Butuh endpoint teaching event — riwayat tampil setelah backend siap.</div>
  </div>
</section>
