<!-- partials/pj/view-semester.html — PJ Semester (Mode hanya-baca) -->
<section x-show="view === 'semester'" x-cloak>
  <div class="mb-4">
    <h1 class="font-display text-[22px] sm:text-[26px] md:text-[30px] font-bold text-slate-900 tracking-tight">Semester Perkuliahan</h1>
    <p class="mt-1 text-[13px] sm:text-[14px] text-slate-500">Daftar semester kelas dalam mode hanya-baca untuk konteks PJ aktif.</p>
  </div>

  <!-- Loading State -->
  <div x-show="semesterLoading" class="mt-4 space-y-3 py-2" role="status">
    <div class="p-4 sm:p-5 rounded-2xl border border-slate-200 bg-white animate-pulse space-y-3">
      <div class="h-5 bg-slate-200 rounded w-1/3"></div>
      <div class="h-4 bg-slate-200 rounded w-1/2"></div>
    </div>
  </div>

  <!-- Error State -->
  <div x-show="semesterError" class="mt-4 rounded-xl border border-red-200 bg-red-50 p-4 text-[13px] text-red-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2" role="alert">
    <span x-text="semesterError"></span>
    <button type="button" @click="loadSemesterPJ()" class="min-h-[44px] px-4 py-2 rounded-lg bg-red-100 hover:bg-red-200 text-red-800 font-semibold text-[13px] transition cursor-pointer w-fit">Coba lagi</button>
  </div>

  <!-- Empty State -->
  <div x-show="!semesterLoading && !semesterError && semesterList.length === 0" class="mt-6 rounded-2xl border border-dashed border-slate-300 bg-white p-8 sm:p-12 text-center">
    <div class="w-12 h-12 rounded-full bg-slate-100 mx-auto flex items-center justify-center text-slate-400 mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    </div>
    <p class="text-[14px] font-semibold text-slate-900">Belum ada semester</p>
    <p class="text-[13px] text-slate-500 mt-0.5">Belum ada data semester aktif pada kelas ini.</p>
  </div>

  <!-- List Semester -->
  <div x-show="!semesterLoading && !semesterError && semesterList.length > 0" class="mt-4 space-y-3">
    <template x-for="s in semesterList" :key="s.id">
      <article class="p-4 sm:p-5 rounded-2xl border border-slate-200 bg-white shadow-xs hover:border-slate-300 transition-colors">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h2 class="text-[15px] sm:text-[16px] font-bold text-slate-900" x-text="semesterLabelPJ(s)"></h2>
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider"
                    :class="String(s.status).toUpperCase() === 'ACTIVE' || String(s.status).toUpperCase() === 'AKTIF' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-slate-100 text-slate-600'"
                    x-text="s.status">
              </span>
            </div>
            <div class="mt-1.5 flex items-center gap-1.5 text-[12px] sm:text-[13px] text-slate-500">
              <svg class="w-4 h-4 text-slate-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span class="font-mono" x-text="(s.starts_on || '—') + ' s/d ' + (s.ends_on || '—')"></span>
            </div>
          </div>
        </div>
      </article>
    </template>
  </div>
</section>
