<!-- partials/km/view-tugas.html — KM Tugas: daftar tab, form, tinjau, detail, ubah.
     Mengikuti docs/design/flows/TASK_MANAGEMENT.md (SCR-TASK-001..004, peran KM). -->
<section x-show="view === 'tugas'" x-cloak>
  <template x-if="tugasSub === 'list'">
    <div class="space-y-4 sm:space-y-5">
      <!-- Header Tugas Kelas -->
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-[24px] sm:text-[26px] font-bold text-[#0F172A] tracking-tight">Tugas Kelas</h1>
          <p class="text-[13px] text-[#64748B] mt-1">
            Kelola tugas kuliah, setujui usulan tugas dari PJ mata kuliah, dan pantau tenggat pengumpulan.
          </p>
          <p class="text-[11px] sm:text-[12px] font-medium text-[#667085] mt-1.5 truncate">
            Sedang mengelola: <span class="font-semibold text-[#1D1B3A]" x-text="selectedClass || '—'">-</span><span x-text="activeSemesterLabel ? ' · ' + activeSemesterLabel : ''"></span> · Ketua Murid
          </p>
        </div>
        <button type="button" @click="mulaiTambahTugas()" class="min-h-[44px] h-[40px] px-4 rounded-[12px] bg-[#2563EB] hover:bg-[#1D4ED8] text-[13px] font-semibold text-white flex items-center justify-center gap-2 shadow-sm shrink-0 self-start transition-colors">
          <svg width="18" height="18" viewBox="0 0 14 14" fill="currentColor" class="w-[18px] h-[18px] shrink-0 text-white" aria-hidden="true" focusable="false">
            <path d="M6.33691 7.66309l-2.87451 0q-0.28027 0-0.47168-0.19141-0.19141-0.19141-0.1914-0.47168 0-0.28027 0.1914-0.47168 0.19141-0.19141 0.47168-0.19141l2.87451 0 0-2.87451q0-0.28027 0.19141-0.47168 0.19141-0.19141 0.47168-0.1914 0.28027 0 0.47168 0.1914 0.19141 0.19141 0.19141 0.47168l0 2.87451 2.87451 0q0.28027 0 0.47168 0.19141 0.19141 0.19141 0.1914 0.47168 0 0.28027-0.1914 0.47168-0.19141 0.19141-0.47168 0.19141l-2.87451 0 0 2.87451q0 0.28027-0.19141 0.47168-0.19141 0.19141-0.47168 0.1914-0.28027 0-0.47168-0.1914-0.19141-0.19141-0.19141-0.47168l0-2.87451z"/>
          </svg>
          <span>Tambah Tugas Baru</span>
        </button>
      </div>

      <!-- Navigasi Terpadu Manajemen Tugas -->
      <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3 pt-1">
        <!-- Tab Status dan Review -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 -mx-1 px-1" role="tablist" aria-label="Tab status tugas">
          <button type="button" @click="tugasTab = 'aktif'" role="tab" :aria-selected="tugasTab === 'aktif'"
            :class="tugasTab === 'aktif' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold border-[#BFDBFE]' : 'bg-white text-[#475569] font-medium border-[#E2E8F0] hover:bg-slate-50'"
            class="min-h-[44px] h-[36px] px-3 rounded-[10px] border text-[12px] whitespace-nowrap flex items-center transition-colors">
            <span>Tugas Aktif</span>
            <span class="ml-1" x-text="'(' + (tugasTabCounts.aktif || 0) + ')'">(0)</span>
          </button>
          <button type="button" @click="tugasTab = 'review'" role="tab" :aria-selected="tugasTab === 'review'"
            :class="tugasTab === 'review' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold border-[#BFDBFE]' : 'bg-white text-[#475569] font-medium border-[#E2E8F0] hover:bg-slate-50'"
            class="min-h-[44px] h-[36px] px-3 rounded-[10px] border text-[12px] whitespace-nowrap flex items-center transition-colors">
            <span>Perlu Review</span>
            <span class="ml-1" x-text="'(' + (tugasTabCounts.review || 0) + ')'">(0)</span>
          </button>
          <button type="button" @click="tugasTab = 'draf'" role="tab" :aria-selected="tugasTab === 'draf'"
            :class="tugasTab === 'draf' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold border-[#BFDBFE]' : 'bg-white text-[#475569] font-medium border-[#E2E8F0] hover:bg-slate-50'"
            class="min-h-[44px] h-[36px] px-3 rounded-[10px] border text-[12px] whitespace-nowrap flex items-center transition-colors">
            <span>Draf</span>
            <span class="ml-1" x-text="'(' + (tugasTabCounts.draf || 0) + ')'">(0)</span>
          </button>
          <button type="button" @click="tugasTab = 'selesai_terlewat'" role="tab" :aria-selected="tugasTab === 'selesai_terlewat' || tugasTab === 'selesai' || tugasTab === 'terlewat'"
            :class="(tugasTab === 'selesai_terlewat' || tugasTab === 'selesai' || tugasTab === 'terlewat') ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold border-[#BFDBFE]' : 'bg-white text-[#475569] font-medium border-[#E2E8F0] hover:bg-slate-50'"
            class="min-h-[44px] h-[36px] px-3 rounded-[10px] border text-[12px] whitespace-nowrap flex items-center transition-colors">
            <span>Selesai &amp; Terlewat</span>
            <span class="ml-1" x-text="'(' + (tugasTabCounts.selesai_terlewat || 0) + ')'">(0)</span>
          </button>
          <button type="button" @click="tugasTab = 'arsip'" role="tab" :aria-selected="tugasTab === 'arsip'"
            :class="tugasTab === 'arsip' ? 'bg-[#EFF6FF] text-[#1D4ED8] font-bold border-[#BFDBFE]' : 'bg-white text-[#475569] font-medium border-[#E2E8F0] hover:bg-slate-50'"
            class="min-h-[44px] h-[36px] px-3 rounded-[10px] border text-[12px] whitespace-nowrap flex items-center transition-colors">
            <span>Arsip</span>
            <span class="ml-1" x-text="'(' + (tugasTabCounts.arsip || 0) + ')'">(0)</span>
          </button>
        </div>

        <!-- Filter Tugas Terpadu -->
        <div class="flex items-center gap-2 flex-wrap">
          <div class="relative inline-block">
            <select x-model="tugasMatkul" aria-label="Filter semua mata kuliah"
              class="min-h-[44px] h-[36px] appearance-none pl-3 pr-8 rounded-[10px] bg-white border border-[#CBD5E1] text-[12px] text-[#334155] font-normal hover:border-slate-400 focus:outline-none focus:ring-1 focus:ring-[#2563EB] transition-colors cursor-pointer">
              <option value="Semua">Semua Mata Kuliah</option>
              <template x-for="m in matkulOpts" :key="m">
                <option :value="m" x-text="m">-</option>
              </template>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-[#64748B]">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" class="w-3.5 h-3.5" aria-hidden="true" focusable="false">
                <path d="M3.34619 4.68945q-0.25293 0.08545-0.37939 0.30762-0.04102 0.08545-0.04102 0.25293 0 0.16748 0.04785 0.25977 0.05127 0.08887 1.8628 1.9038 1.81152 1.81152 1.9038 1.8628 0.09229 0.04785 0.25977 0.04785 0.16748 0 0.25635-0.04785 0.09229-0.05127 1.90381-1.8628 1.81494-1.81494 1.86279-1.9038 0.05127-0.09229 0.05127-0.25977 0-0.16748-0.04102-0.25293-0.09912-0.16748-0.28027-0.2666-0.05811-0.02734-0.09912-0.04102-0.04102-0.01367-0.15381-0.01367-0.11279 0-0.15381 0.01367-0.04101 0.01367-0.11279 0.04102-0.09912 0.05811-1.66455 1.62695l-1.56885 1.56543-2.82666-2.81299q-0.31104-0.29395-0.42041-0.37939-0.08545-0.05469-0.19824-0.05469l-0.02735 0q-0.14014 0-0.18115 0.01367z"/>
              </svg>
            </div>
          </div>

          <div class="relative inline-block">
            <select x-model="tugasRentang" aria-label="Filter rentang waktu"
              class="min-h-[44px] h-[36px] appearance-none pl-3 pr-8 rounded-[10px] bg-white border border-[#CBD5E1] text-[12px] text-[#334155] font-normal hover:border-slate-400 focus:outline-none focus:ring-1 focus:ring-[#2563EB] transition-colors cursor-pointer">
              <option value="">Semua Rentang</option>
              <option value="7">7 Hari Terakhir</option>
              <option value="14">14 Hari ke Depan</option>
              <option value="30">30 Hari ke Depan</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-[#64748B]">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" class="w-3.5 h-3.5" aria-hidden="true" focusable="false">
                <path d="M3.34619 4.68945q-0.25293 0.08545-0.37939 0.30762-0.04102 0.08545-0.04102 0.25293 0 0.16748 0.04785 0.25977 0.05127 0.08887 1.8628 1.9038 1.81152 1.81152 1.9038 1.8628 0.09229 0.04785 0.25977 0.04785 0.16748 0 0.25635-0.04785 0.09229-0.05127 1.90381-1.8628 1.81494-1.81494 1.86279-1.9038 0.05127-0.09229 0.05127-0.25977 0-0.16748-0.04102-0.25293-0.09912-0.16748-0.28027-0.2666-0.05811-0.02734-0.09912-0.04102-0.04102-0.01367-0.15381-0.01367-0.11279 0-0.15381 0.01367-0.04101 0.01367-0.11279 0.04102-0.09912 0.05811-1.66455 1.62695l-1.56885 1.56543-2.82666-2.81299q-0.31104-0.29395-0.42041-0.37939-0.08545-0.05469-0.19824-0.05469l-0.02735 0q-0.14014 0-0.18115 0.01367z"/>
              </svg>
            </div>
          </div>

          <button type="button" @click="tugasSort = tugasSort === 'dekat' ? 'jauh' : 'dekat'" title="Urutkan tenggat" aria-label="Urutkan tenggat"
            class="min-h-[44px] h-[36px] w-[36px] rounded-[10px] bg-white border border-[#CBD5E1] flex items-center justify-center text-[#64748B] hover:text-[#1D1B3A] hover:bg-slate-50 transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true" focusable="false">
              <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="8" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Banner Informasi Persetujuan PJ (Tampil saat Tab Perlu Review) -->
      <div x-show="tugasTab === 'review'" x-cloak class="w-full min-h-[50px] flex items-center gap-2.5 px-3.5 py-2.5 bg-[#FFFBEB] border border-[#FDE68A] rounded-[12px] shadow-sm">
        <svg width="19" height="19" viewBox="0 0 14 14" fill="currentColor" class="w-[19px] h-[19px] shrink-0 text-[#B45309]" aria-hidden="true" focusable="false">
          <path d="M7 12.33887q-0.40332 0-0.70068-0.27002-0.29736-0.27002-0.35547-0.66992l2.1123 0q-0.05811 0.3999-0.35547 0.66992-0.29736 0.27002-0.70068 0.27002z m-1.75-1.97217q-0.12305 0-0.2085-0.08203-0.08203-0.08545-0.08203-0.21192 0-0.12305 0.08203-0.20507 0.08545-0.08545 0.2085-0.08545l3.5 0q0.12305 0 0.20508 0.08545 0.08545 0.08203 0.08545 0.20507 0 0.12646-0.08545 0.21192-0.08203 0.08203-0.20508 0.08203l-3.5 0z m-0.25635-1.6167q-0.82715-0.54346-1.30566-1.37402-0.47852-0.83398-0.47852-1.83545 0-1.58594 1.10059-2.68653 1.104-1.104 2.68994-1.104 1.58594 0 2.68652 1.104 1.104 1.10059 1.10401 2.68653 0 1.00146-0.47852 1.83545-0.47852 0.83057-1.30566 1.37402l-4.0127 0z m0.16748-0.58447l3.67774 0q0.65625-0.46484 1.01172-1.14844 0.35889-0.68701 0.35888-1.47656 0-1.33984-0.9331-2.27295-0.93311-0.93311-2.27637-0.93311-1.34326 0-2.27637 0.93311-0.93311 0.93311-0.9331 2.27295 0 0.78955 0.35547 1.47656 0.35889 0.68359 1.01513 1.14844z"/>
        </svg>
        <p class="text-[12px] text-[#92400E] font-normal leading-tight">
          Tugas yang disetujui akan otomatis diperbarui dan disiarkan pengingatnya oleh bot WhatsApp.
        </p>
      </div>

      <!-- Card Container Daftar Tugas -->
      <div class="bg-white rounded-[16px] border border-[#D7DDE7] shadow-[0px_4px_16px_rgba(15,23,42,0.04)] p-5 sm:p-6 space-y-4">
        <!-- Header Daftar Tugas -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-[#F2F4F7]">
          <h2 class="text-[15px] sm:text-[16px] font-bold text-[#1D1B3A]" x-text="tugasTab === 'review' ? 'Usulan menunggu pemeriksaan' : tugasTabTitle()">
            Daftar Tugas Aktif
          </h2>
          <span class="text-[12px] text-[#667085]" x-text="tugasTab === 'review' ? (tugasTabList.length + ' tugas · Urut tenggat terdekat') : ('Menampilkan ' + tugasTabList.length + ' tugas · Diurutkan dari tenggat ' + (tugasSort === 'dekat' ? 'terdekat' : 'terjauh'))">
            Menampilkan 0 tugas · Diurutkan dari tenggat terdekat
          </span>
        </div>

        <!-- Alert Konflik Versi (Review Conflict) -->
        <div x-show="reviewConflict" class="p-4 rounded-xl bg-amber-50 border border-amber-300 text-[13px] text-amber-900 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-[18px] h-[18px] text-amber-700 shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Versi tugas telah diperbarui oleh pengusul. Muat ulang untuk melihat perubahan terbaru.</span>
          </div>
          <button type="button" @click="muatUlangAntrean()" class="min-h-[44px] px-3 font-semibold underline text-amber-900 hover:text-amber-950 shrink-0 self-start sm:self-auto">Muat Versi Terbaru</button>
        </div>

        <!-- State Loading Skeleton -->
        <div x-show="tugasLoading" class="space-y-4 py-4" aria-busy="true" aria-label="Memuat tugas">
          <template x-for="i in [1, 2, 3]" :key="i">
            <div class="flex items-center gap-3.5 pb-4 border-b border-[#F2F4F7] animate-pulse">
              <div class="w-10 h-10 rounded-[10px] bg-slate-100 shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-4 bg-slate-100 rounded w-2/3"></div>
                <div class="h-3 bg-slate-100 rounded w-1/3"></div>
              </div>
              <div class="hidden sm:block w-36 h-4 bg-slate-100 rounded"></div>
              <div class="w-20 h-6 bg-slate-100 rounded-full"></div>
              <div class="w-16 h-8 bg-slate-100 rounded-lg"></div>
            </div>
          </template>
        </div>

        <!-- State Error -->
        <div x-show="tugasListError" class="p-4 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700 flex items-center justify-between">
          <span x-text="tugasListError">-</span>
          <button type="button" @click="loadTasks()" class="min-h-[44px] px-3 font-semibold underline text-red-800 hover:text-red-900">Coba Lagi</button>
        </div>

        <!-- State Kosong - Belum ada tugas sama sekali -->
        <div x-show="!tugasLoading && !tugasListError && tasks.length === 0" class="py-12 text-center space-y-3">
          <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-50 flex items-center justify-center text-[#3965FB]">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8" aria-hidden="true" focusable="false">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
            </svg>
          </div>
          <p class="text-[15px] font-semibold text-[#1D1B3A]">Belum ada tugas untuk semester ini</p>
          <p class="text-[13px] text-[#667085] max-w-sm mx-auto">Tugas yang dibuat atau diajukan oleh PJ mata kuliah akan muncul di sini.</p>
          <button type="button" @click="mulaiTambahTugas()" class="min-h-[44px] h-[40px] px-4 rounded-[12px] bg-[#2563EB] hover:bg-[#1D4ED8] text-[13px] font-semibold text-white inline-flex items-center gap-2 shadow-sm transition-colors mt-2">
            <span>+ Tambah Tugas Baru</span>
          </button>
        </div>

        <!-- State Kosong Khusus Tab Review: Semua tugas sudah diperiksa -->
        <div x-show="!tugasLoading && !tugasListError && tasks.length > 0 && tugasTabList.length === 0 && tugasTab === 'review'" class="py-10 text-center space-y-2">
          <div class="w-12 h-12 mx-auto rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <p class="text-[15px] font-semibold text-[#1D1B3A]">Antrean pemeriksaan bersih</p>
          <p class="text-[13px] text-[#667085]">Semua tugas sudah diperiksa. Tidak ada usulan tugas dari PJ yang menunggu persetujuan Anda saat ini.</p>
        </div>

        <!-- State Kosong Tab Lainnya: Tidak ada yang cocok dengan filter -->
        <div x-show="!tugasLoading && !tugasListError && tasks.length > 0 && tugasTabList.length === 0 && tugasTab !== 'review'" class="py-10 text-center space-y-2">
          <p class="text-[15px] font-semibold text-[#1D1B3A]">Tidak ada tugas yang cocok</p>
          <p class="text-[13px] text-[#667085]" x-text="q.trim() ? 'Tidak ada tugas yang sesuai dengan pencarian dan filter yang dipilih.' : 'Tidak ada tugas dengan filter yang dipilih pada tab ini.'"></p>
          <div class="pt-2">
            <button type="button" @click="q = ''; hapusTugasFilter(); tugasTab = 'aktif'" class="min-h-[44px] px-4 rounded-[10px] border border-[#D7DDE7] hover:bg-slate-50 text-[13px] font-semibold text-[#2563EB] transition-colors">
              Hapus Semua Filter
            </button>
          </div>
        </div>

        <!-- 1. Daftar Tugas: Tab Review (Tampilan Kartu Usulan PJ Sesuai Figma SCR-TASK-001) -->
        <div x-show="!tugasLoading && !tugasListError && tugasTabList.length > 0 && tugasTab === 'review'" class="space-y-4">
          <template x-for="t in tugasTabList" :key="t.id">
            <div class="w-full flex flex-col gap-2.5 p-4 sm:p-5 bg-white border border-[#E2E8F0] rounded-[12px] hover:border-slate-300 transition-colors">
              <!-- Baris Identitas Pengusul & Status -->
              <div class="w-full flex flex-wrap items-center gap-2 sm:gap-2.5">
                <span class="px-2.5 py-1 rounded-[9px] bg-[#EFF6FF] text-[#3965FB] text-[11px] font-semibold tracking-wide uppercase truncate"
                  x-text="(t.matkul || 'UMUM') + ' (' + (selectedClass || '—') + ')'">
                  BASIS DATA (D4-TI 1A)
                </span>
                <span class="text-[12px] text-[#667085] truncate"
                  x-text="'Diajukan oleh: ' + (t.creator_name ? t.creator_name + ' (PJ ' + (t.matkul || 'Mata Kuliah') + ')' : 'PJ ' + (t.matkul || 'Mata Kuliah')) + (t.created_at ? ' · ' + waktuRelatif(t.created_at) : '')">
                  Diajukan oleh: PJ Basis Data · 2 jam yang lalu
                </span>
                <div class="flex-1"></div>
                <span class="px-2.5 py-1 rounded-[9px] bg-[#FEF3C7] border border-[#FDE68A] text-[#92400E] text-[11px] font-semibold shrink-0">
                  Menunggu Persetujuan KM
                </span>
                <span class="text-[11px] text-[#667085] font-mono shrink-0" x-text="'Versi ' + (t.version || 1)">
                  Versi 1
                </span>
              </div>

              <!-- Judul Usulan -->
              <h3 class="text-[16px] font-bold text-[#1D1B3A] tracking-tight line-clamp-1 cursor-pointer hover:text-[#2563EB] transition-colors"
                @click="bukaDetailTugas(t.id)" x-text="t.title || t.deskripsi">
                Judul Tugas
              </h3>

              <!-- Tenggat dan Urgensi -->
              <div class="w-full flex flex-wrap items-center gap-2 text-[13px]">
                <svg width="18" height="18" viewBox="0 0 14 14" fill="currentColor" class="w-[18px] h-[18px] shrink-0 text-[#667085]" aria-hidden="true" focusable="false">

      </div>
      <p class="mt-4 text-[13px] font-medium"><span class="px-3 py-1.5 rounded-lg bg-success">1. Isi data</span> <span class="text-slate-300 mx-1">—</span> <span class="px-3 py-1.5 rounded-lg bg-warning-soft">2. Tinjau</span> <span class="text-slate-300 mx-1">—</span> <span class="text-slate-400">3. Terbit</span></p>

            </div>

          </div>

              <input aria-label="Jam deadline" type="time" x-model="tugasForm.jam" class="ui-field w-full text-[14px] font-mono" />

              <label class="block text-[13px] font-medium mb-1">Instruksi tugas <span class="text-danger">*</span></label>
              <textarea aria-label="Instruksi tugas" x-model="tugasForm.deskripsi" rows="3" placeholder="Jelaskan instruksi dan ketentuan dari dosen..." class="ui-field w-full p-3 text-[14px] resize-none"></textarea>

          </div>
        </div>
      </div>
    </div>

          <p class="mt-2">Mata kuliah: <span x-text="tugasPreview.matkul">-</span></p>
          <p>Tenggat: <span class="font-mono" x-text="fmtDeadlineID(tugasPreview.deadline_at)">-</span></p>
          <p x-show="tugasPreview.jenis">Jenis: <span x-text="tugasPreview.jenis">-</span></p>
          <p class="mt-1 text-slate-600" x-text="tugasPreview.deskripsi">-</p>
          <p class="mt-1">Kumpulkan: <span x-text="tugasPreview.kumpulUrl || tugasPreview.kumpul">-</span></p>
        </div>
        <div class="mt-3 p-3 rounded-xl bg-amber-50 border border-amber-300 text-[13px] text-amber-900 flex gap-2">
          <span class="material-symbols-outlined shrink-0">campaign</span>
          <p>Tugas terbit langsung tampil di portal. Kegagalan pesan WhatsApp tidak membatalkan penerbitan.</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 mt-5">
          <button type="button" @click="tugasSub = 'tambah'" class="ui-button ui-button--ghost flex-1 h-11 rounded-xl border border-border font-medium min-h-[44px]">Ubah Lagi</button>
          <button type="button" @click="terbitTugas()" class="ui-button ui-button--primary flex-1 font-semibold">Terbitkan Tugas</button>
        </div>
      </div>
    </div>
  </template>

  <template x-if="tugasSub === 'detail'">
    <div>
      <button type="button" @click="tugasSub = 'list'; tugasPublishMsg = ''" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-border text-[13px] font-medium hover:bg-slate-50 min-h-[44px] flex items-center gap-1 w-fit"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Kembali ke daftar</button>
      <div x-show="tugasDetailLoading" class="mt-4 py-6 text-center text-[13px] text-slate-400">Memuat detail tugas...</div>
      <div x-show="!tugasDetailLoading && tugasDetail">
        <div x-show="tugasPublishMsg" class="mt-4 p-4 rounded-xl bg-green-50 border border-green-200 text-[13px] text-green-800 flex gap-2">
          <span class="material-symbols-outlined shrink-0">check_circle</span><p x-text="tugasPublishMsg">-</p>
        </div>
        <div class="ui-card p-5 md:p-6 mt-4">
          <p class="text-[12px] font-bold text-primary uppercase tracking-wider" x-text="tugasDetail.matkul">-</p>
          <h1 class="text-[22px] font-bold text-ink mt-1 leading-snug" x-text="tugasDetail.title || tugasDetail.deskripsi">-</h1>
          <div class="mt-2 flex flex-wrap gap-1.5">
            <span class="ui-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 text-slate-600"><span class="material-symbols-outlined text-[14px]">publish</span><span x-text="pubLabel(tugasDetail.publication_status)">-</span></span>
            <span class="ui-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-warning-soft/60 text-amber-900"><span class="material-symbols-outlined text-[14px]">fact_check</span><span x-text="reviewLabel(tugasDetail.review_state) + ' · versi ' + tugasDetail.version">-</span></span>
            <span x-show="tugasDetail.completed_at" class="ui-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-success text-green-800"><span class="material-symbols-outlined text-[14px]">check_circle</span>Selesai</span>
            <span x-show="tugasDetail.archived_at" class="ui-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-200 text-slate-600"><span class="material-symbols-outlined text-[14px]">archive</span>Arsip</span>
          </div>
          <div class="flex gap-2 mt-4 border-b border-border" role="tablist" aria-label="Tab detail tugas">
            <template x-for="tb in [['detail','Detail'],['riwayat','Riwayat'],['notif','Notifikasi']]" :key="tb[0]">
              <button type="button" @click="tugasDetailTab = tb[0]" role="tab" :aria-selected="tugasDetailTab === tb[0]"
                :class="tugasDetailTab === tb[0] ? 'text-primary font-semibold' : 'text-slate-500 border-transparent'"
                class="ui-button ui-button--ghost pb-2 px-1 text-[14px] border-b-2 min-h-[44px]" x-text="tb[1]">-</button>
            </template>
          </div>
          <div x-show="tugasDetailTab === 'detail'" class="mt-4 space-y-2 text-[13px]">
            <p><span class="text-slate-500">Tenggat:</span> <span class="font-mono font-semibold" x-text="tugasDetail.deadline">-</span></p>
            <p x-show="tugasDetail.task_type"><span class="text-slate-500">Jenis:</span> <span x-text="tugasDetail.task_type">-</span></p>
            <p><span class="text-slate-500">Instruksi:</span></p>
            <p class="whitespace-pre-line" x-text="tugasDetail.instructions || tugasDetail.deskripsi">-</p>
            <p><span class="text-slate-500">Tempat pengumpulan:</span> <span x-text="tugasDetail.submission_url || tugasDetail.submission_text || '—'">-</span></p>
            <div class="flex flex-wrap gap-2 pt-2">
              <button type="button" @click="mulaiUbahTugas()" x-show="!tugasDetail.archived_at" class="ui-button ui-button--outline text-primary text-[13px] font-semibold flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">edit</span>Ubah</button>
              <button type="button" @click="tandaiSelesai(tugasDetail.id, tugasDetail.version)" x-show="!tugasDetail.completed_at && !tugasDetail.archived_at" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-green-600 text-green-700 text-[13px] font-semibold min-h-[44px]">Tandai Selesai</button>
              <button type="button" @click="arsipkanTugas(tugasDetail.id, tugasDetail.version)" x-show="!tugasDetail.archived_at" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-border text-[13px] min-h-[44px] flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">archive</span>Arsipkan</button>
              <button type="button" @click="pulihkanTugas(tugasDetail.id, tugasDetail.version)" x-show="tugasDetail.archived_at" class="ui-button ui-button--outline text-primary text-[13px] font-semibold">Pulihkan</button>
            </div>
            <div class="mt-4 p-4 rounded-xl border border-border bg-slate-50">
              <h3 class="text-[14px] font-semibold flex items-center gap-1.5"><span class="material-symbols-outlined text-[18px]">fact_check</span>Periksa Tugas <span class="font-mono font-normal text-[12px] text-slate-500" x-text="'(versi ' + tugasDetail.version + ')'">-</span></h3>
              <div x-show="tugasConflict" class="mt-2 p-3 rounded-xl bg-amber-50 border border-amber-300 text-[13px] text-amber-900">
                <p class="font-semibold">Ada perubahan yang lebih baru</p>
                <button type="button" @click="bukaDetailTugas(tugasDetail.id)" class="ui-button ui-button--ghost mt-2 h-11 px-4 rounded-xl border border-amber-600 text-[13px] font-semibold min-h-[44px]">Muat Versi Terbaru</button>
              </div>
              <div class="mt-2">
                <label class="block text-[13px] font-medium mb-1">Catatan (wajib untuk koreksi/pembatalan)</label>
                <textarea aria-label="Catatan (wajib untuk koreksi/pembatalan)" x-model="reviewNote" rows="2" placeholder="Catatan untuk PJ..." class="ui-field w-full p-3 text-[13px] resize-none"></textarea>
              </div>
              <div class="flex flex-wrap gap-2 mt-2">
                <button type="button" @click="putuskanDetail('APPROVED')" class="ui-button ui-button--primary text-[13px] font-semibold">Setujui</button>
                <button type="button" @click="putuskanDetail('CHANGES_REQUESTED')" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-amber-400 text-amber-800 text-[13px] font-semibold min-h-[44px]">Minta Koreksi</button>
                <button type="button" @click="putuskanDetail('REVOKED')" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-red-300 text-red-700 text-[13px] font-semibold min-h-[44px]">Batalkan</button>
              </div>
            </div>
          </div>
          <div x-show="tugasDetailTab === 'riwayat'" class="mt-4">
            <div x-show="tugasReviews.length === 0" class="ui-empty py-4 text-center text-[13px] text-slate-400">Belum ada riwayat pemeriksaan.</div>
            <div class="space-y-2">
              <template x-for="(r, i) in tugasReviews" :key="i">
                <div class="p-3 rounded-xl bg-slate-50 border border-border text-[13px]">
                  <p class="font-semibold"><span x-text="r.reviewer">-</span> · <span x-text="reviewLabel(r.decision)">-</span> <span class="font-mono font-normal text-slate-500" x-text="'· versi ' + r.version">-</span></p>
                  <p x-show="r.note" class="text-slate-600 mt-0.5" x-text="r.note">-</p>
                  <p class="text-[11px] text-slate-400 mt-0.5" x-text="r.waktu">-</p>
                </div>
              </template>
            </div>
          </div>
          <div x-show="tugasDetailTab === 'notif'" class="mt-4">
            <div class="p-3 rounded-xl bg-slate-50 border border-border text-[13px] text-slate-600 flex gap-2">
              <span class="material-symbols-outlined shrink-0">notifications</span>
              <p>Status publikasi web terpisah dari status pengiriman WhatsApp. Pesan yang gagal akan dicoba lagi otomatis.</p>
            </div>
            <button type="button" @click="go('notifikasi')" class="ui-button ui-button--outline mt-3 text-primary text-[13px] font-semibold">Pantau di Notifikasi</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <template x-if="tugasSub === 'ubah'">
    <div>
      <button type="button" @click="bukaDetailTugas(editTugasId)" class="ui-button ui-button--ghost h-11 px-4 rounded-xl border border-border text-[13px] font-medium hover:bg-slate-50 min-h-[44px] flex items-center gap-1 w-fit"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Kembali ke detail</button>
      <div class="ui-card p-5 md:p-6 mt-4">
        <h1 class="text-[24px] font-bold text-ink">Ubah Tugas</h1>
        <p class="text-[13px] text-slate-500 mt-1">Versi bertambah dan mahasiswa mungkin menerima notifikasi pembaruan.</p>
        <div x-show="tugasConflict" class="mt-3 p-4 rounded-xl bg-amber-50 border border-amber-300 text-[13px] text-amber-900">
          <p class="font-semibold flex items-center gap-1.5"><span class="material-symbols-outlined">warning</span>Ada perubahan yang lebih baru</p>
          <p class="mt-1">Data di server sudah berubah. Input Anda dipertahankan.</p>
          <button type="button" @click="muatUlangVersiTugas()" class="ui-button ui-button--ghost mt-2 h-11 px-4 rounded-xl border border-amber-600 text-amber-900 text-[13px] font-semibold min-h-[44px]">Muat Versi Terbaru</button>
        </div>
        <div x-show="tugasError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="tugasError">-</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
          <div>
            <label class="block text-[13px] font-medium mb-1">Mata kuliah di kelas ini</label>
            <select aria-label="Mata kuliah di kelas ini" x-model="tugasForm.offeringId" class="ui-field w-full text-[14px]">
              <option value="">-- Pilih mata kuliah --</option>
              <template x-for="o in offeringList" :key="o.id"><option :value="o.id" x-text="o.display_name || o.course_code">-</option></template>
            </select>
          </div>
          <div>
            <label class="block text-[13px] font-medium mb-1">Judul tugas <span class="text-danger">*</span></label>
            <input aria-label="Judul tugas" type="text" x-model="tugasForm.judul" class="ui-field w-full text-[14px]" />
          </div>
          <div>
            <label class="block text-[13px] font-medium mb-1">Tanggal deadline <span class="text-danger">*</span></label>
            <input aria-label="Tanggal deadline" type="date" x-model="tugasForm.tanggal" class="ui-field w-full text-[14px]" />
          </div>
          <div>
            <label class="block text-[13px] font-medium mb-1">Jam deadline <span class="text-danger">*</span></label>
            <input aria-label="Jam deadline" type="time" x-model="tugasForm.jam" class="ui-field w-full text-[14px] font-mono" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[13px] font-medium mb-1">Instruksi tugas <span class="text-danger">*</span></label>
            <textarea aria-label="Instruksi tugas" x-model="tugasForm.deskripsi" rows="3" class="ui-field w-full p-3 text-[14px] resize-none"></textarea>
          </div>
          <div>
            <label class="block text-[13px] font-medium mb-1">Jenis tugas</label>
            <select aria-label="Jenis tugas" x-model="tugasForm.jenis" class="ui-field w-full text-[14px]">
              <option>Individu</option><option>Kelompok</option><option>Kuis</option><option>Proyek</option>
            </select>
          </div>
          <div>
            <label class="block text-[13px] font-medium mb-1">Keterangan pengumpulan</label>
            <input aria-label="Keterangan pengumpulan" type="text" x-model="tugasForm.kumpul" class="ui-field w-full text-[14px]" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[13px] font-medium mb-1">Tautan pengumpulan</label>
            <input aria-label="Tautan pengumpulan" type="text" x-model="tugasForm.kumpulUrl" class="ui-field w-full text-[14px]" />
          </div>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 mt-5">
          <button type="button" @click="bukaDetailTugas(editTugasId)" class="ui-button ui-button--ghost flex-1 h-11 rounded-xl border border-border font-medium min-h-[44px]">Batal</button>
          <button type="button" @click="simpanUbahTugas()" class="ui-button ui-button--primary flex-1 font-semibold">Simpan Perubahan</button>
        </div>
      </div>
    </div>
  </template>
</section>
