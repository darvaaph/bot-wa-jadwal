<!-- partials/km/view-anggota.html — KM Penugasan Peran + Undang PJ -->
<section x-show="view === 'anggota'" x-cloak>
  <template x-if="anggotaSub === 'list'">
    <div>
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
        <div>
          <h1 class="text-[26px] md:text-[30px] font-bold text-ink" style="font-family:'Poppins',sans-serif">Penugasan Peran</h1>
          <p class="text-[14px] text-slate-500 mt-1">Kelola PJ mata kuliah di kelas <span class="font-mono" x-text="selectedClass">-</span></p>
        </div>
        <button type="button" @click="anggotaSub = 'undang'" class="h-11 px-5 rounded-xl bg-primary hover:bg-primary-hover text-white text-[14px] font-semibold self-start min-h-[44px]">Undang PJ</button>
      </div>

      <div class="mt-5 p-4 md:p-5 rounded-2xl border border-border bg-white">
        <div class="flex items-center justify-between">
          <h2 id="km-penugasan-heading" tabindex="-1" class="text-[18px] font-semibold">PJ kelas ini</h2>
          <button type="button" @click="loadPenugasan()" class="text-[13px] text-primary font-medium hover:underline min-h-[44px]">Muat ulang</button>
        </div>
        <div x-show="penugasanLoading" class="py-4 text-center text-[13px] text-slate-400">Memuat penugasan...</div>
        <div x-show="penugasanError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700">
          <span x-text="penugasanError">-</span>
          <button type="button" @click="loadPenugasan()" class="ml-2 font-semibold underline min-h-[44px]">Coba Lagi</button>
        </div>
        <div x-show="!penugasanLoading && !penugasanError && penugasanPJ.length === 0" class="mt-3 p-6 rounded-xl border border-dashed border-border text-center">
          <p class="text-[15px] font-semibold">Belum ada PJ terdaftar</p>
          <p class="text-[13px] text-slate-500">Undang PJ pertama untuk mata kuliah kelas ini.</p>
          <button type="button" @click="anggotaSub = 'undang'" class="mt-3 h-11 px-5 rounded-xl bg-primary text-white text-[14px] font-semibold min-h-[44px]">Undang PJ pertama</button>
        </div>
        <div x-show="!penugasanLoading && !penugasanError && penugasanPJ.length > 0" class="mt-3 divide-y divide-border border-t border-b border-border">
          <template x-for="a in penugasanPJ" :key="a.id">
            <div class="py-3">
              <div class="flex flex-col sm:flex-row sm:items-center gap-3">
                <div class="flex-1 min-w-0">
                  <p class="text-[14px] font-semibold break-words" x-text="a.display_name || a.username || ('#' + a.id)">-</p>
                  <div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-1 text-[12px] text-slate-600">
                    <span x-text="penugasanLabel(a.role) + (a.course_code ? ' · ' + a.course_code : '')">-</span>
                    <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold" :class="a.status === 'ACTIVE' ? 'bg-success text-green-900' : (a.status === 'SUSPENDED' ? 'bg-warning-soft text-amber-950' : 'bg-slate-100 text-slate-700')" x-text="a.status === 'ACTIVE' ? 'Aktif' : (a.status === 'SUSPENDED' ? 'Ditangguhkan' : (a.status === 'REVOKED' ? 'Dicabut' : (a.status || '-')))">-</span>
                  </div>
                </div>
                <div x-show="a.status === 'ACTIVE'" class="flex flex-wrap items-center gap-2">
                  <button type="button" @click="mulaiAksiPenugasan(a, 'tangguhkan', $event.currentTarget)" class="h-11 px-4 rounded-lg border border-amber-600 text-amber-900 text-[13px] font-semibold hover:bg-amber-50">Tangguhkan</button>
                  <details class="relative km-assignment-menu" @click.outside="$el.open = false" @keydown.escape.prevent="$el.open = false; $el.querySelector('summary').focus()">
                    <summary class="min-h-[44px] px-3 rounded-lg border border-slate-500 text-slate-700 text-[13px] font-semibold cursor-pointer inline-flex items-center hover:bg-slate-50">Kelola</summary>
                    <div class="absolute right-0 top-full mt-1 z-20 w-48 rounded-xl border border-slate-200 bg-white p-1 shadow-lg">
                      <button type="button" aria-label="Cabut penugasan PJ" @click="mulaiAksiPenugasan(a, 'cabut', $el.closest('details').querySelector('summary')); $el.closest('details').open = false" class="w-full min-h-[44px] px-3 text-left rounded-lg text-[13px] font-semibold text-red-700 hover:bg-red-50">Cabut penugasan</button>
                    </div>
                  </details>
                </div>
                <div x-show="a.status === 'SUSPENDED'">
                  <button type="button" @click="mulaiAksiPenugasan(a, 'cabut', $event.currentTarget)" class="h-11 px-4 rounded-lg border border-red-700 text-red-700 text-[13px] font-semibold hover:bg-red-50">Cabut penugasan</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div x-show="!penugasanLoading && !penugasanError && penugasanKM.length > 0" class="mt-4 p-4 md:p-5 rounded-2xl border border-border bg-white">
        <h2 class="text-[18px] font-semibold">Ketua Murid kelas ini</h2>
        <p class="mt-1 text-[12px] text-slate-600">Penugasan Ketua Murid dikelola System Admin.</p>
        <div class="mt-3 divide-y divide-border border-t border-b border-border">
          <template x-for="a in penugasanKM" :key="a.id">
            <div class="py-3 flex flex-wrap items-center justify-between gap-2">
              <span class="text-[14px] font-semibold break-words" x-text="a.display_name || a.username || ('#' + a.id)">-</span>
              <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold" :class="a.status === 'ACTIVE' ? 'bg-success text-green-900' : (a.status === 'SUSPENDED' ? 'bg-warning-soft text-amber-950' : 'bg-slate-100 text-slate-700')" x-text="a.status === 'ACTIVE' ? 'Aktif' : (a.status === 'SUSPENDED' ? 'Ditangguhkan' : (a.status === 'REVOKED' ? 'Dicabut' : (a.status || '-')))">-</span>
            </div>
          </template>
        </div>
      </div>

      <div class="mt-4 p-5 rounded-2xl border border-border bg-white">
        <div class="flex items-center justify-between">
          <h2 class="text-[18px] font-semibold">Undangan menunggu</h2>
          <button type="button" @click="loadUndanganKM()" class="text-[13px] text-primary font-medium hover:underline min-h-[44px]">Muat ulang</button>
        </div>
        <div x-show="undanganLoading" class="py-4 text-center text-[13px] text-slate-400">Memuat undangan...</div>
        <div x-show="!undanganLoading && undanganList.length === 0" class="mt-2 text-[13px] text-slate-400">Tidak ada undangan menunggu.</div>
        <div x-show="!undanganLoading && undanganList.length > 0" class="mt-3 divide-y divide-border border-t border-b border-border">
          <template x-for="u in undanganList" :key="u.id">
            <div class="py-3 flex flex-col sm:flex-row sm:items-center gap-2">
              <div class="flex-1 min-w-0">
                <p class="text-[14px] font-semibold" x-text="penugasanLabel(u.role) + (u.course_code ? ' · ' + u.course_code : '')">-</p>
                <p class="text-[12px] text-slate-500 font-mono" x-text="'Berlaku hingga ' + (u.expires_at || '-')">-</p>
              </div>
              <button type="button" @click="cabutUndanganKM(u.id)" class="h-10 px-4 rounded-lg border border-red-200 text-red-700 text-[12px] font-semibold min-h-[44px]">Cabut undangan</button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <dialog id="km-penugasan-dialog" class="km-assignment-dialog" aria-labelledby="km-penugasan-dialog-title" aria-describedby="km-penugasan-dialog-desc" @cancel="if (penugasanSaving) $event.preventDefault()" @close="selesaikanAksiPenugasan()">
    <div class="p-5 md:p-6">
      <h2 id="km-penugasan-dialog-title" class="text-[19px] font-semibold" x-text="penugasanAksi?.aksi === 'cabut' ? 'Cabut penugasan PJ?' : 'Tangguhkan penugasan PJ?'">-</h2>
      <div class="mt-3 rounded-xl bg-slate-50 px-4 py-3">
        <p class="text-[14px] font-semibold break-words" x-text="penugasanAksi?.nama">-</p>
        <p class="mt-1 text-[12px] text-slate-700 break-words">
          <span x-text="penugasanAksi?.mataKuliah">-</span>
          <span x-show="penugasanAksi?.kode && penugasanAksi?.kode !== penugasanAksi?.mataKuliah" x-text="' · ' + penugasanAksi?.kode"></span>
        </p>
      </div>
      <div id="km-penugasan-dialog-desc" class="mt-4 text-[13px] leading-6 text-slate-700">
        <p x-show="penugasanAksi?.aksi === 'tangguhkan'">Akses PJ untuk mata kuliah ini berhenti segera dan sesi aktifnya berakhir. Riwayat tetap tersimpan.</p>
        <p x-show="penugasanAksi?.aksi === 'cabut'">Akses PJ untuk mata kuliah ini berhenti segera dan sesi aktifnya berakhir. Penugasan yang dicabut tidak dapat diaktifkan lagi. Riwayat tetap tersimpan.</p>
      </div>
      <label for="km-penugasan-alasan" class="block mt-4 mb-1 text-[13px] font-semibold">Alasan tindakan <span class="text-red-700">*</span></label>
      <textarea id="km-penugasan-alasan" x-model="penugasanAlasan" @input="penugasanError = ''" rows="2" required autofocus aria-describedby="km-penugasan-error" placeholder="Tulis alasan singkat" class="w-full min-h-[88px] px-3 py-2.5 rounded-xl border border-slate-500 text-[14px] bg-white resize-y"></textarea>
      <p id="km-penugasan-error" x-show="penugasanError" class="mt-1 text-[12px] text-red-700" role="alert" x-text="penugasanError"></p>
      <div class="mt-5 flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
        <button type="button" @click="tutupAksiPenugasan()" :disabled="penugasanSaving" class="h-11 px-5 rounded-xl border border-slate-500 text-slate-700 text-[13px] font-semibold disabled:opacity-50">Batal</button>
        <button type="button" @click="jalankanAksiPenugasan()" :disabled="penugasanSaving" :class="penugasanAksi?.aksi === 'cabut' ? 'bg-red-700 hover:bg-red-800' : 'bg-amber-700 hover:bg-amber-800'" class="h-11 px-5 rounded-xl text-white text-[13px] font-semibold disabled:opacity-50" x-text="penugasanSaving ? 'Memproses...' : (penugasanAksi?.aksi === 'cabut' ? 'Cabut penugasan' : 'Tangguhkan penugasan')">-</button>
      </div>
    </div>
  </dialog>

  <template x-if="anggotaSub === 'undang'">
    <div class="p-5 md:p-6 rounded-2xl border border-border bg-white max-w-3xl">
      <h1 class="text-[24px] font-bold text-ink" style="font-family:'Poppins',sans-serif">Undang PJ Mata Kuliah</h1>
      <p class="text-[13px] text-slate-500 mt-1">Calon PJ menerima tautan undangan sekali pakai via WhatsApp.</p>
      <div x-show="undangError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="undangError">-</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Mata kuliah di kelas ini <span class="text-danger">*</span></label>
          <select x-model="undang.offeringId" class="w-full h-11 px-3 rounded-xl border border-border text-[14px] bg-white focus:outline-none focus:ring-2 focus:ring-primary">
            <option value="">-- Pilih mata kuliah --</option>
            <template x-for="o in offeringList" :key="o.id"><option :value="o.id" x-text="o.display_name || o.course_code">-</option></template>
          </select>
          <p x-show="!offeringLoading && pesanOffering()" class="text-[12px] text-amber-800 mt-1">
            <span x-text="pesanOffering()">-</span>
            <button type="button" @click="loadOfferings()" class="font-semibold underline ml-1 min-h-[44px] inline-flex items-center">Muat ulang</button>
          </p>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Nomor WhatsApp calon PJ <span class="text-danger">*</span></label>
          <input type="text" x-model="undang.nomor" placeholder="0812 3456 7890" class="w-full h-11 px-3 rounded-xl border border-border text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-primary" />
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="anggotaSub = 'list'" class="flex-1 h-11 rounded-xl border border-primary text-primary font-medium min-h-[44px]">Batal</button>
        <button type="button" @click="buatUndangPJ()" class="flex-1 h-11 rounded-xl bg-primary hover:bg-primary-hover text-white font-semibold min-h-[44px]">Buat tautan undangan</button>
      </div>
    </div>
  </template>

  <template x-if="anggotaSub === 'siap'">
    <div class="p-5 md:p-6 rounded-2xl border border-border bg-white max-w-3xl text-center">
      <span class="inline-flex w-14 h-14 rounded-full bg-success items-center justify-center"><span class="material-symbols-outlined text-[28px] text-emerald-700">check_circle</span></span>
      <h1 class="text-[24px] font-bold mt-3">Undangan PJ siap</h1>
      <p class="text-[13px] text-slate-500 mt-1">Kirim tautan berikut ke calon PJ via WhatsApp.</p>
      <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-border font-mono text-[13px] break-all" x-text="undangLink">-</div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="copyText(undangLink, 'Tautan undangan tersalin.')" class="flex-1 h-11 rounded-xl border border-primary text-primary font-medium min-h-[44px]">Salin tautan</button>
        <button type="button" @click="anggotaSub = 'list'; loadPenugasan(); loadUndanganKM()" class="flex-1 h-11 rounded-xl bg-primary text-white font-semibold min-h-[44px]">Kembali ke penugasan</button>
      </div>
      <p class="text-[11px] text-slate-400 mt-3">Tautan berlaku 7 hari dan hanya dapat digunakan satu kali untuk aktivasi.</p>
    </div>
  </template>
</section>
