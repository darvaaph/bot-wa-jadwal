<!-- partials/km/view-anggota.html — KM Anggota & Tim + Undang PJ + siap (draf lokal) -->
<section x-show="view === 'anggota'" x-cloak>
  <template x-if="anggotaSub === 'list'">
    <div>
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
        <div>
          <h1 class="text-[26px] md:text-[30px] font-bold text-[#1F1F1F]" style="font-family:'Poppins',sans-serif">Anggota &amp; Tim</h1>
          <p class="text-[14px] text-slate-500 mt-1">Kelola PJ mata kuliah di kelas <span class="font-mono" x-text="selectedClass">-</span></p>
        </div>
        <button type="button" @click="anggotaSub = 'undang'" class="h-11 px-5 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-semibold self-start min-h-[44px]">Undang PJ</button>
      </div>
      <div class="mt-5 p-10 rounded-2xl border border-dashed border-[#EEEEEE] bg-white text-center">
        <p class="text-[15px] font-semibold">Belum ada data pengurus</p>
        <p class="text-[13px] text-slate-500">Daftar PJ tampil di sini setelah endpoint pengguna tersedia.</p>
        <button type="button" @click="anggotaSub = 'undang'" class="mt-3 h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold min-h-[44px]">Undang PJ pertama</button>
      </div>
    </div>
  </template>

  <template x-if="anggotaSub === 'undang'">
    <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white max-w-3xl">
      <h1 class="text-[24px] font-bold text-[#1F1F1F]" style="font-family:'Poppins',sans-serif">Undang PJ Mata Kuliah</h1>
      <p class="text-[13px] text-slate-500 mt-1">Calon PJ menerima tautan undangan sekali pakai via WhatsApp.</p>
      <div x-show="undangError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="undangError">-</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Mata kuliah di kelas ini <span class="text-[#FF6C48]">*</span></label>
          <select x-model="undang.offeringId" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white focus:outline-none focus:ring-2 focus:ring-[#3965FB]">
            <option value="">-- Pilih mata kuliah --</option>
            <template x-for="o in offeringList" :key="o.id"><option :value="o.id" x-text="o.display_name || o.course_code">-</option></template>
          </select>
          <p x-show="!offeringLoading && pesanOffering()" class="text-[12px] text-amber-800 mt-1">
            <span x-text="pesanOffering()">-</span>
            <button type="button" @click="loadOfferings()" class="font-semibold underline ml-1">Muat ulang</button>
          </p>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Nomor WhatsApp calon PJ <span class="text-[#FF6C48]">*</span></label>
          <input type="text" x-model="undang.nomor" placeholder="0812 3456 7890" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="anggotaSub = 'list'" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] font-medium min-h-[44px]">Batal</button>
        <button type="button" @click="buatUndangPJ()" class="flex-1 h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white font-semibold min-h-[44px]">Buat tautan undangan</button>
      </div>
    </div>
  </template>

  <template x-if="anggotaSub === 'siap'">
    <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white max-w-3xl text-center">
      <span class="inline-flex w-14 h-14 rounded-full bg-[#E1FFB7] items-center justify-center"><span class="material-symbols-outlined text-[28px] text-emerald-700">check_circle</span></span>
      <h1 class="text-[24px] font-bold mt-3">Undangan PJ siap</h1>
      <p class="text-[13px] text-slate-500 mt-1">Kirim tautan berikut ke calon PJ via WhatsApp.</p>
      <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-[#EEEEEE] font-mono text-[13px] break-all" x-text="undangLink">-</div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="copyText(undangLink, 'Tautan undangan tersalin.')" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] font-medium min-h-[44px]">Salin tautan</button>
        <button type="button" @click="anggotaSub = 'list'" class="flex-1 h-11 rounded-xl bg-[#3965FB] text-white font-semibold min-h-[44px]">Kembali ke anggota</button>
      </div>
      <p class="text-[11px] text-slate-400 mt-3">Tautan berlaku 7 hari dan hanya dapat digunakan satu kali untuk aktivasi.</p>
    </div>
  </template>
</section>
