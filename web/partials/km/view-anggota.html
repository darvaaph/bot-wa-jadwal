<!-- partials/km/view-anggota.html — KM Penugasan Peran + Undang PJ -->
<section x-show="view === 'anggota'" x-cloak>
  <template x-if="anggotaSub === 'list'">
    <div>
      <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
        <div>
          <h1 class="text-[26px] md:text-[30px] font-bold text-[#1F1F1F]" style="font-family:'Poppins',sans-serif">Penugasan Peran</h1>
          <p class="text-[14px] text-slate-500 mt-1">Kelola PJ mata kuliah di kelas <span class="font-mono" x-text="selectedClass">-</span></p>
        </div>
        <button type="button" @click="anggotaSub = 'undang'" class="h-11 px-5 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white text-[14px] font-semibold self-start min-h-[44px]">Undang PJ</button>
      </div>

      <div class="mt-5 p-5 rounded-2xl border border-[#EEEEEE] bg-white">
        <div class="flex items-center justify-between">
          <h2 class="text-[18px] font-semibold">PJ kelas ini</h2>
          <button type="button" @click="loadPenugasan()" class="text-[13px] text-[#3965FB] font-medium hover:underline min-h-[44px]">Muat ulang</button>
        </div>
        <div x-show="penugasanLoading" class="py-4 text-center text-[13px] text-slate-400">Memuat penugasan...</div>
        <div x-show="penugasanError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700">
          <span x-text="penugasanError">-</span>
          <button type="button" @click="loadPenugasan()" class="ml-2 font-semibold underline">Coba Lagi</button>
        </div>
        <div x-show="!penugasanLoading && !penugasanError && penugasanList.length === 0" class="mt-3 p-6 rounded-xl border border-dashed border-[#EEEEEE] text-center">
          <p class="text-[15px] font-semibold">Belum ada PJ terdaftar</p>
          <p class="text-[13px] text-slate-500">Undang PJ pertama untuk mata kuliah kelas ini.</p>
          <button type="button" @click="anggotaSub = 'undang'" class="mt-3 h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[14px] font-semibold min-h-[44px]">Undang PJ pertama</button>
        </div>
        <div x-show="!penugasanLoading && penugasanList.length > 0" class="mt-3 divide-y divide-[#EEEEEE] border-t border-b border-[#EEEEEE]">
          <template x-for="a in penugasanList" :key="a.id">
            <div class="py-3">
              <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                <div class="flex-1 min-w-0">
                  <p class="text-[14px] font-semibold truncate" x-text="a.display_name || a.username || ('#' + a.id)">-</p>
                  <p class="text-[12px] text-slate-500" x-text="penugasanLabel(a.role) + (a.course_code ? ' · ' + a.course_code : '') + (a.status ? ' · ' + a.status : '')">-</p>
                </div>
                <div class="flex gap-2">
                  <button type="button" @click="mulaiAksiPenugasan(a, 'tangguhkan')" class="h-10 px-4 rounded-lg border border-amber-400 text-amber-800 text-[12px] font-semibold min-h-[44px]">Tangguhkan</button>
                  <button type="button" @click="mulaiAksiPenugasan(a, 'cabut')" class="h-10 px-4 rounded-lg border border-red-200 text-red-700 text-[12px] font-semibold min-h-[44px]">Cabut</button>
                </div>
              </div>
              <div x-show="penugasanAksi && penugasanAksi.id === a.id" class="mt-2 p-3 rounded-xl bg-slate-50 border border-[#EEEEEE]">
                <p class="text-[13px] font-semibold" x-text="(penugasanAksi.aksi === 'cabut' ? 'Cabut ' : 'Tangguhkan ') + penugasanAksi.nama">-</p>
                <p class="text-[12px] text-slate-500 mt-0.5">Pencabutan efektif segera. Data dan riwayat PJ lama tetap tersimpan.</p>
                <label class="block text-[13px] font-medium mt-2 mb-1">Alasan <span class="text-red-600">*</span></label>
                <input type="text" x-model="penugasanAlasan" placeholder="Contoh: Masa tugas selesai" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white" />
                <div class="flex flex-col sm:flex-row gap-2 mt-2">
                  <button type="button" @click="jalankanAksiPenugasan()" class="h-11 px-5 rounded-xl bg-[#3965FB] text-white text-[13px] font-semibold min-h-[44px]">Konfirmasi</button>
                  <button type="button" @click="penugasanAksi = null" class="h-11 px-4 rounded-xl border border-[#EEEEEE] text-[13px] min-h-[44px]">Batal</button>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>

      <div class="mt-4 p-5 rounded-2xl border border-[#EEEEEE] bg-white">
        <div class="flex items-center justify-between">
          <h2 class="text-[18px] font-semibold">Undangan menunggu</h2>
          <button type="button" @click="loadUndanganKM()" class="text-[13px] text-[#3965FB] font-medium hover:underline min-h-[44px]">Muat ulang</button>
        </div>
        <div x-show="undanganLoading" class="py-4 text-center text-[13px] text-slate-400">Memuat undangan...</div>
        <div x-show="!undanganLoading && undanganList.length === 0" class="mt-2 text-[13px] text-slate-400">Tidak ada undangan menunggu.</div>
        <div x-show="!undanganLoading && undanganList.length > 0" class="mt-3 divide-y divide-[#EEEEEE] border-t border-b border-[#EEEEEE]">
          <template x-for="u in undanganList" :key="u.id">
            <div class="py-3 flex flex-col sm:flex-row sm:items-center gap-2">
              <div class="flex-1 min-w-0">
                <p class="text-[14px] font-semibold" x-text="penugasanLabel(u.role) + (u.course_code ? ' · ' + u.course_code : '')">-</p>
                <p class="text-[12px] text-slate-500 font-mono" x-text="'Berlaku hingga ' + (u.expires_at || '-')">-</p>
              </div>
              <button type="button" @click="cabutUndanganKM(u.id)" class="h-10 px-4 rounded-lg border border-red-200 text-red-700 text-[12px] font-semibold min-h-[44px]">Cabut undangan</button>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <template x-if="anggotaSub === 'undang'">
    <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white max-w-3xl">
      <h1 class="text-[24px] font-bold text-[#1F1F1F]" style="font-family:'Poppins',sans-serif">Undang PJ Mata Kuliah</h1>
      <p class="text-[13px] text-slate-500 mt-1">Calon PJ menerima tautan undangan sekali pakai via WhatsApp.</p>
      <div x-show="undangError" class="mt-3 p-3 rounded-xl bg-red-50 border border-red-200 text-[13px] text-red-700" x-text="undangError">-</div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="block text-[13px] font-medium mb-1">Mata kuliah di kelas ini <span class="text-[#FF6C48]">*</span></label>
          <select x-model="undang.offeringId" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] bg-white focus:outline-none focus:ring-2 focus:ring-[#3965FB]">
            <option value="">-- Pilih mata kuliah --</option>
            <template x-for="o in offeringList" :key="o.id"><option :value="o.id" x-text="o.display_name || o.course_code">-</option></template>
          </select>
          <p x-show="!offeringLoading && pesanOffering()" class="text-[12px] text-amber-800 mt-1">
            <span x-text="pesanOffering()">-</span>
            <button type="button" @click="loadOfferings()" class="font-semibold underline ml-1">Muat ulang</button>
          </p>
        </div>
        <div>
          <label class="block text-[13px] font-medium mb-1">Nomor WhatsApp calon PJ <span class="text-[#FF6C48]">*</span></label>
          <input type="text" x-model="undang.nomor" placeholder="0812 3456 7890" class="w-full h-11 px-3 rounded-xl border border-[#EEEEEE] text-[14px] font-mono focus:outline-none focus:ring-2 focus:ring-[#3965FB]" />
        </div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="anggotaSub = 'list'" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] font-medium min-h-[44px]">Batal</button>
        <button type="button" @click="buatUndangPJ()" class="flex-1 h-11 rounded-xl bg-[#3965FB] hover:bg-[#2f54d6] text-white font-semibold min-h-[44px]">Buat tautan undangan</button>
      </div>
    </div>
  </template>

  <template x-if="anggotaSub === 'siap'">
    <div class="p-5 md:p-6 rounded-2xl border border-[#EEEEEE] bg-white max-w-3xl text-center">
      <span class="inline-flex w-14 h-14 rounded-full bg-[#E1FFB7] items-center justify-center"><span class="material-symbols-outlined text-[28px] text-emerald-700">check_circle</span></span>
      <h1 class="text-[24px] font-bold mt-3">Undangan PJ siap</h1>
      <p class="text-[13px] text-slate-500 mt-1">Kirim tautan berikut ke calon PJ via WhatsApp.</p>
      <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-[#EEEEEE] font-mono text-[13px] break-all" x-text="undangLink">-</div>
      <div class="flex flex-col sm:flex-row gap-3 mt-5">
        <button type="button" @click="copyText(undangLink, 'Tautan undangan tersalin.')" class="flex-1 h-11 rounded-xl border border-[#3965FB] text-[#3965FB] font-medium min-h-[44px]">Salin tautan</button>
        <button type="button" @click="anggotaSub = 'list'; loadPenugasan(); loadUndanganKM()" class="flex-1 h-11 rounded-xl bg-[#3965FB] text-white font-semibold min-h-[44px]">Kembali ke penugasan</button>
      </div>
      <p class="text-[11px] text-slate-400 mt-3">Tautan berlaku 7 hari dan hanya dapat digunakan satu kali untuk aktivasi.</p>
    </div>
  </template>
</section>
