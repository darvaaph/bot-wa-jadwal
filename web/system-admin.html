<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk - Area System Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function() {
      const token = localStorage.getItem('access_token') || localStorage.getItem('token');
      if (!token) {
        window.location.replace('/login.html?role=sa');
      }
    })();
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="/js/api.js?v=20261008"></script>
  <script src="/js/app-system-admin.js?v=20261008"></script>
</head>
<!--
  AREA SYSTEM ADMIN (REVISI Figma, terpisah dari Area KM, tanpa role switcher).
  Isi per layar: web/partials/system-admin/*.html dimuat oleh initSystemAdmin() di js/app-system-admin.js.
-->
<body class="bg-white text-[#1F1F1F] min-h-screen" x-data="systemAdminApp()" x-init="initSystemAdmin()" @keydown.escape.window="drawer = false">

  <div id="sa-sidebar"></div>

  <div class="md:pl-[248px] flex flex-col min-h-screen min-w-0">
    <div id="sa-topbar"></div>
    <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 md:px-8 py-6 pb-24 md:pb-10">
      <div id="sa-dashboard"></div>
      <div id="sa-kelas"></div>
      <div id="sa-undang"></div>
      <div id="sa-dukungan"></div>
      <div id="sa-antrean"></div>
      <div id="sa-backup"></div>
      <div id="sa-soon"></div>
    </main>
  </div>

  <div id="sa-drawer"></div>
  <div id="sa-toast"></div>
  <div id="sa-auth"></div>

</body>
</html>
