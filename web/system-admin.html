<!DOCTYPE html>
<html lang="id">
<head>

  <link rel="stylesheet" href="/css/tailwind.css?v=20261005" />

      }
    })();

<!--
  AREA SYSTEM ADMIN (REVISI Figma, terpisah dari Area KM, tanpa role switcher).
  Isi per layar: web/partials/system-admin/*.html dimuat oleh initSystemAdmin() di js/app-system-admin.js.
  View kanonis: dashboard, kelas (+buat/detail/undang/undang-siap), pengguna,
  antrean, audit (+pembaruan), master-ruangan, master-matkul, master-dosen, backup.
-->
<body class="bg-white text-ink min-h-screen" x-data="systemAdminApp()" x-init="initSystemAdmin()" @keydown.escape.window="shellCloseDrawer(); kelasMenu = null; penggunaMenu = null; matkulMenu = null; dosenMenu = null; detailMenu = null; smMenu = null; smPratinjau = null; kelasStatusConfirm = null; portalModeConfirm = null; penggunaAksi = null; penugasanAksi = null; penugasanGuard = false; penugasanForce = false; undanganAksi = null; kanalLepas = null; ruangEdit = null; ruangStatusConfirm = null; batalUbahMatkul(); matkulStatusConfirm = null; usulanKeputusan = null; notifDetailId = null; tutupModalTambahMatkul(); tutupModalImportMatkul()">

</body>
</html>
