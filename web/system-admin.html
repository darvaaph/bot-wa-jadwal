<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk - Area System Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function() {
      const token = localStorage.getItem('access_token') || localStorage.getItem('token');
      if (!token) {
        window.location.replace('/login.html?role=sa');
      }
    })();
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="/js/api.js?v=20261011"></script>
  <script src="/js/app-system-admin.js?v=20261014"></script>
</head>
<!--
  AREA SYSTEM ADMIN (REVISI Figma, terpisah dari Area KM, tanpa role switcher).
  Isi per layar: web/partials/system-admin/*.html dimuat oleh initSystemAdmin() di js/app-system-admin.js.
  View kanonis: dashboard, kelas (+buat/detail/undang/undang-siap), pengguna, dukungan,
  antrean, audit, status-bot, master-ruangan, master-matkul, backup.
-->
<body class="bg-white text-[#1F1F1F] min-h-screen" x-data="systemAdminApp()" x-init="initSystemAdmin()" @keydown.escape.window="drawer = false; kelasStatusConfirm = null; portalModeConfirm = null; penggunaAksi = null; penugasanAksi = null; penugasanGuard = false; penugasanForce = false; undanganAksi = null; ruangEdit = null; ruangStatusConfirm = null; matkulEdit = null; matkulStatusConfirm = null; usulanKeputusan = null; notifDetailId = null">

  <div id="sa-sidebar"></div>

  <div class="flex flex-col min-h-screen min-w-0 transition-[padding] duration-300 ease-[cubic-bezier(0.22,1,0.36,1)]" :class="sidebarCollapsed ? 'md:pl-[76px]' : 'md:pl-[248px]'">
    <div id="sa-topbar"></div>
    <div x-show="dukunganAktif" x-cloak class="bg-amber-100 border-b border-amber-300 px-4 md:px-8 py-3" role="status">
      <div class="max-w-[1280px] mx-auto flex flex-col sm:flex-row sm:items-center gap-2 text-[13px] text-amber-900">
        <p class="flex-1"><span class="font-bold">Mode Dukungan aktif</span> — <span x-text="namaDukungan()"></span> · Alasan: <span x-text="dukunganAktif ? (dukunganAktif.reason || dukunganAktif.alasan) : ''"></span><span x-show="dukunganAktif && dukunganAktif.expires_at" x-text="' · s.d. ' + fmtWaktuID(dukunganAktif.expires_at)"></span></p>
        <div class="flex gap-2">
          <button type="button" @click="bukaDetail(dukunganAktif.class_slug || dukunganAktif.slug)" class="h-10 px-4 rounded-lg border border-amber-400 text-[12px] font-semibold min-h-[44px]">Lihat kelas</button>
          <button type="button" @click="keluarDukungan()" :disabled="dukunganLoading" class="h-10 px-4 rounded-lg bg-amber-600 text-white text-[12px] font-semibold min-h-[44px] disabled:opacity-60">Keluar</button>
        </div>
      </div>
    </div>
    <main class="flex-1 w-full max-w-[1280px] mx-auto px-4 md:px-8 py-6 pb-24 md:pb-10">
      <div id="sa-state"></div>
      <div id="sa-dashboard"></div>
      <div id="sa-kelas"></div>
      <div id="sa-undang"></div>
      <div id="sa-dukungan"></div>
      <div id="sa-antrean"></div>
      <div id="sa-backup"></div>
      <div id="sa-pengguna"></div>
      <div id="sa-ruangan"></div>
      <div id="sa-matkul"></div>
      <div id="sa-soon"></div>
    </main>
  </div>

  <div id="sa-drawer"></div>
  <div id="sa-toast"></div>
  <div id="sa-auth"></div>

</body>
</html>
